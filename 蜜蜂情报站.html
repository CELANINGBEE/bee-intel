<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 蜜蜂情报站</title>
<style>
:root {
  --bg: #f5f6f8;
  --card-bg: #fff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-light: #9ca3af;
  --border: #e5e7eb;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --green: #059669;
  --green-light: #d1fae5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  padding: 28px 24px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner { max-width: 1100px; margin: 0 auto; }
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
.logo-sub { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 400; }
.header-date { text-align: right; }
.date-main { font-size: 14px; font-weight: 600; }
.date-sub { font-size: 11px; color: rgba(255,255,255,0.55); }

/* Mode tabs */
.mode-nav {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 4px;
}
.mode-btn {
  flex: 1;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.25s;
  white-space: nowrap;
}
.mode-btn:hover { color: rgba(255,255,255,0.85); }
.mode-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

.main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
.mode-content { display: none; }
.mode-content.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ====== Knowledge Base Mode ====== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(79,70,229,0.08); }
.stat-number { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.cat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
}
.cat-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(79,70,229,0.1); transform: translateY(-1px); }
.cat-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.cat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.cat-icon-bg-ecommerce { background: #fef3c7; }
.cat-icon-bg-retail { background: #e0f2fe; }
.cat-icon-bg-ai { background: #ede9fe; }
.cat-icon-bg-business { background: #d1fae5; }
.cat-icon-bg-data { background: #fce7f3; }
.cat-name { font-size: 16px; font-weight: 700; }
.cat-count { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.cat-desc { font-size: 12px; color: var(--text-light); line-height: 1.5; margin-bottom: 10px; padding-left: 52px; }
.cat-tags { display: flex; gap: 4px; flex-wrap: wrap; padding-left: 52px; }
.cat-tag { font-size: 10px; padding: 2px 10px; border-radius: 10px; background: var(--accent-light); color: var(--accent); font-weight: 500; }

.cat-items {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
  opacity: 0;
  margin-top: 0;
}
.cat-card.expanded .cat-items { max-height: 2000px; opacity: 1; margin-top: 14px; }
.cat-card.expanded { border-color: var(--accent); background: #fafbff; }

.kb-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.kb-item:last-child { border-bottom: none; }
.kb-item-info { flex: 1; min-width: 0; }
.kb-item-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  line-height: 1.5;
  transition: color 0.15s;
}
.kb-item-title:hover { color: var(--accent); text-decoration: underline; }
.kb-item-meta { font-size: 11px; color: var(--text-light); margin-top: 3px; }
.kb-item-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
  padding: 3px 10px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.kb-item-link:hover { background: var(--accent-light); }

/* ====== Dashboard Mode ====== */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.date-arrow {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card-bg);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  color: var(--text-secondary);
}
.date-arrow:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.date-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
.date-display { font-size: 18px; font-weight: 700; min-width: 130px; text-align: center; }
.date-weekday { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
.date-dot-wrap { display: flex; gap: 6px; align-items: center; }
.date-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.2s; }
.date-dot.has-data { background: var(--accent); box-shadow: 0 0 4px rgba(79,70,229,0.4); }
.date-dot.active { background: var(--accent); transform: scale(1.3); }

.dash-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  margin-bottom: 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
}
.dash-tab {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  white-space: nowrap;
}
.dash-tab:hover { color: var(--text); background: var(--bg); }
.dash-tab.active { background: var(--accent); color: #fff; }
.dash-tab-count {
  display: inline-block;
  background: rgba(0,0,0,0.08);
  border-radius: 8px;
  padding: 0 6px;
  font-size: 10px;
  margin-left: 4px;
  line-height: 18px;
}
.dash-tab.active .dash-tab-count { background: rgba(255,255,255,0.2); }

.dash-content { display: none; }
.dash-content.active { display: block; }

.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(79,70,229,0.08); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; line-height: 1.5; transition: color 0.15s; }
.card-title:hover { color: var(--accent); text-decoration: underline; }
.card-source { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }
.card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 10px; border-radius: 10px; font-weight: 500; }
.tag-ecommerce { background: #fef3c7; color: #92400e; }
.tag-retail { background: #e0f2fe; color: #075985; }
.tag-ai { background: #ede9fe; color: #5b21b6; }
.tag-business { background: #d1fae5; color: #065f46; }
.tag-data { background: #fce7f3; color: #9d174d; }
.card-link-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 500;
  padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent);
  transition: all 0.15s; white-space: nowrap;
}
.card-link-btn:hover { background: var(--accent-light); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.35; }
.empty-text { font-size: 15px; }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
  gap: 8px;
}
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-light); color: var(--accent);
  padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.footer { text-align: center; padding: 24px; color: var(--text-light); font-size: 12px; border-top: 1px solid var(--border); }

/* ── KB search bar ── */
.kb-search { margin-bottom: 16px; position: relative; }
.kb-search-input {
  width: 100%; padding: 12px 16px 12px 42px;
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; background: var(--card-bg); color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.kb-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.kb-search-input::placeholder { color: var(--text-light); }
.kb-search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text-light); pointer-events: none;
}
.kb-search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-light);
  cursor: pointer; font-size: 18px; padding: 4px 8px; display: none; line-height: 1;
}
.kb-search-clear.visible { display: block; }
.kb-search-clear:hover { color: var(--text); }

/* ── Date group within KB ── */
.date-group { margin: 4px 0; }
.date-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; cursor: pointer; border-radius: 8px;
  transition: background 0.15s; font-size: 13px; user-select: none;
}
.date-group-header:hover { background: var(--bg); }
.date-group-arrow { font-size: 9px; color: var(--text-light); width: 12px; text-align: center; transition: transform 0.2s; }
.date-group-label { font-weight: 600; color: var(--text-secondary); }
.date-group-count { font-size: 11px; color: var(--text-light); margin-left: auto; }
.date-group-items { padding-left: 0; }
.date-group-items .kb-item:last-child { border-bottom: none; }

@media (max-width: 640px) {
  .header { padding: 20px 16px 0; }
  .header-top { flex-direction: column; align-items: flex-start; gap: 6px; }
  .header-date { text-align: left; }
  .mode-btn { padding: 8px 14px; font-size: 13px; }
  .main { padding: 16px 16px 32px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .cat-grid { grid-template-columns: 1fr; }
  .date-nav { flex-wrap: wrap; }
  .card-header { flex-direction: column; }
  .card-footer { flex-direction: column; align-items: flex-start; }
  .dash-tabs { padding: 2px; }
  .dash-tab { padding: 6px 10px; font-size: 12px; }
}
/* ── Talk Daily mode ── */
.talk-section { margin-bottom: 24px; }
.talk-section-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.talk-headline-card {
  background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
  border: 1px solid #fcd34d;
  border-radius: 14px; padding: 20px 24px;
  margin-bottom: 14px;
}
.talk-headline-title { font-size: 18px; font-weight: 700; color: #92400e; margin-bottom: 4px; }
.talk-headline-source { font-size: 11px; color: #b45309; margin-bottom: 10px; }
.talk-headline-oneliner { font-size: 14px; color: #78350f; background: rgba(255,255,255,0.6); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; line-height: 1.6; }
.talk-scene-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.talk-scene-tab {
  padding: 6px 14px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,0.5); border: 1px solid #fde68a;
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
  color: #92400e; white-space: nowrap;
}
.talk-scene-tab:hover { background: rgba(255,255,255,0.8); }
.talk-scene-tab.active { background: #fff; border-color: #f59e0b; box-shadow: 0 1px 4px rgba(245,158,11,0.2); }
.talk-scene-content {
  font-size: 14px; color: var(--text); line-height: 1.7;
  background: rgba(255,255,255,0.6); padding: 12px 16px; border-radius: 8px;
  min-height: 40px;
}
.talk-scene-panel { display: none; }
.talk-scene-panel.active { display: block; }
.talk-bestfor { margin-top: 8px; font-size: 12px; color: #92400e; background: rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 6px; display: inline-block; }
.talk-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.talk-table th { background: var(--bg); font-weight: 600; color: var(--text-secondary); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
.talk-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.talk-table tr:last-child td { border-bottom: none; }
.talk-table tr:hover td { background: var(--accent-light); }
.talk-objection-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; transition: all 0.2s; }
.talk-objection-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(79,70,229,0.08); }
.talk-obj-customer { font-size: 13px; font-weight: 600; color: #dc2626; margin-bottom: 6px; }
.talk-obj-customer::before { content: "😤 客户说："; font-weight: 700; }
.talk-obj-reply { font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 6px; }
.talk-obj-reply::before { content: "💬 你可以回："; font-weight: 700; color: var(--accent); }
.talk-obj-source { font-size: 11px; color: var(--text-light); }
.talk-obj-source::before { content: "📎 依据："; }
.talk-radar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.talk-radar-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; transition: all 0.2s; }
.talk-radar-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.talk-radar-indicator { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.talk-radar-value { font-size: 20px; font-weight: 700; color: var(--text); }
.talk-radar-direction { font-size: 11px; margin-left: 4px; }
.talk-radar-direction.up { color: #dc2626; }
.talk-radar-direction.down { color: #059669; }
.talk-radar-direction.flat { color: #f59e0b; }
.talk-radar-note { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.talk-radar-source { font-size: 10px; color: var(--text-light); margin-top: 4px; }
.talk-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.talk-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.35; }
.talk-empty-text { font-size: 15px; }
@media (max-width: 640px) {
  .talk-radar-grid { grid-template-columns: repeat(2, 1fr); }
  .talk-headline-card { padding: 14px 16px; }
  .talk-table { font-size: 12px; }
  .talk-table th,
  .talk-table td { padding: 8px 10px; }
}
/* ── Daily Report (深度日报) ── */
.dr-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.dr-date-display { font-size: 18px; font-weight: 700; min-width: 150px; text-align: center; }
.dr-article {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px 36px;
  line-height: 1.8;
  color: var(--text);
  font-size: 15px;
}
.dr-article h1.dr-h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.dr-article .dr-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
.dr-article hr.dr-hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.dr-article h2.dr-h2 { font-size: 20px; font-weight: 700; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent-light); }
.dr-article h3.dr-h3 { font-size: 17px; font-weight: 700; margin: 20px 0 8px; color: var(--accent); }
.dr-article p.dr-p { margin-bottom: 14px; text-align: justify; }
.dr-article strong { color: var(--text); }
.dr-article blockquote.dr-blockquote {
  margin: 16px 0;
  padding: 14px 20px;
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-style: italic;
  color: var(--text-secondary);
}
.dr-article blockquote.dr-blockquote p { margin-bottom: 0; }
.dr-article ul.dr-ul { margin: 12px 0; padding-left: 24px; }
.dr-article ul.dr-ul li { margin-bottom: 6px; list-style: disc; }
.dr-article ol.dr-ol { margin: 12px 0; padding-left: 24px; }
.dr-article ol.dr-ol li { margin-bottom: 6px; list-style: decimal; }
.dr-article .dr-framebox {
  background: #f0fdf4;
  border: 1px solid #86efac;
  border-radius: 10px;
  padding: 16px 20px;
  margin: 16px 0;
}
.dr-article .dr-framebox-title { font-size: 14px; font-weight: 700; color: #166534; margin-bottom: 8px; }
.dr-article .dr-table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 10px; border: 1px solid var(--border); }
.dr-article table.dr-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.dr-article table.dr-table th { background: var(--bg); font-weight: 600; color: var(--text-secondary); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
.dr-article table.dr-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.dr-article table.dr-table tr:last-child td { border-bottom: none; }
.dr-article .dr-footnote { font-size: 12px; color: var(--text-light); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
@media (max-width: 640px) {
  .dr-article { padding: 20px 18px; font-size: 14px; }
  .dr-article h1.dr-h1 { font-size: 22px; }
  .dr-article h2.dr-h2 { font-size: 18px; }
}
/* ── Sales Mode (销售心法) ── */
.sales-section { margin-bottom: 28px; }
.sales-section-header { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--accent-light); }
.sales-insight-card {
  background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
  border: 1px solid #93c5fd;
  border-radius: 14px; padding: 20px 24px; margin-bottom: 16px;
}

  "2026-07-27": `<h1 class="dr-h1">🐝 蜜蜂情报站 · 每日深度</h1>

<p class="dr-p"><strong>第二条：1688宣布20%采购已由AI Agent发起。</strong>不是实验，是每天在跑的真实交易。平台还联合蚂蚁推出了UTP协议——给AI之间的交易建高速公路。</p>

<p class="dr-p">试运营期间，旗舰店访客超过3000万人次，科克兰坚果多次售罄。</p>
<h3 class="dr-h3">拆因果链：Costco为什么要打破自己的规则？</h3>
<p class="dr-p">Costco是全球零售的"规则制定者"之一。它的会员费收入占利润的大部分，会员制是它的护城河。</p>
<p class="dr-p">但它为什么主动打破这个规则？</p>
<p class="dr-p"><strong>第一步</strong>：中国市场线上渗透率已达40.4%→消费者习惯了线上购物→只用7家线下门店覆盖中国市场远远不够</p>
<p class="dr-p"><strong>第二步</strong>：自建电商成本高、周期长→必须找有全国仓配能力的大平台合作→京东7亿活跃用户+当日达物流是最优解</p>
<p class="dr-p"><strong>第三步</strong>：非会员可买但价格高20%→本质上你多付的20%就是你的"临时入场费"→如果买了3次觉得值，线下办会员就成了自然选择</p>
<p class="dr-p"><strong>第四步</strong>：线上是Costco会员的"漏斗入口"，不是会员的"替代方案"→Costco不是放弃了会员制，是给会员制加了一个线上引流的漏斗</p>
<p class="dr-p"><strong>这条因果链你学会了，就能跟任何一个实体商家解释为什么"线上不是替代线下，是引流到线下"。</strong></p>
<h3 class="dr-h3">白鸦的思维框架：为什么没有"纯线上"或"纯线下"了</h3>
<p class="dr-p">白鸦反复强调的一个判断：</p>
<blockquote class="dr-blockquote"><p>"未来的零售没有线上和线下之分——只有'有数字化能力的零售'和'没有数字化能力的零售'。"</p></blockquote>
<p class="dr-p">他的推导很简单：</p>
<p class="dr-p"><strong>① 消费者不会在线上和线下之间做选择</strong><br>他只会选择"当下最方便的方式"。想买一包坚果→京东下单最快→不关心是Costco还是山姆→只要送到家就行。</p>
<p class="dr-p"><strong>② 线上的价值不只是"卖货"，是"建立连接"</strong><br>Costco跟京东合作，不是为了多卖几包坚果——是为了让3000万个试运营访客知道"Costco是什么、为什么值得买"。这些人在京东上体验过之后，可能会去线下办卡、可能会在线上持续回购。</p>
<p class="dr-p"><strong>③ 有数字化能力的零售，可以做到"人在哪，我就在哪"</strong><br>Costco在没有数字化合作之前，只能覆盖门店周边10公里的消费者。跟京东合作之后，覆盖了全国。这不是多了一个渠道，是多了一个"存在"的方式。</p>
<h3 class="dr-h3">所以呢？——你打电话怎么说</h3>
<p class="dr-p">下次你跟实体零售客户聊天，可以这么开：</p>
<blockquote class="dr-blockquote"><p>"王总，你知道Costco最近干了什么吗？它开店七年一直坚持必须会员才能买——结果上个月入驻京东，破天荒允许非会员下单了。不是它不想坚持，是消费者的行为变了。你的客户也一样——他不在线上找到你，就在线下去别人家。你得两头上，而且两头得通。"</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">第二章：AI正在重建B2B交易的底层"高速公路"</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">今天这一章可能看起来跟你做销售没有直接关系——但看完之后你会发现，它是你这周会议中的王牌谈资。</p>
<p class="dr-p">两个数字：<strong>20%和3亿。</strong></p>
<p class="dr-p"><strong>20%：</strong>1688平台上已有20%的采购需求由AI Agent发起。不是实验，是每天真实跑着的交易。1688还预测——两年后这个数字会到80%。</p>
<p class="dr-p"><strong>3亿：</strong>蚂蚁集团的AI支付体系已经处理了3亿笔智能体发起的支付。适配95%的通用智能体框架。</p>
<p class="dr-p">为了支撑这个趋势，1688联合中国电子技术标准化研究院和蚂蚁集团，于7月底推出<strong>UTP通用交易协议</strong>。把一笔B2B交易拆成6个标准化模块——寻源、询盘、订购、支付、履约、争议解决。目的只有一个：让不同平台的AI智能体之间能互相听懂、顺利交易。这就像当年互联网的TCP/IP协议——给A2A（智能体对智能体）时代建了条高速公路。</p>
<h3 class="dr-h3">拆因果链：AI采购对商家意味着什么</h3>
<p class="dr-p"><strong>第一步</strong>：AI能够自主完成采购决策（选品、比价、下单、支付）→ 企业的采购流程从"人找货"变成"AI找货"</p>
<p class="dr-p"><strong>第二步</strong>：AI找货的逻辑跟人不一样——AI不看广告、不关乎关系、不取决于销售的话术——它看的是<strong>数据</strong>：产品评分、履约时效、退货率、价格竞争力</p>
<p class="dr-p"><strong>第三步</strong>：以前B2B销售靠的是"关系+话术"，以后B2B销售靠的是"产品数据+服务体系" → AI决策者不会被"请吃饭"影响</p>
<p class="dr-p"><strong>第四步</strong>：UTP协议让AI可以跨平台交易 → 你能想象的极限不再是"把货铺到1688"，而是"你的货品数据能不能被AI找到并选中"</p>
<p class="dr-p"><strong>这条因果链在你跟做B2B批发生意的客户聊的时候，杀伤力极高——他十有八九没想过这件事。</strong></p>
<h3 class="dr-h3">白鸦的思维框架：AI时代，什么护城河还在</h3>
<p class="dr-p">白鸦对AI的判断已经讲过很多次，但今天这个新闻增加了一个新的维度——AI采购。</p>
<p class="dr-p"><strong>他的框架只有两个问题：</strong></p>
<p class="dr-p"><strong>① 你的生意是"卖标准品"还是"卖解决方案"？</strong><br>标准品（比如一包纸巾、一个螺丝钉）→ AI能自动比价和采购→价格战的终局<br>解决方案（比如帮商家提升复购率的系统）→ AI无法替代信任判断→需要人</p>
<p class="dr-p"><strong>② 你的客户是"人"还是"AI"？</strong><br>如果你的客户是AI（比如1688上的采购Agent）→ 你服务的对象变了→你的产品描述、数据完备度、履约能力才是你的"销售"<br>如果你的客户是人（比如你的有赞客户）→ 你卖的是理解和信任→AI替代不了</p>
<p class="dr-p"><strong>这个框架不只是看B2B——你可以用它来判断任何一个客户在AI时代的"被替代风险"。</strong></p>
<h3 class="dr-h3">所以呢？——跟B2B客户聊的正确姿势</h3>
<blockquote class="dr-blockquote"><p>"陈总，你知不知道1688现在已经有20%的采购是AI直接下单了？两年后会到80%。这意味着什么？意味着你的客户——那些工厂主、批发商——他们很快不用人来选货了，AI帮他们选了。你的产品数据如果不标准化、不结构化、不入住这些平台，AI根本找不到你。你今天还在靠销售去敲门，明天AI已经把生意谈完了。"</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">第三章：便利店的"来客数断崖"——实体下沉市场的最真实信号</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">中国连锁经营协会发布了上半年的便利店简报。数据很诚实：</p>
<div class="dr-table-wrap">
<table class="dr-table">
<thead><tr><th>指标</th><th>数据</th><th>对比</th></tr></thead>
<tbody>
<tr><td>净增门店</td><td>1391家</td><td>2024年全年9570家，2025上半年4093家——断崖式下降</td></tr>
<tr><td>来客数下降企业占比</td><td>71.7%</td><td>五个关键指标中最差的一项</td></tr>
<tr><td>销售额下降企业占比</td><td>50%</td><td>一半企业在掉量</td></tr>
<tr><td>净利润下降企业占比</td><td>60%</td><td>利润比销售更难</td></tr>
<tr><td>双增长企业占比</td><td>18.3%</td><td>逆势者——湖南新佳宜、广东天福为代表</td></tr>
</tbody>
</table>
</div>
<p class="dr-p">为什么？三个字：<strong>被分流了</strong>。</p>
<p class="dr-p">即时零售（美团闪购等）增速超25%，折扣零售（好特卖等）门店数年增长超30%，零食量贩店遍地开花。你楼下的便利店不只是跟隔壁便利店竞争——它还跟美团30分钟送到的超市、跟同一条街的折扣店竞争。</p>
<h3 class="dr-h3">拆因果链：便利店的困境是实体零售的缩影</h3>
<p class="dr-p"><strong>第一步</strong>：消费者习惯变了（想买什么→美团30分钟送到）→ 便利店"楼下就有"的优势被稀释</p>
<p class="dr-p"><strong>第二步</strong>：线上渠道越来越多（即时零售+直播+社区团购+折扣店）→ 消费者的时间被切割到各个渠道→ 便利店来客数下滑</p>
<p class="dr-p"><strong>第三步</strong>：来客数下滑 → 靠位置自然流量的模式失效 → 便利店不得不从"等人来"变成"拉人来"</p>
<p class="dr-p"><strong>第四步</strong>：逆势增长的企业找到了新方法——<strong>私域+会员+鲜食差异化</strong>。湖南新佳宜靠鲜食创新把单客价值做上去；广东天福靠会员运营把复购率稳住</p>
<p class="dr-p"><strong>第五步</strong>：结论——便利店的增长方式从"多开门店"正式切换为"深耕单客"</p>
<p class="dr-p"><strong>这条因果链你讲给任何一个做线下生意的客户听，他都能找到自己的影子——因为他面对的是同一个问题。</strong></p>
<h3 class="dr-h3">白鸦的思维框架：单客经济的底层逻辑</h3>
<p class="dr-p">白鸦在讲有赞价值的时候，反复强调一个概念：</p>
<blockquote class="dr-blockquote"><p>"你赚的钱不是一个客户消费一次的钱——是一个客户一辈子在你这里消费的总和。"</p></blockquote>
<p class="dr-p">这就是CLV（客户终身价值）。</p>
<p class="dr-p">便利店今天面对的问题——来客数下降——本质上就是"自然流量枯竭"。在流量枯竭的时代，你的核心能力不再是"怎么让更多人进来"，而是"怎么让进来的人花更多、回来更多次"。</p>
<p class="dr-p">这是一个思维的转变：</p>
<p class="dr-p"><strong>① 以前：</strong>"我每天有1000个人进店——10%转化=100单X100元=10000元"</p>
<p class="dr-p"><strong>② 现在：</strong>"我每天只有500个人进店——我需要25%转化X120元X1.3次回购才能赚更多"</p>
<p class="dr-p"><strong>③ 关键：</strong>从"流量×转化率×客单价"到"流量×转化率×客单价×复购率"——复购率成了新的变量</p>
<p class="dr-p"><strong>这个框架你用一句话就能讲清楚："拉新是成本，复购是利润。"</strong></p>
<h3 class="dr-h3">所以呢？——跟便利店/实体店客户聊什么</h3>
<p class="dr-blockquote">你跟做实体店客户聊天，千万不要一上来就推私域系统。</p>
<blockquote class="dr-blockquote"><p>"李总，我看了一个行业数据——今年上半年便利店行业71.7%的店来客数在降。你知道那些还有增长的店是怎么做的吗？他们不是多开了店，是把每个老客户一年买3次变成了买6次。你店里每天有500个人进来，你认识几个？留了几个联系方式？下次他们什么时候来你知道吗？"</p></blockquote>
<p class="dr-p"><strong>注意：你没有在推销系统，你在帮他发现他手里有个金矿但没在挖。</strong></p>
<hr class="dr-hr">
<h2 class="dr-h2">第四章：新鲜零食×太二×东方甄选——三大消费侧面的"反内卷"样本</h2>
<h3 class="dr-h3">新鲜零食：降价不是唯一的出路</h3>
<p class="dr-p">量贩零食打了两年价格战，现在开始退潮了。取而代之的是一个叫"新鲜零食"的新赛道——来伊份、茶颜悦色、绝味食品集体入局。</p>
<p class="dr-p">新鲜零食的逻辑是什么？是<strong>从"低价吸引"转向"品质信任"</strong>。它不跟量贩零食比价格——它比的是"看得见的现制、短保期的安心、透明化的生产"。消费者愿意为"安全"多付钱。</p>
<h3 class="dr-h3">太二酸菜鱼：餐饮存量时代的"鲜活化"</h3>
<p class="dr-p">太二酸菜鱼6月同店日均销售增长12%，340家门店已经完成"鲜活模式"改造。从预制菜回归活鱼现做、从标准化回归锅气——这是餐饮存量竞争中的"价值回归"。</p>
<h3 class="dr-h3">东方甄选：去主播化后的利润暴增</h3>
<p class="dr-p">东方甄选2026财年净利增长8566%，从600万干到5.2-5.5亿。核心原因不是什么花哨的玩法——是自有品牌占比做到了52.8%。自己研发、自己生产、自己卖——利润全在自己手上。</p>
<p class="dr-p"><strong>这三个案例讲的是同一个道理：在存量竞争的年代，"做和别人一样的东西然后卖更便宜"是死路，唯一的活路是"做和别人不一样的东西，让消费者觉得值"。</strong></p>
<h3 class="dr-h3">所以呢？（给你用的）</h3>
<blockquote class="dr-blockquote"><p>"张总，我最近在看几个很有意思的案例——东方甄选利润涨了85倍不是因为降价，是因为自有品牌做到了一半以上。太二酸菜鱼生意好了不是因为降价，是回归活鱼现做。你的同行都在卷价格，你有没有想过——能不能做点只有你能做的事，让客户觉得'非你不可'？"</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">终章：三件事教你一个判断标准</h2>
<p class="dr-p">今天的三条主线——Costco线上化、AI重构B2B交易、便利店从流量到单客——指向同一个问题：</p>
<p class="dr-p"><strong>在所有人都能做的事情上，你凭什么赢？</strong></p>
<p class="dr-p">Costco的答案是：让消费者更方便地接触到我，哪怕打破自己的规则。<br>1688的答案是：让AI帮人做采购决策，用标准化协议消灭壁垒。<br>便利店的答案是：我没办法让更多人进来，所以我要让进来的人花更多。</p>
<p class="dr-p">你作为销售，每天面对的客户也在面对同样的问题：<strong>在所有人都能做的事上，他凭什么赢？</strong></p>
<p class="dr-p">你如果能帮他回答这个问题——你就不只是在卖系统，你是在帮他找到生意方向。</p>
<hr class="dr-hr">

<h2 class="dr-h2">开篇：三件事发生在同一天，不是巧合</h2>
<p class="dr-p">今天有三条消息，单独看都是行业新闻，放在一起看是一场系统性变革的共振。</p>
<p class="dr-p"><strong>第一条：AI购物元年正式开启。</strong>阿里千问×淘宝打通、京东Agent接入腾讯元宝、字节豆包嵌入抖音。三大互联网巨头在同一个月完成了AI购物基础设施的全量搭建。</p>
<p class="dr-p"><strong>第二条：SaaS商业模式正在被AI解构。</strong>Gartner说2030年有2340亿美元企业软件支出要受冲击。美国小企业开始退订Salesforce，用AI自建。SaaS从"按人头收费"走向"按结果收费"。</p>
<p class="dr-p"><strong>第三条：实体零售迎来政策大礼包，同时行业剧烈分化。</strong>九部门联合发布零售业创新发展20条。永辉扭亏了，中百还在失血。胖东来上半年干了145亿。</p>
<p class="dr-p">这三件事的底层逻辑是同一个：<strong>AI正在重新定义"什么是产品""什么是服务""什么是价值"。</strong></p>
<p class="dr-p">但大多数人只看到碎片，没看到拼图。今天这篇日报，就是帮你拼出这张图——然后告诉你，这三件事跟你明天早上打的那通电话有什么关系。</p>
<hr class="dr-hr">
<h2 class="dr-h2">第一章：AI购物——不是升级，是替换</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">7月15号到25号这十天，中国互联网发生了三件事——它们的时间线几乎重叠，不是巧合，是蓄谋已久：</p>
<ul class="dr-ul">
<li><strong>阿里</strong>：千问与淘宝全面打通，上线"AI帮我挑"。你在千问App里说"帮我找一款3000元以内、拍照好的手机"，千问直接进淘宝商品库检索、对比、排序，然后引导你下单支付。全程不用打开淘宝。</li>
<li><strong>京东×腾讯</strong>：京东AI Agent接入腾讯元宝。你在元宝对话框说同样的话，AI从京东库里挑出最合适的，以卡片形式展示，点击跳转京东小程序完成交易。"边聊边买"。</li>
<li><strong>字节</strong>：豆包嵌入抖音，上线"买前问豆包"。</li>
</ul>
<p class="dr-p">三家的共同判断：<strong>购物入口正在从"搜索框"变成"对话窗"。</strong></p>
<h3 class="dr-h3">拆因果链：入口变了，谁的生意受影响？</h3>
<p class="dr-p">先看消费者行为的变化路径：</p>
<p class="dr-p"><strong>第一步</strong>：AI对话入口出现（千问/元宝/豆包）→ 消费者发现"说句话就能买东西"比搜关键词方便</p>
<p class="dr-p"><strong>第二步</strong>：消费者从"打开App→搜→翻→比→下单"转向"打开对话框→说需求→AI推荐→直接买"</p>
<p class="dr-p"><strong>第三步</strong>：流量分配逻辑改变——以前你花钱做SEO/SEM，让消费者搜到你；现在消费者不搜了，他跟AI说话——<strong>AI推荐综合分最高的人，不是出价最高的人</strong></p>
<p class="dr-p"><strong>第四步</strong>：淘宝ShopX大模型发布→AI直接进商品空间自主规划、检索、排序、组合→进一步压缩商家"靠技巧获取流量"的空间</p>
<p class="dr-p"><strong>这条因果链你讲给任何一个电商客户听，他的第一反应会是："那我怎么办？"——而这个"怎么办"正是你的机会。</strong></p>
<h3 class="dr-h3">白鸦的思维框架：AI购物对商家意味着什么？</h3>
<p class="dr-p">白鸦在多个场合说过一个判断，看起来简单但细想很深：</p>
<blockquote class="dr-blockquote"><p>"电商的下半场，从'运营流量'变成'运营产品力'。"</p></blockquote>
<p class="dr-p">他的推理过程是：</p>
<p class="dr-p"><strong>① 当入口从搜索变成对话，信息不对称消失了</strong><br>以前商家靠标题优化、关键词堆砌、主图差异来获客——这些是"搜索技巧"。消费者搜苹果手机，前3页的商家不一定是最好的，但一定是最会做搜索优化的。现在AI直接检索商品库，按综合效率排序——你的标题写得再好，产品评分低、退货率高、售后差，AI直接把你过滤掉。</p>
<p class="dr-p"><strong>② 流量成本的结构正在重组</strong><br>以前流量成本=广告费+运营人员工资。以后流量成本=产品力（品质+服务+口碑）。钱从"买流量"变成了"做产品"。短期看投入更大了，但长期看这是正向循环——产品越好→评分越高→AI越推荐→流量越多→利润越高→产品可以更好。</p>
<p class="dr-p"><strong>③ 哪些商家最危险？</strong><br>靠信息差卖货的、靠低价引流的、靠刷单维持评分的——这些在AI购物时代会加速淘汰。</p>
<p class="dr-p"><strong>这个框架你学会了，不只是用来回答客户"AI购物怎么办"——它本质上是一个判断"什么生意能活下来"的标准。</strong></p>
<h3 class="dr-h3">所以呢？——你今天打电话怎么用</h3>
<p class="dr-p">下次你跟电商客户聊，不要说"AI购物是个趋势"这种废话。</p>
<p class="dr-p">换个说法：</p>
<blockquote class="dr-blockquote"><p>刘总，你有没有注意到，现在淘宝已经开始让千问AI帮你挑东西了？消费者不搜了，他直接跟AI说需求。你猜AI推荐谁？不是出价最高的人——是综合评分最高的人。你的店如果在AI系统里评分不够好，连被推荐的机会都没有。我今天就是想跟你聊聊，怎么让你的店在任何渠道都"值得被推荐"。</p></blockquote>
<p class="dr-p">你看，这句话里你讲的是趋势，但他听到的是"跟我的生意直接相关"。</p>
<hr class="dr-hr">
<h2 class="dr-h2">第二章：SaaS被AI解构——但跟你看到的"SaaS已死"不一样</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">今天的第二条主线，对做SaaS销售的你来说更直接。几件事同时发生：</p>
<ul class="dr-ul">
<li><strong>Gartner报告</strong>：到2030年，2340亿美元企业应用软件支出中将有约20%受"智能体套利"冲击。AI智能体可以跨多个系统完成工作，降低用户对传统软件界面的需求。</li>
<li><strong>美国小企业退订潮</strong>：多家20-70人公司用Anthropic+Replit自建CRM/ERP替代Salesforce，年省数万到数十万美元，维护成本仅几百美元。Salesforce 2026年股价跌约30%。</li>
<li><strong>SaaS定价模式剧变</strong>：Salesforce推pay-per-resolution（每次成功解决2美元）；迈富时场景Token净利预增近500%；阿里云CTO在WAIC上明确"SaaS将迁移到智能体服务模式"。</li>
</ul>
<h3 class="dr-h3">拆因果链：SaaS到底在经历什么？</h3>
<p class="dr-p"><strong>第一步</strong>：AI能力变强，可以替代"流程执行类"软件功能（数据录入、报表生成、流程审批）→ 传统软件的用户价值降低</p>
<p class="dr-p"><strong>第二步</strong>：企业发现"与其给每个人买软件座位，不如让AI替这些人干活" → 智能体套利产生 → 退订传统SaaS</p>
<p class="dr-p"><strong>第三步</strong>：资本市场看到风险 → 抛售SaaS股票 → Salesforce/IBM/Adobe股价暴跌</p>
<p class="dr-p"><strong>第四步</strong>：但仔细看——被冲击的都是"工具型SaaS"。"经营型SaaS"不仅没受影响，反而在增长</p>
<p class="dr-p"><strong>第五步</strong>：中国SaaS市场2026年预计达1167亿，还在增长。迈富时净利预增近500%。为什么？因为中国SaaS跟美国SaaS走得不是一条路——中国SaaS离交易更近，离业务更深</p>
<h3 class="dr-h3">白鸦的思维框架：有赞为什么跟Salesforce不一样？</h3>
<p class="dr-p">今天这组新闻对做有赞销售的你来说，是天然的话术弹药。因为客户一定会问："SaaS不是被AI冲击了吗？你们有赞怎么办？"</p>
<p class="dr-p">白鸦其实早就给出了答案，他的判断框架是：</p>
<p class="dr-p"><strong>"前端软件有护城河，后端软件会被打碎。"</strong></p>
<p class="dr-p">为什么？</p>
<p class="dr-p"><strong>① 离交易近的软件，数据是活的</strong><br>有赞管的是商品上架、订单处理、客户触达、资金流转——这些是商家每天都在运行的业务数据。数据是活的，是正在发生的交易。AI无法凭空生成这些数据，它只能分析这些数据。</p>
<p class="dr-p"><strong>② 离业务远的软件，数据是死的</strong><br>传统ERP管的是库存记录、流程审批——这些数据是"做完了录入系统"的。AI能看懂、能分析、能替代录入这件事。</p>
<p class="dr-p"><strong>③ 单纯的软件容易被替代，深度的服务不会</strong><br>这也是为什么迈富时提出的"场景Token"模式——不是卖软件，是卖业务结果。你帮客户做了多少营销、产生了多少销售，就收多少钱。AI不是来替代你的，AI是帮你以更低成本交付结果的工具。</p>
<p class="dr-p"><strong>这个框架你学会了，下次遇到客户质疑SaaS价值的时候，你就有了一套清晰的判断标准。</strong></p>
<h3 class="dr-h3">所以呢？——客户说"SaaS被AI替代了"</h3>
<p class="dr-p">你正确的回应方式：</p>
<blockquote class="dr-blockquote"><p>你说得对，确实有一部分SaaS会被替代。但你看被替代的是哪种——记库存的、管流程的、跑审批的，这些是"装了就不用管"的工具。但你看你的生意——你每天要上什么品、定什么价、推什么活动、维护哪些客户——这些事AI不知道，但有赞知道。有赞不是记录你的工作，是参与你的工作。你的业务跑在有赞上，AI来了帮你更高效地做这些事，而不是替代你。</p></blockquote>
<p class="dr-p">你顺着客户说了一句"对，确实会替代一些"——他不跟你顶了。然后你给出了精确的区分，他就接受了你的框架。</p>
<hr class="dr-hr">
<h2 class="dr-h2">第三章：实体零售的政策大礼包——谁的春天谁的冬天</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">九部门联合发布《关于加快零售业创新发展的意见》20条——近年来力度最大的零售业系统性政策。几个关键点：</p>
<ul class="dr-ul">
<li><strong>首次明确线上线下零售一视同仁</strong>：反垄断、反不正当竞争、同品同质同标</li>
<li><strong>资源向实体倾斜</strong>：用地保障、融资支持、REITs、减税降负</li>
<li><strong>明确新业态方向</strong>：即时零售、自有品牌、零售跨界融合</li>
</ul>
<p class="dr-p">同时，A股零售中报出炉——分化剧烈：</p>
<div class="dr-table-wrap">
<table class="dr-table">
<thead><tr><th>企业</th><th>上半年成绩</th><th>核心动作</th><th>关键指标</th></tr></thead>
<tbody>
<tr><td><strong>永辉</strong></td><td>扭亏，净利2.5亿</td><td>关400家低效店+331家胖东来式调改</td><td>毛利率提升1.6%→21.4%</td></tr>
<tr><td><strong>红旗连锁</strong></td><td>扣非+8%至2.75亿</td><td>极致本地化供应链</td><td>毛利率稳定30%+</td></tr>
<tr><td><strong>中百集团</strong></td><td>续亏2.5-3.3亿</td><td>关了414家，模式没改</td><td>"装修式自救"</td></tr>
<tr><td><strong>胖东来</strong></td><td>145亿+24%</td><td>自建供应链+极致服务</td><td>许昌社零全省第一</td></tr>
</tbody>
</table>
</div>
<h3 class="dr-h3">拆因果链：同样面对政策机会，为什么差距这么大？</h3>
<p class="dr-p"><strong>第一步</strong>：消费增长放缓（社零+1.3%）→ 实体零售普遍承压</p>
<p class="dr-p"><strong>第二步</strong>：政策出手——9部门20条给予资源倾斜 → 但不是所有实体零售都能接住</p>
<p class="dr-p"><strong>第三步</strong>：有准备的零售企业（永辉/胖东来/红旗）早就在做内部升级——门店调改、供应链优化、数字化 → 政策是放大器，让好的更好</p>
<p class="dr-p"><strong>第四步</strong>：没准备的零售企业（中百等）以为"关了亏损店就是改革"→ 关了店但没改模式 → 政策来了也没用</p>
<p class="dr-p"><strong>第五步</strong>：分化加速——2026下半年会出现更清晰的"好零售越来越好、差零售加速出清"</p>
<p class="dr-p"><strong>这条因果链你讲给实体零售客户听，他会觉得你很懂他的行业。</strong></p>
<h3 class="dr-h3">白鸦的思维框架：实体零售的终局是什么？</h3>
<p class="dr-p">白鸦在评论零售趋势时说过一句话：</p>
<blockquote class="dr-blockquote"><p>"线下零售不是被替代，是被重新定义——从'交易场'变成'关系场'。"</p></blockquote>
<p class="dr-p">他的推理：</p>
<p class="dr-p"><strong>① 线上效率再高，也解决不了"信任"和"体验"</strong><br>你去胖东来买东西，不是因为线上买不到——是因为你相信胖东来的选品、你看得到摸得着、你享受那种被服务的感觉。线上能给你效率，但不能给你信任。</p>
<p class="dr-p"><strong>② 实体零售的价值，不在"卖货"本身</strong><br>"卖货"这件事线上效率已经拉满了。线下零售的价值在于"场景+体验+关系"——这也是为什么政策提出"零售从卖货场向第三空间升级"。</p>
<p class="dr-p"><strong>③ 但商家的"关系经营"需要数字化工具</strong><br>线下店的客户离店就失联了——你不知道谁来过了、买了什么、下次什么时候来。有赞能帮商家把"线下关系"变成"线上资产"。</p>
<p class="dr-p"><strong>这个框架你学会了，不只是用来看实体零售——它回答的是一个更根本的问题：在线上效率如此之高的今天，线下生意为什么还能活？</strong></p>
<h3 class="dr-h3">所以呢？——跟实体零售客户聊什么</h3>
<p class="dr-p">下次你跟实体零售客户聊，不要说"有赞能帮你做线上商城"。太low了。</p>
<p class="dr-p">换个说法：</p>
<blockquote class="dr-blockquote"><p>王总，你看你同行——胖东来半年做了145亿，商务部都在点赞。但你知道胖东来最厉害的是什么吗？不是他的商品多好——是他的客户愿意为他排队。他把客户关系做成了护城河。你在线下经营了这么多年，你的客户离店之后你还联系得上吗？你知道哪些客户常来、哪些客户好久没来了吗？</p></blockquote>
<p class="dr-p">你帮他看到的是"自己手里有资源但没用起来"——这个痛点比任何一个功能卖点都痛。</p>
<hr class="dr-hr">
<h2 class="dr-h2">终章：三个信号指向同一个答案</h2>
<p class="dr-p">今天的三条线——AI购物元年、SaaS商业模式重构、实体零售政策分化——讲的其实是同一个故事。</p>
<p class="dr-p">这个故事的主线是：<strong>技术正在重构"交易的方式"。</strong></p>
<p class="dr-p">以前交易靠搜索（人找货），以后交易靠对话（AI帮你匹配）。<br>以前软件靠卖座（按人头收租），以后软件靠卖结果（按效果收费）。<br>以前零售靠位置（地段好就赚钱），以后零售靠经营（系统好才赚钱）。</p>
<p class="dr-p">这三条线都指向同一个结论：<strong>做生意的方式变了，而且变得很快。</strong></p>
<p class="dr-p">你作为销售，不是去跟客户科普趋势的——你是帮客户在趋势里找到自己的位置的。</p>

  "2026-07-24": `<h1 class="dr-h1">🐝 蜜蜂情报站 · 每日深度</h1>

<p class="dr-p"><strong>③ 判断新方向</strong><br>效率：同样的投入能不能产出更多？——AI客服、AI投放、AI直播都是这个逻辑。<br>关系：客户买完能不能再买？——私域、会员、复购，都是这个逻辑。</p>

<p class="dr-p">看起来矛盾的：</p>

<p class="dr-p"><strong>这两个框架你学会了，下次看到任何一个"AI能不能干这个"的问题，自己就能判断。</strong></p>

<p class="dr-p"><strong>第三步</strong>：但商家对"能帮自己赚钱的工具"需求反而更强了 → 靠近交易、靠近业务的SaaS继续增长</p>
<p class="dr-p"><strong>第四步</strong>：行业大分化——"纯管理型SaaS"（传统ERP、基础CRM）被冲击，"参与经营型SaaS"（有赞、Shopify）反而更受重视</p>
<p class="dr-p"><strong>第五步</strong>：分化的结果——以前的SaaS是大一统市场，现在的SaaS是"能帮客户赚钱的活，不能的"。</p>

<blockquote class="dr-blockquote"><p><strong>"前端软件有护城河，后端会被打碎。"</strong></p></blockquote>
<p class="dr-p">他不是随便说的。他的推导过程是：</p>

<p class="dr-p"><strong>② 离业务越远的软件越危险</strong><br>传统ERP管的是库存记录、流程审批——这些事AI能看懂、能执行、能替代。</p>
<p class="dr-p"><strong>③ "单纯卖算力最终会陷入价格战"</strong><br>白鸦的逻辑：如果你提供的东西只有"算力"（记录、计算、存储），那AI能用更低成本提供同样的东西。但如果你提供的是"判断力"（帮客户做决策、做策略），AI替代不了。</p>

<p class="dr-p">注意这里面你顺着客户说了一句"你说得对"——他就不跟你顶了，然后你给出了一个更精细的判断："是的，但跟你没关系"。</p>

<p class="dr-p">如果你今天只带走三样东西，我建议你带走这三个思维框架。它们不是知识，是你以后自己判断问题的工具。</p>
<h3 class="dr-h3">框架一：效率 vs 关系</h3>
<p class="dr-p">看到一个行业变化/新工具，问自己：这个是在提高效率，还是在加深关系？</p>
<ul class="dr-ul">
<li>价格战 → 效率（但损人不利己）</li>
<li>私域 → 关系（长期积累）</li>
<li>AI客服 → 效率（可以马上用）</li>
<li>有赞CRM → 关系（值得认真推）</li>

<p class="dr-p">看到一个岗位/工具被AI替代的新闻，问自己：它的核心是流程执行，还是判断决策？</p>
<ul class="dr-ul">
<li>流程执行 → 必然被替代（不用挣扎）</li>
<li>判断决策 → AI辅助，不会替代（值得投入）</li>

<h3 class="dr-h3">框架三：前线 vs 后台</h3>
<p class="dr-p">判断一个软件/服务的护城河：离交易近还是离交易远？</p>
<ul class="dr-ul">

<p class="dr-p">但大多数人只看到"AI很火"，没看到"AI正在重新划地盘"。今天这篇，帮你把五件事串成一根因果链——然后告诉你，这根链的每一环都跟你明天早上打的电话有关。</p>

<h2 class="dr-h2">第一章：AI电商的商业闭环——终于跑通了</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">如果你只记住一个判断，记住这个：<strong>AI购物已经不是"试验品"，正在变成"水电煤"。</strong></p>
<p class="dr-p">7月20到25号这几天，三件事同时发生：</p>

<h3 class="dr-h3">拆因果链：为什么这次不一样</h3>
<p class="dr-p">你可能会想——"AI购物"去年不也在喊吗？有什么区别？</p>

<p class="dr-p"><strong>第三环：SaaS端闭环。</strong>微盟星元、有赞六大数字员工——软件公司自己开始用AI重写自己的产品。这不是"加个AI功能"，是"整个产品换了一个架构"。</p>
<p class="dr-p"><strong>三环同时打通，AI电商的飞轮才刚刚开始转。</strong></p>

<p class="dr-p">白鸦这两天被问最多的问题就是："AI不是可以自己写软件吗？SaaS是不是要死了？"</p>

<blockquote class="dr-blockquote"><p>"SaaS前端（营销/销售/运营）的壁垒不是代码，是数万商家实时迭代的运营经验。你今天想做一个营销活动，自己团队最多想3个方案。有赞系统上5万商家每个月跑出200多个新玩法——哪个卖得好、哪个转化率高、哪个文案效果好。这些数据通用大模型没有，因为营销玩法的有效期只有三个月，等大模型爬完数据已经过期了。"</p></blockquote>
<p class="dr-p">他的意思翻译成白话：<strong>SaaS真正值钱的不是那个软件界面，是界面上跑的人和数据。</strong></p>
<p class="dr-p">你在跟客户聊有赞的时候，不用去比功能多少——<strong>你要比的是"你的同行在上面跑了多少案例"。</strong>5万个商家在每个品类跑出的最佳实践，这是有赞的核心壁垒，AI时代反而更强了。</p>

<blockquote class="dr-blockquote"><p>"王总，现在AI购物已经不是概念了——淘天刚刚上线了全模态AI购物，你在摄像头前说句话它就帮你买好了。这意味着什么？意味着消费者买东西的方式正在变。以前他搜关键词找到你，现在AI直接推荐最优方案。你不做私域、不做客户沉淀，等AI购物普及之后，你的老客户都变成平台的了——因为你没有自己的池子。"</p></blockquote>
<p class="dr-p"><strong>这条逻辑链：AI购物普及 → 消费者不再搜关键词 → 商家流量依赖AI推荐 → 不沉淀私域就没有自己的客户 → 有赞帮你做私域沉淀</strong></p>

<p class="dr-p">说一个很实际的事情：朴朴（那个送菜的平台）在福州开了2000平方米的火锅店，叫"念山海·朴朴的自选火锅"，一人一锅模式。同时盒马、物美、永辉、大润发集体在店里摆起了烤串摊、牛排档、现炒窗口。</p>

<p class="dr-p">这跟你做销售有什么关系？</p>
<p class="dr-p"><strong>你的客户也在想同样的事。</strong>一个服装商家、一个烘焙老板——他们也在想"能不能把老客户做成跨品类生意"。你跟他们聊的不是"买不买有赞"，是"怎么用一个系统管理多个生意"。</p>

<h3 class="dr-h3">所以呢（给你用的）</h3>
<p class="dr-p">你做实体客户的时候，这个角度很有用：</p>
<blockquote class="dr-blockquote"><p>"张姐，现在实体店不是好不好做的问题——是不转型连活下去的机会都没有。超市都在开火锅店、海底捞都在卖汉堡了。只有一个店、一套系统、一个模式的生意，风险太大。你的老客户能不能一年买你3次？你能不能给不同的人卖不同的东西？这些不需要你重新开店，需要一个系统来管。"</p></blockquote>

<p class="dr-p">在2026年做一个最反直觉的决定是什么？</p>

<blockquote class="dr-blockquote"><p>"李总，有赞创始人白鸦今年说了一句话我觉得特别有道理——AI不是杀死了SaaS，是让SaaS从卖软件变成卖结果。以前你花2万买个系统，自己运营。以后你花同样的钱，系统帮你运营。有赞把3000名销售铺到全国——不是来卖你软件的，是来帮你把系统用出效果的。"</p></blockquote>

<p class="dr-p">就在同一个月，SHEIN获得境内发行备案与港交所上市委员会批准，IPO在即。头部企业业绩亮眼：华凯易佰归母净利预增322%-390%，吉宏股份净利增66%-83%。</p>

<p class="dr-p">你如果碰跨境电商的客户，这个角度很有杀伤力：</p>

<p class="dr-p"><strong>AI不是在替代销售，AI是在重新定义"什么是值钱的销售"。</strong></p>

  "2026-07-31": `<h1 class="dr-h1">🐝 蜜蜂情报站 · 每日深度</h1>
<p class="dr-meta"><strong>2026年7月31日 | 第8期</strong></p>
<hr class="dr-hr">
<h2 class="dr-h2">开篇：AI从"功能"变成"组织"和"货架"</h2>
<p class="dr-p">今天有三条消息，单看都很炸，放在一起更值得琢磨。</p>
<p class="dr-p"><strong>第一条：字节跳动把飞书、豆包、火山引擎合成了一条线。</strong>这是2021年以来字节对ToB业务最大的一次组织调整。飞书产品团队与豆包产品团队合并，商业化团队与火山引擎整合成一个新的ToB组织。豆包企业版开始内测，大模型业务ARR冲到40亿美元——超过国内其他模型公司ARR的总和。</p>
<p class="dr-p"><strong>第二条：拼多多新设了"AI玩具"类目，全面开启招商。</strong>一个以低价著称的平台，主动为一个高溢价、强复购的新品类开绿灯。AI情感陪伴玩偶、桌面机器人、AI教育玩具、智能潮玩手办，行业同比增速有望超87%，2030年市场规模要破千亿。</p>
<p class="dr-p"><strong>第三条：ChinaJoy 2026开幕，游戏展被AI重写。</strong>宇树的格斗机器人会打拳、逐际动力的机器人会走秀、雷鸟的AI眼镜会翻译，京东展台摆满了AI手机和AI生态硬件。而就在上个月，中国机器人出口199.9亿元，同比增长39.5%，超越德国成为全球第二大机器人出口国。</p>
<p class="dr-p">这三条消息，其实是同一个变化的三个侧面：<strong>AI正在从"藏在后台的功能"，变成"顶到前台的生意"。</strong>过去我们说AI是工具、是插件、是效率提升；今天我们看到的是——AI变成了组织架构（字节的部门），变成了货架上的类目（拼多多的招商），变成了摆在展厅里的商品（ChinaJoy的机器人）。</p>
<p class="dr-p">而当全行业都在All in AI的时候，有一个人出来泼了一盆冷水——白鸦说：<strong>先保底线，再谈进化。</strong></p>
<p class="dr-p">今天这篇日报，就把"All in"和"保底线"两股力量放在一起拆给你看，然后告诉你：在AI变成组织和货架的时代，一个销售的机会到底在哪里。</p>
<hr class="dr-hr">
<h2 class="dr-h2">第一章：字节的"大一统"——AI ToB进入组织战</h2>
<h3 class="dr-h3">发生了什么</h3>
<p class="dr-p">7月30日，字节跳动宣布面向AI业务的组织调整，被业内称为"字节ToB大一统"：</p>
<ul class="dr-ul">
<li><strong>飞书产品团队 + 豆包产品团队</strong>：合并成立新的豆包产品团队，由豆包负责人赵祺负责，飞书负责人谢欣向其汇报。</li>
<li><strong>飞书GTM团队 + 火山引擎团队</strong>：整合成立新的ToB市场组织"创造力服务平台"，统一负责MaaS和SaaS云服务的市场、销售和客户服务。</li>
<li><strong>豆包企业版开启内测</strong>：原生集成飞书文档、表格、会议、群聊，支持企业知识库问答与智能创作，配备企业级数据隔离与权限管控。</li>
</ul>
<p class="dr-p">这条消息真正的分量，藏在数字里：</p>
<ul class="dr-ul">
<li><strong>豆包日均Token调用量突破180万亿</strong>——企业是真的在大量使用，不是PPT里的大模型。</li>
<li><strong>字节大模型业务ARR达40亿美元</strong>——超过国内其他模型公司ARR总和。</li>
<li><strong>飞书Q2新增客户中超九成同步采购飞书AI产品</strong>——AI不是附加卖点，是成交原因。</li>
</ul>
<h3 class="dr-h3">怎么理解：AI ToB从"卖模型"进入"卖方案"</h3>
<p class="dr-p">过去一年，AI ToB市场的竞争是"比参数、比价格"——谁家的模型聪明、谁的Token便宜，企业就买谁。字节这一刀，把竞争逻辑整个换掉了：<strong>把大模型（豆包）、协同办公（飞书）、云基础设施（火山引擎）捏成一个人，向企业交付的不是模型，而是一整套"AI企业操作系统"。</strong></p>
<p class="dr-p">这对企业客户意味着什么？意味着他们不再需要自己拼装AI——不用再纠结"该用哪个模型、怎么接进OA、数据放哪里"。字节把螺丝拧好了，企业打开就能用。这也正是豆包企业版内测的核心卖点：<strong>不打折地集成飞书全场景。</strong></p>
<blockquote class="dr-blockquote"><p>白话翻译：以前买AI像自己攒电脑——显卡、内存、主板分开买，还得会装。字节现在卖给你的是品牌整机——开机就能用，坏了找售后。企业客户从"技术决策"变成了"应用决策"。这对销售最大的启发是：客户买的不是技术，是"省心"和"确定性"。</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">第二章：白鸦的"保底线"——当所有人都在All in</h2>
<h3 class="dr-h3">白鸦说了什么</h3>
<p class="dr-p">同样在7月底，有赞CEO白鸦接受专访，抛出了一组与"All in"完全相反的观点：</p>
<ul class="dr-ul">
<li><strong>AI杀死的是"臃肿"，不是SaaS</strong>：只有记录功能、没有运营深度的软件会被替代；靠近营销、销售、运营的前端SaaS，壁垒反而因为AI变强。</li>
<li><strong>先保底线，再谈进化</strong>："什么积累都没有、什么客户责任都不用承担的人，可以天天喊革命。当你有大量的客户，你要为这些客户承担责任，你没有权力All in。"</li>
<li><strong>"筹码少了才会All in"</strong>：留在牌桌上就可以了。</li>
<li><strong>"含硅率"考核</strong>：有赞用"你用了多少AI干活"来考核团队，给员工发Token补贴，用真金白银投资内部AI孵化。</li>
</ul>
<h3 class="dr-h3">为什么"保底线"反而是对的</h3>
<p class="dr-p">把字节和白鸦放在一起看，特别有意思。字节All in，是因为它有海量算力、有流量入口、有试错的资本——它是"庄家"，庄家有权力下重注。但绝大多数企业客户不是庄家，他们是"在牌桌上捡钢镚的人"。白鸦说得很直白：ToB是"撅着屁股捡钢镚"的行业，AI跑太快，试错成本太高。</p>
<p class="dr-p">所以对普通商家来说，正确的姿势不是跟风All in买一堆AI工具，而是<strong>先用AI把最痛的那一个环节打透</strong>——比如用AI客服把售后人力省下来，用AI营销把转化率提上去，用AI数字员工把重复劳动接走。先保住底线，再谈进化。</p>
<blockquote class="dr-blockquote"><p>白鸦式销售逻辑：客户问"我该不该上AI"时，别急着让他All in。先问他：你现在最疼的环节是什么？我们先用AI解决这一个。有效，再复制；无效，你也没多大损失。这不是保守——这是对一个要为自己的客户负责的人，最负责任的做法。</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">第三章：AI变成货架上的"类目"——新一轮消费增量</h2>
<h3 class="dr-h3">三个信号</h3>
<ul class="dr-ul">
<li><strong>拼多多开AI玩具类目</strong>：平台主动招商AI情感陪伴玩偶、桌面机器人、AI教育玩具，行业增速87%+，2030年破千亿。</li>
<li><strong>ChinaJoy被AI重写</strong>：游戏展的主角变成了格斗机器人、AI眼镜、Agent PC。京东展台集结荣耀Robot Phone、三星Z TriFold等旗舰。</li>
<li><strong>中国机器人出口全球第二</strong>：前5个月出口199.9亿元（+39.5%），清洁机器人占全球出口近70%，全球90%量产人形机器人来自中国。</li>
</ul>
<h3 class="dr-h3">怎么理解：AI第一次变成了"可购买的商品"</h3>
<p class="dr-p">过去两年，AI消费主要发生在软件层——你买会员、买API、买SaaS。但2026年，AI正在大规模进入实物层：<strong>消费者可以花钱买到"看得见摸得着"的AI。</strong>AI玩具是AI，AI眼镜是AI，格斗机器人是AI，Agent PC是AI。</p>
<p class="dr-p">这对做电商和零售的人是一个重要提醒：<strong>AI不只是在帮商家降本增效，AI本身正在成为新的品类增量。</strong>拼多多开类目，是因为平台嗅到了需求；ChinaJoy挤满了人，是因为消费者在好奇；中国机器人出口全球第二，是因为全世界在买单。</p>
<p class="dr-p">如果你客户的品类正好和AI硬件沾边——哪怕是做配件的、做内容的、做服务的——这都是一个可以借势的话题。就算不沾边，"AI消费品崛起"本身就是一个可以和任何商家聊的宏观趋势：消费者愿意为"AI+实体"付溢价，这意味着他们愿意为"体验升级"付溢价。</p>
<blockquote class="dr-blockquote"><p>市场视角：AI从"效率工具"变成"货架商品"，最大的商业含义是——它开始直接贡献GMV，而不是只贡献利润率。当一个技术同时能帮你省钱（工具）又帮你赚钱（商品）的时候，它就不是风口，是基建。</p></blockquote>
<hr class="dr-hr">
<h2 class="dr-h2">终章：消费分化下的"旧逻辑失效"——销售的新机会</h2>
<p class="dr-p">今天还有一组数据，同样值得放进销售弹药库：</p>
<ul class="dr-ul">
<li><strong>2026上半年零售分化</strong>：便利店+6.6%、超市+3.8%在涨，百货-2.1%、品牌专卖店-8.7%在跌——旧的增长逻辑正在失效。</li>
<li><strong>储蓄率54%创历史新高</strong>，二季度消费意愿指数122.8（同比+2.5点）——消费者不是没钱，是更会算了。</li>
<li><strong>快消品自有品牌销售增长超60%</strong>，53%城镇家庭买过自有品牌；即时零售渗透率24.8%，折扣业态7.8%——渠道和品牌结构都在变。</li>
<li><strong>近八成消费者认为AI已影响消费决策</strong>——AI对消费的影响，第一次超过传统广告。</li>
</ul>
<p class="dr-p">把这组数据和前面三章连起来看，结论很清楚：<strong>消费没有消失，只是在重组。</strong>旧逻辑失效，新逻辑正在长出来——信任比流量值钱，复购比拉新值钱，经营深度比铺货广度值钱。而这恰恰是前端SaaS最擅长的事，也是白鸦说的"前端壁垒反而因AI变强"。</p>
<p class="dr-p">所以，AI时代的销售，卖的从来不是软件，是两样东西：<strong>第一，帮客户看清"变化"的能力；第二，陪客户守住"底线"的确定性。</strong>前者用今天的信息武装自己，后者用长期的陪伴兑现承诺。</p>

        { date: "2026-07-31", script: "李总你好，我昨天看到一条消息——字节把飞书、豆包、火山引擎合成了一条线专攻AI企业服务，大模型ARR做到40亿美元，超过国内其他模型公司ARR总和。同时拼多多新开了AI玩具类目，ChinaJoy上机器人都开始打拳了。我在想，AI已经不只是工具，它开始变成组织、变成货架上的商品了。你的品类跟AI沾不沾边，这可能都值得聊聊。3分钟方便吗？", note: "用字节组织战+AI玩具类目两个反直觉信号开场，证明你时刻在关注行业，不是来推销的。" },

        { date: "2026-07-30", script: "张总，我刚看到一组数据——2025年中国云计算市场规模已经破万亿了，SaaS增长了36%。连7-Eleven都开始做短保零食了。这说明什么？所有行业都在加速数字化。连卖零食的都开始用数字化管供应链了。我今天不是来推销的——我整理了一份你们行业上半年的数据变化，想跟你聊聊，3分钟够吗？", note: "用云计算破万亿+7-Eleven短保零食两个跨界案例展现你的信息广度。让客户觉得这个人确实眼界广。" },
        { date: "2026-07-30", script: "李总，有个事我觉得你应该知道——千岸科技，一个做自有品牌出海的公司，昨天在北交所上市了，首日涨了167%。这说明跨境电商正在从铺货模式走向品牌化。你的同行已经开始用品牌思维做线上生意了。我就在想，你的生意是不是也可以往这个方向想一想？", note: "用千岸科技上市案例开场——跨境电商品牌化的信号。适合跟做B2B/跨境的客户聊。" },
        { date: "2026-07-29", script: "王总，你知道现在有21岁的年轻人拿了几千万融资，做了一件什么事吗？他做了一个叫Nile的平台——帮品牌在AI的世界里'开店'。已经有500多个品牌在用了，转化率平均提升150%。我打电话来不是推销的——我想知道，你的商品数据AI看得懂吗？", note: "用年轻创业者的故事开场，有反差感、有数据、有悬念。" },
        { date: "2026-07-24", script: "李总你好，我是做电商系统的小张。我注意到你店铺在XX品类做得不错，特别是有XX款卖得挺好。我今天不是来推销的——我最近在研究你们这个品类，发现几个有意思的数据，想跟你分享3分钟，方便吗？", note: "先做功课再打电话。说明你认识他的生意（他不好意思拒绝），给价值（分享数据）而不是直接推销。" },
        { date: "2026-07-24", script: "王总，我刚看到一个跟你品类相关的数据——淘天上个月刚上线了AI购物，消费者说句话就能买东西了。我在想这个对你店铺会有什么影响，想跟你聊聊。3分钟够吗？", note: "用行业新闻开场。你表现出的是'关注他行业'而不是'想卖他东西'。" },

    {

        { date: "2026-07-29", script: "客户说：'AI购物那些都是大品牌的事，跟我小商家没关系。'<br><br>你可以回：王总，以前我也觉得小商家不用操心AI的事。但我前两天看到一个数据——AI代理流量已经占总流量60%了。Gartner预测到2028年90%的B2B采购将由AI代理完成。这不是大品牌的事，是所有做线上生意的人的事。你的同行可能已经在用AI工具了，你今天不用，明天就被落下了。", note: "用AI流量占比60%和Gartner预测90%这两个数据打消'与我无关'的心理。数据比道理更有说服力。" },
        { date: "2026-07-30", script: "客户说：'SaaS是不是不行了？大家都在说AI会取代软件。'<br><br>你可以回：王总，你这个问题问得好。刚好我看到一份中信里昂的研报，他们说'AI导致软件消亡'的担忧被夸大了。ServiceNow的工作流、Salesforce的销售关联、Oracle的数据库——这些护城河短期替代不了。更重要的是，全球SaaS市场Q2还在增长25%。不是SaaS不行了，是那些只会记账的SaaS不行了。有赞这种靠近交易的SaaS，壁垒反而更高了。", note: "用中信里昂最新研报+ISG增长数据两个权威来源打消客户对SaaS前景的担忧。先承认问题，再用数据反转。" },
        { date: "2026-07-29", script: "客户说：'AI就是一阵风，过了就好了。'<br><br>你可以回：李总，我理解你的怀疑。但你看几个趋势——Nile刚拿了数千万融资做Agent电商基建，Adobe把产品目录接入了ChatGPT，Kimi K3编程能力全球第一。三件事同时发生，不是一阵风，是基础设施建设。就像2015年你不上微信支付，后来发现不做不行。AI现在就是这个阶段。", note: "用类比（微信支付的历史）让客户理解AI不是一阵风而是基础设施。" },
        { date: "2026-07-24", script: "客户说 '太贵了'\n\n回复：王总，你觉得贵很正常。我换个角度跟你说——你现在每个月的流量成本是多少？如果用有赞，你的老客户复购率能提升10%，就相当于你每个月多了一笔不用花钱买流量的收入。系统不是成本，是帮你省广告费的工具。", note: "不要辩解价格，要帮客户算账。把价格翻译成'少花的钱'或'多赚的钱'。" },
        { date: "2026-07-24", script: "客户说 '我们暂时不需要'\n\n回复：明白，可能你现在确实挺忙的。我只是觉得这个机会有点可惜——你同品类的XX品牌已经开始用了，6个月复购率提升了28%。我换个时间再打给你，到时候我整理一份你们品类的同行数据给你看。", note: "不要追问'为什么不需要'。尊重他的判断，但留下一个钩子（同行案例+下次带数据）。" },
        { date: "2026-07-24", script: "客户说 '我们已经有用其他系统了'\n\n回复：没关系，用过了才知道什么好用。我想了解的是——你们现在用的系统，在客户复购和私域运营上，解决了哪些问题、还有哪些没解决的？有赞在这块有一些不一样的做法，可以给你参考。", note: "不要攻击竞品。先承认'用过了才知道'，然后把话题引导到'还有什么没解决的'——那才是你的机会。" },
        { date: "2026-07-24", script: "客户说 '有赞不就是个微商城吗？'\n\n回复：以前可能确实是。但现在的有赞是'把生意装进系统'——从商品上架到库存管理、从营销活动到客户复购、从数据看板到AI数字员工，是一整套经营系统。微商城只是冰山一角。", note: "客户对产品印象可能过时了。不要生气，温和地纠正——'以前是，但现在已经是XX了'。" },
        { date: "2026-07-28", script: "客户说：现在大环境不好，都在省钱，哪还有预算上系统？<br><br>你可以回：王总，我认同现在环境不好——刚好今天看到一组数据：6月出口增了27%、跨境电商海外仓增长3.3倍。生意难做是真的，但难做的时候反而是格局重组的时候。你现在上个系统把客户数据抓在自己手里，等到行情回暖的时候，你比别人先跑一步。这不是花钱，是抄底。", note: "用今天的情报（出口数据、跨境电商增长）支撑你的论点——经济不好但机会在。" }
      ]

    {

      cards: [
        { date: "2026-07-31", script: "面访问题升级版（7/31版）：<br><br>1. 你注意到没有——字节把飞书、豆包、火山合成一条线做AI ToB了，大模型ARR做到40亿美元。你觉得这对你们行业意味着什么？——用巨头组织动作引出客户对AI趋势的判断。<br><br>2. 白鸦说‘筹码少了才会All in’，先保底线再进化。你觉得你的生意，是应该All in AI，还是先守住基本盘、找最疼的一环打透？——用‘庄家vs玩家’框架帮客户定位自己。<br><br>3. 如果只让你选一个环节用AI先打透——选品、客服、还是老客复购？你选哪个？——把宏大的AI话题落地到具体动作。", note: "三个问题从宏观趋势到经营定位再到具体动作，层层递进，帮客户完成‘AI与我有关’的认知转变。" },
        { date: "2026-07-29", script: "面访问题升级版（7/29版）：<br><br>1. 你知不知道现在全网流量有60%是AI产生的？——用这个数据开场，客户一定会好奇。<br><br>2. 你觉得对于你的品类来说，未来两年最大的渠道变化可能是什么？——引导客户思考AI购物对他品类的影响。<br><br>3. 如果你的商品数据标准化到AI能直接读取，你觉得对你的生意有多大帮助？——用Nile和Adobe的案例引出产品数据化的重要性。", note: "三个问题覆盖了7/29的核心情报：AI流量占比、AI购物趋势、商品数据标准化。" },
        { date: "2026-07-30", script: "面访问题升级版（7/30版）：<br><br>1. 今年上半年的消费数据你看了吗？71.2%的人在找平替——你的客户属于左边还是右边？——用消费K型分化数据引出客户画像讨论。<br><br>2. 你知不知道全球SaaS市场Q2增长了25%，亚太区涨了49%？中国云计算市场破万亿了——你在这个趋势里还是趋势外？——用宏观数据判断客户数字化成熟度。<br><br>3. 如果现在有一个新的出海机会——像千岸科技那样做自有品牌，你愿意尝试吗？——用上市案例引出品牌化和出海话题。", note: "三个问题覆盖7/30核心情报：消费K型分化、SaaS增长数据、跨境电商资本化。" },
        { date: "2026-07-24", script: "【开场破冰】\n'张总，感谢你抽出时间。我今天来主要不是介绍产品的——我想先了解一下你的生意情况，再看看有没有什么地方是我能帮上忙的。'", note: "不要一坐下就开始演示产品。先了解客户，再给方案。你的'帮上忙'姿态建立了合作而非推销的关系。" },
        { date: "2026-07-24", script: "【诊断问题】\n'你现在每个月新客户大概多少？老客户回头率怎么样？'\n'你的客户离店之后，你还能联系得上他们吗？'\n'你统计过一个月流失多少客户吗？这些流失的客户值多少钱？'", note: "用SPIN销售法的情境→难点问题框架。别问封闭式问题（'要不要'），问开放式问题（'怎么样'）。" },
        { date: "2026-07-28", script: "面访问题升级版：<br><br>1. 你觉得你的客户现在做消费决策时，跟三年前比最大的变化是什么？——用消费信任调查（48%消费者计划控制消费）引出客户行为变化。<br><br>2. 如果今天有一个新渠道（比如即时零售或私域），能帮你绕过平台的退货率陷阱，你愿意投入多少精力？——用山姆即时零售1800亿的数据引出私域价值。<br><br>3. 你觉得AI在你这个品类里，最可能先替代哪个环节？——用OpenAI Presence和腾讯Work Buddy的信息打AI话题。", note: "三个问题覆盖了7/28情报的核心主题：消费信任、即时零售、AI渗透。" },
        { date: "2026-07-24", script: "【展示价值】\n'你刚才说的这个问题，其实很多同行都遇到过。我这边有一个案例——XX品牌也是做你们这个品类的，它们用了一套系统把老客复购率从15%提到了38%。你想看看他们怎么做的吗？'", note: "用案例替换说教。'很多同行都遇到过'→不是他一个人有问题→降低防御心理。'你想看看吗'→让他说好。" },
        { date: "2026-07-24", script: "【收尾推进】\n'今天聊下来，我觉得对你最有价值的是两个方向：一是把流失的客户找回来，二是让新客户变成老客户。我回去帮你整理一份方案，下周二发给你？'\n'下次我来的时候，可以直接带一份你们品类的行业数据报告吗？'", note: "每次面访要有明确的下一步。不要留'我回去想想'的模糊空间。" },
        { date: "2026-07-28", script: "王总，我理解你还在犹豫。不如这样——我帮你先做一次免费的线上诊断，看看你现在的客户数据管理情况。如果诊断下来你的数据没什么大问题、你本来就管得很好，那就不用系统了，你省事我也省事。但如果发现问题，我们再聊方案。你没有任何损失。", note: "用免费诊断代替逼单——先给价值，再谈成交。这是FDE思维在销售中的运用。" }

        { date: "2026-07-31", script: "“王总，你知道吗——字节这种体量的公司，都为了AI把组织架构拆了重组，说明这波不是一阵风，是基建。但同时白鸦提醒咱们：别All in，先保底线。对你来说，最好的时机就是现在——用最小的成本，先把复购和客户资产这一环用AI工具打透。等到大浪真来了，你已经在船上了。等你的同行反应过来，成本就不只是现在的价格了。”", note: "用‘巨头All in证明趋势 + 白鸦保底线提醒姿势’组合拳，构建‘现在是低成本上车窗口期’的紧迫感。" },
        { date: "2026-07-29", script: "'王总，你知道现在AI代理流量已经占全网60%了吗？Gartner说到2028年90%的B2B采购是AI在决定。你现在的客户数据如果没有系统化沉淀，等到AI时代到来的时候，你连'被推荐'的资格都没有。你现在花两万上系统不是花钱，是在AI时代买一个入场券。'", note: "用AI流量60%的趋势倒逼决策——现在是'入场'的关键时间窗口。" },

/* ---- Knowledge Base (with search & date grouping) ---- */
function renderKnowledgeBase(searchTerm) {
  let allItems = [];
  Object.values(ALL_DATA).forEach(arr => { allItems = allItems.concat(arr); });

  // Apply search filter if provided
  if (searchTerm) {
    const st = searchTerm.toLowerCase();
    allItems = allItems.filter(item =>
      item.t.toLowerCase().includes(st) ||
      item.desc.toLowerCase().includes(st) ||
      item.s.toLowerCase().includes(st) ||
      (item.tags || []).some(t => t.toLowerCase().includes(st))
    );
  }

  const sources = new Set(allItems.map(i => i.s));
  const dates = getSortedDates();
  document.getElementById('statItems').textContent = allItems.length;
  document.getElementById('statSources').textContent = sources.size;
  document.getElementById('statUpdated').textContent = dates[0] || '-';

  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  CAT_ORDER.forEach(key => {
    const cat = CAT_MAP[key];
    const subTags = CAT_SUBTAGS[key] || [];
    const catItems = allItems.filter(i => i.c === key);

    // Group by month
    const monthGroups = {};
    catItems.forEach(item => {
      const m = item.d.substring(0, 7);
      if (!monthGroups[m]) monthGroups[m] = [];
      monthGroups[m].push(item);
    });
    const months = Object.keys(monthGroups).sort().reverse();

    function monthLabel(m) {
      const [y, mo] = m.split('-');
      return `${y}年${parseInt(mo)}月`;
    }

    let itemsHTML = '';
    if (catItems.length) {
      months.forEach((m, mi) => {
        const items = monthGroups[m];
        itemsHTML += `
          <div class="date-group">
            <div class="date-group-header" data-dgk="${key}:${m}">
              <span class="date-group-arrow">${mi === 0 ? '▼' : '▶'}</span>
              <span class="date-group-label">${monthLabel(m)}</span>
              <span class="date-group-count">${items.length} 条</span>
            </div>
            <div class="date-group-items"${mi > 0 ? ' style="display:none"' : ''}>
              ${items.map(item => `
                <div class="kb-item">
                  <div class="kb-item-info">
                    <a href="${item.l}" target="_blank" rel="noopener" class="kb-item-title">${item.t}</a>
                    <div class="kb-item-meta">${item.s} · ${item.d}</div>
                  </div>
                  <a href="${item.l}" target="_blank" rel="noopener" class="kb-item-link">原文</a>
                </div>
              `).join('')}
            </div>
          </div>`;
      });
    } else {
      itemsHTML = `<div style="padding:12px 0;color:var(--text-light);font-size:13px;text-align:center;">暂无${searchTerm ? '匹配' : '沉淀'}内容</div>`;
    }

    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.cat = key;
    card.innerHTML = `
      <div class="cat-card-header">
        <div class="cat-icon ${cat.bgCls}">${cat.icon}</div>
        <div>
          <div class="cat-name">${cat.label}</div>
          <div class="cat-count">${catItems.length} 条${searchTerm ? '匹配结果' : '沉淀情报'}</div>
        </div>
      </div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="cat-tags">${subTags.map(t => `<span class="cat-tag">${t}</span>`).join('')}</div>
      <div class="cat-items" id="kbItems-${key}">${itemsHTML}</div>`;

    card.addEventListener('click', (e) => {
      // Date group header toggle
      const dgHeader = e.target.closest('.date-group-header');
      if (dgHeader) {
        e.stopPropagation();
        const group = dgHeader.closest('.date-group');
        const itemsEl = group.querySelector('.date-group-items');
        const arrow = dgHeader.querySelector('.date-group-arrow');
        if (itemsEl.style.display === 'none') {
          itemsEl.style.display = 'block';
          arrow.textContent = '▼';
        } else {
          itemsEl.style.display = 'none';
          arrow.textContent = '▶';
        }
        return;
      }
      // Category card expand/collapse
      if (!e.target.closest('a')) card.classList.toggle('expanded');
    });
    grid.appendChild(card);
  });
}

/* ---- Search binding ---- */
const kbSearchInput = document.getElementById('kbSearch');
const kbSearchClear = document.getElementById('kbSearchClear');
let kbSearchTimer;
if (kbSearchInput) {
  kbSearchInput.addEventListener('input', () => {
    clearTimeout(kbSearchTimer);
    kbSearchTimer = setTimeout(() => {
      const val = kbSearchInput.value.trim();
      kbSearchClear.classList.toggle('visible', !!val);
      renderKnowledgeBase(val);
    }, 200);
  });
  kbSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      kbSearchInput.value = '';
      kbSearchClear.classList.remove('visible');
      renderKnowledgeBase('');
      kbSearchInput.blur();
    }
  });
}
if (kbSearchClear) {
  kbSearchClear.addEventListener('click', () => {
    kbSearchInput.value = '';
    kbSearchClear.classList.remove('visible');
    renderKnowledgeBase('');
    kbSearchInput.focus();
  });
}

/* ---- Dashboard ---- */
let currentDateIdx = 0, currentDashTab = 'all';

function renderDashboard() {
  const dates = getSortedDates();
  if (!dates.length) return;
  currentDateIdx = Math.max(0, Math.min(currentDateIdx, dates.length-1));
  const dateStr = dates[currentDateIdx], data = ALL_DATA[dateStr] || [];
  document.getElementById('dashDate').textContent = dateStr;
  document.getElementById('dashWeekday').textContent = getWeekday(dateStr);
  document.getElementById('datePrev').disabled = currentDateIdx >= dates.length - 1;
  document.getElementById('dateNext').disabled = currentDateIdx <= 0;
  document.getElementById('dateDots').innerHTML = dates.map((d, i) =>
    `<span class="date-dot ${i===currentDateIdx?'active':''} ${ALL_DATA[d]&&ALL_DATA[d].length?'has-data':''}"></span>`
  ).join('');
  const sources = new Set(data.map(i => i.s));
  document.getElementById('dashTotal').textContent = data.length;
  document.getElementById('dashSources').textContent = sources.size;
  ['all',...CAT_ORDER].forEach(k => {
    const el = document.getElementById('dcount-'+k);
    if (el) el.textContent = k==='all' ? data.length : data.filter(i=>i.c===k).length;
  });
  ['all',...CAT_ORDER].forEach(cat => {
    const container = document.getElementById('dtab-'+cat);
    if (!container) return;
    const list = cat==='all' ? data : data.filter(i=>i.c===cat);
    if (!list.length) { container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">该分类暂无情报</div></div>`; return; }
    container.innerHTML = list.map(item => {
      const ci = CAT_MAP[item.c] || { icon:'📋', tagCls:'tag-default' };
      return `<div class="card">
        <div class="card-header"><div>
          <a href="${item.l}" target="_blank" rel="noopener" class="card-title">${item.t}</a>
          <div class="card-source">${ci.icon} ${item.s} · ${item.d}</div>
        </div></div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-footer">
          <div class="card-tags">${(item.tags||[]).map(t => `<span class="tag ${ci.tagCls}">${t}</span>`).join('')}</div>
          <a href="${item.l}" target="_blank" rel="noopener" class="card-link-btn">🔗 阅读原文</a>
        </div>
      </div>`;
    }).join('');
  });
  document.querySelectorAll('.dash-content').forEach(el => el.classList.remove('active'));
  const tgt = document.getElementById('dtab-'+currentDashTab);
  if (tgt) tgt.classList.add('active');
}

/* ---- Daily Report ---- */
let currentDrIdx = 0;

function renderDailyReport(dateStr) {
  const drDates = Object.keys(DAILY_REPORT).sort().reverse();
  currentDrIdx = drDates.indexOf(dateStr);
  if (currentDrIdx === -1) currentDrIdx = 0;
  const actualDate = drDates[currentDrIdx] || dateStr;
  const data = DAILY_REPORT[actualDate];
  document.getElementById('drDate').textContent = actualDate;
  document.getElementById('drWeekday').textContent = getWeekday(actualDate);
  document.getElementById('drPrev').disabled = currentDrIdx >= drDates.length - 1;
  document.getElementById('drNext').disabled = currentDrIdx <= 0;
  if (!data) {
    document.getElementById('dr-content').innerHTML = '<div class="talk-empty"><div class="talk-empty-icon">📭</div><div class="talk-empty-text">暂无当日深度日报</div></div>';
    return;
  }
  document.getElementById('dr-content').innerHTML = `<div class="dr-article">${data}</div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

if (document.getElementById('drPrev')) {
  document.getElementById('drPrev').addEventListener('click', () => {
    const drDates = Object.keys(DAILY_REPORT).sort().reverse();
    if (currentDrIdx < drDates.length - 1) {
      currentDrIdx++;
      renderDailyReport(drDates[currentDrIdx]);
    }
  });
  document.getElementById('drNext').addEventListener('click', () => {
    const drDates = Object.keys(DAILY_REPORT).sort().reverse();
    if (currentDrIdx > 0) {
      currentDrIdx--;
      renderDailyReport(drDates[currentDrIdx]);
    }
  });
}

document.getElementById('datePrev').addEventListener('click', () => { const d=getSortedDates(); if(currentDateIdx<d.length-1){currentDateIdx++;renderDashboard();} });

    btn.classList.add('active');
    currentDashTab = btn.dataset.dtab;
    document.querySelectorAll('.dash-content').forEach(el=>el.classList.remove('active'));
    const tgt = document.getElementById('dtab-'+currentDashTab);
    if (tgt) tgt.classList.add('active');
  });
});

/* ---- Today display ---- */
const today = new Date();
document.getElementById('todayDisplay').textContent =
  today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
document.getElementById('weekdayDisplay').textContent = getWeekday(
  today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0')
);

/* ---- Sales Mode (销售心法) ---- */
function renderSales() {
  const data = SALES_DATA;
  const container = document.getElementById('sales-content');
  if (!container) return;

  // Build today's insight
  const insightHTML = data.todaysInsight ? `
    <div class="sales-section">
      <div class="sales-section-header">📌 今日销售启发</div>
      <div class="sales-insight-card">
        <div class="sales-insight-title">${data.todaysInsight.title}</div>
        <div class="sales-insight-source">${data.todaysInsight.source}</div>
        <div class="sales-insight-body">${data.todaysInsight.body}</div>
        <div class="sales-insight-action">${data.todaysInsight.action}</div>
      </div>
    </div>` : '';

  // ── Helper: split into daily (has date) vs foundational ──
  const splitDaily = arr => {
    const daily = arr.filter(x => x.date).sort((a, b) => b.date.localeCompare(a.date));
    const base = arr.filter(x => !x.date);
    return { daily, base };
  };

  // ── Build classics library ──
  const { daily: dailyC, base: baseC } = splitDaily(data.classics);
  const classicsHTML = `
    <div class="sales-section">
      <div class="sales-section-header">📚 经典理论库 <span class="sales-count-badge">${data.classics.length}套</span></div>
      <div class="sales-classics-grid" id="salesClassics">
        ${dailyC.map(c => `
          <div class="sales-classic-card sales-daily-card" data-classic="${c.id}">
            <div class="sales-daily-ribbon">📅 ${c.date} · 今日发现</div>
            <div class="sales-cc-header">
              <span class="sales-cc-icon">${c.icon}</span>
              <span class="sales-cc-name">${c.name}</span>
            </div>
            <div class="sales-cc-quote">&ldquo;${c.quote}&rdquo;</div>
            <div class="sales-cc-body">
              ${c.principles.map(p => `
                <div class="sales-cc-principle">
                  <div class="sales-cc-p-title">${p.title}</div>
                  <div class="sales-cc-p-desc">${p.desc}</div>
                  <div class="sales-cc-p-example">${p.example}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
        ${baseC.map(c => `
          <div class="sales-classic-card" data-classic="${c.id}">
            <div class="sales-cc-header">
              <span class="sales-cc-icon">${c.icon}</span>
              <span class="sales-cc-name">${c.name}</span>
            </div>
            <div class="sales-cc-quote">&ldquo;${c.quote}&rdquo;</div>
            <div class="sales-cc-body">
              ${c.principles.map(p => `
                <div class="sales-cc-principle">
                  <div class="sales-cc-p-title">${p.title}</div>
                  <div class="sales-cc-p-desc">${p.desc}</div>
                  <div class="sales-cc-p-example">${p.example}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;

  // ── Build toolbox ──
  const toolboxHTML = `
    <div class="sales-section">
      <div class="sales-section-header">🛠️ 实战工具箱 <span class="sales-count-badge">${data.toolbox.reduce((s,t)=>s+t.cards.length,0)}条话术</span></div>
      <div class="sales-scenarios" id="salesScenarios">
        ${data.toolbox.map((t, i) => `
          <button class="sales-scenario-tab ${i===0?'active':''}" data-stab="${t.id}">${t.icon} ${t.name}</button>
        `).join('')}
      </div>
      ${data.toolbox.map((t, i) => {
        const { daily: dailyCards, base: baseCards } = splitDaily(t.cards);
        return `
        <div class="sales-tool-content ${i===0?'active':''}" id="stab-${t.id}">
          ${dailyCards.map(c => `
            <div class="sales-tool-card sales-daily-card">
              <div class="sales-daily-ribbon">📅 ${c.date} · 今日新增</div>
              <div class="sales-tool-script">${c.script.replace(/\n/g, '<br>')}</div>
              <div class="sales-tool-note">💡 ${c.note}</div>
            </div>
          `).join('')}
          ${baseCards.map(c => `
            <div class="sales-tool-card">
              <div class="sales-tool-label">${c.note.trim().length > 50 ? '用前须知' : '适用场景'}</div>
              <div class="sales-tool-script">${c.script.replace(/\n/g, '<br>')}</div>
              <div class="sales-tool-note">💡 ${c.note}</div>
            </div>
          `).join('')}
        </div>`;
      }).join('')}
    </div>`;

  // ── Build human wisdom ──
  const { daily: dailyW, base: baseW } = splitDaily(data.wisdom);
  const wisdomHTML = `
    <div class="sales-section">
      <div class="sales-section-header">🧠 人情世故 <span class="sales-count-badge">${data.wisdom.length}条</span></div>
      <div class="sales-wisdom-grid">
        ${dailyW.map(w => `
          <div class="sales-wisdom-card sales-daily-card">
            <div class="sales-daily-ribbon">📅 ${w.date} · 今日更新</div>
            <div class="sales-wisdom-title">${w.title}</div>
            <div class="sales-wisdom-body">${w.body}</div>
          </div>
        `).join('')}
        ${baseW.map(w => `
          <div class="sales-wisdom-card">
            <div class="sales-wisdom-title">${w.title}</div>
            <div class="sales-wisdom-body">${w.body}</div>
          </div>
        `).join('')}
      </div>
    </div>`;

  container.innerHTML = insightHTML + classicsHTML + toolboxHTML + wisdomHTML;
}

/* ---- Sales event listeners (call after renderSales) ---- */
function initSalesEvents() {
  // Classic card expand/collapse
  document.querySelectorAll('.sales-classic-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      card.classList.toggle('expanded');
    });
  });

  // Toolbox scenario tabs
  document.querySelectorAll('.sales-scenario-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sales-scenario-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.sales-tool-content').forEach(el => el.classList.remove('active'));
      const tgt = document.getElementById('stab-' + btn.dataset.stab);
      if (tgt) tgt.classList.add('active');
    });
  });
}

/* ---- Init ---- */
document.addEventListener('DOMContentLoaded', () => {
  renderKnowledgeBase('');
  renderDashboard();
  const drDates = Object.keys(DAILY_REPORT).sort().reverse();
  renderDailyReport(drDates[0] || getSortedDates()[0]);
  renderSales();
  initSalesEvents();
});
</script>
