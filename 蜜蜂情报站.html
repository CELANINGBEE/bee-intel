<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 蜜蜂情报站</title>
<style>
:root {
  --bg: #f5f6f8;
  --card-bg: #fff;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-light: #9ca3af;
  --border: #e5e7eb;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --green: #059669;
  --green-light: #d1fae5;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
.header {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  padding: 28px 24px 0;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner { max-width: 1100px; margin: 0 auto; }
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.logo-text { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; }
.logo-sub { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 400; }
.header-date { text-align: right; }
.date-main { font-size: 14px; font-weight: 600; }
.date-sub { font-size: 11px; color: rgba(255,255,255,0.55); }

/* Mode tabs */
.mode-nav {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 4px;
}
.mode-btn {
  flex: 1;
  padding: 10px 24px;
  font-size: 14px;
  font-weight: 600;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.55);
  cursor: pointer;
  border-radius: 10px;
  transition: all 0.25s;
  white-space: nowrap;
}
.mode-btn:hover { color: rgba(255,255,255,0.85); }
.mode-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

.main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 48px; }
.mode-content { display: none; }
.mode-content.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ====== Knowledge Base Mode ====== */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(79,70,229,0.08); }
.stat-number { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1.2; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.cat-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
}
.cat-card:hover { border-color: var(--accent); box-shadow: 0 4px 16px rgba(79,70,229,0.1); transform: translateY(-1px); }
.cat-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.cat-icon {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.cat-icon-bg-ecommerce { background: #fef3c7; }
.cat-icon-bg-retail { background: #e0f2fe; }
.cat-icon-bg-ai { background: #ede9fe; }
.cat-icon-bg-business { background: #d1fae5; }
.cat-icon-bg-data { background: #fce7f3; }
.cat-name { font-size: 16px; font-weight: 700; }
.cat-count { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }
.cat-desc { font-size: 12px; color: var(--text-light); line-height: 1.5; margin-bottom: 10px; padding-left: 52px; }
.cat-tags { display: flex; gap: 4px; flex-wrap: wrap; padding-left: 52px; }
.cat-tag { font-size: 10px; padding: 2px 10px; border-radius: 10px; background: var(--accent-light); color: var(--accent); font-weight: 500; }

.cat-items {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
  opacity: 0;
  margin-top: 0;
}
.cat-card.expanded .cat-items { max-height: 2000px; opacity: 1; margin-top: 14px; }
.cat-card.expanded { border-color: var(--accent); background: #fafbff; }

.kb-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.kb-item:last-child { border-bottom: none; }
.kb-item-info { flex: 1; min-width: 0; }
.kb-item-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  text-decoration: none;
  line-height: 1.5;
  transition: color 0.15s;
}
.kb-item-title:hover { color: var(--accent); text-decoration: underline; }
.kb-item-meta { font-size: 11px; color: var(--text-light); margin-top: 3px; }
.kb-item-link {
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  white-space: nowrap;
  padding: 3px 10px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.kb-item-link:hover { background: var(--accent-light); }

/* ====== Dashboard Mode ====== */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 16px;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.date-arrow {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card-bg);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  color: var(--text-secondary);
}
.date-arrow:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.date-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
.date-display { font-size: 18px; font-weight: 700; min-width: 130px; text-align: center; }
.date-weekday { font-size: 13px; color: var(--text-secondary); font-weight: 400; }
.date-dot-wrap { display: flex; gap: 6px; align-items: center; }
.date-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.2s; }
.date-dot.has-data { background: var(--accent); box-shadow: 0 0 4px rgba(79,70,229,0.4); }
.date-dot.active { background: var(--accent); transform: scale(1.3); }

.dash-tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  margin-bottom: 16px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
}
.dash-tab {
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  white-space: nowrap;
}
.dash-tab:hover { color: var(--text); background: var(--bg); }
.dash-tab.active { background: var(--accent); color: #fff; }
.dash-tab-count {
  display: inline-block;
  background: rgba(0,0,0,0.08);
  border-radius: 8px;
  padding: 0 6px;
  font-size: 10px;
  margin-left: 4px;
  line-height: 18px;
}
.dash-tab.active .dash-tab-count { background: rgba(255,255,255,0.2); }

.dash-content { display: none; }
.dash-content.active { display: block; }

.card {
  background: var(--card-bg);
  border-radius: 12px;
  padding: 18px 22px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(79,70,229,0.08); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
.card-title { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; line-height: 1.5; transition: color 0.15s; }
.card-title:hover { color: var(--accent); text-decoration: underline; }
.card-source { font-size: 12px; color: var(--text-light); margin-top: 3px; }
.card-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }
.card-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 10px; border-radius: 10px; font-weight: 500; }
.tag-ecommerce { background: #fef3c7; color: #92400e; }
.tag-retail { background: #e0f2fe; color: #075985; }
.tag-ai { background: #ede9fe; color: #5b21b6; }
.tag-business { background: #d1fae5; color: #065f46; }
.tag-data { background: #fce7f3; color: #9d174d; }
.card-link-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--accent); text-decoration: none; font-weight: 500;
  padding: 3px 10px; border-radius: 6px; border: 1px solid var(--accent);
  transition: all 0.15s; white-space: nowrap;
}
.card-link-btn:hover { background: var(--accent-light); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.35; }
.empty-text { font-size: 15px; }

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--text-secondary);
  flex-wrap: wrap;
  gap: 8px;
}
.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-light); color: var(--accent);
  padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.footer { text-align: center; padding: 24px; color: var(--text-light); font-size: 12px; border-top: 1px solid var(--border); }

/* ── KB search bar ── */
.kb-search { margin-bottom: 16px; position: relative; }
.kb-search-input {
  width: 100%; padding: 12px 16px 12px 42px;
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 14px; background: var(--card-bg); color: var(--text);
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.kb-search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.kb-search-input::placeholder { color: var(--text-light); }
.kb-search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text-light); pointer-events: none;
}
.kb-search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text-light);
  cursor: pointer; font-size: 18px; padding: 4px 8px; display: none; line-height: 1;
}
.kb-search-clear.visible { display: block; }
.kb-search-clear:hover { color: var(--text); }

/* ── Date group within KB ── */
.date-group { margin: 4px 0; }
.date-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; cursor: pointer; border-radius: 8px;
  transition: background 0.15s; font-size: 13px; user-select: none;
}
.date-group-header:hover { background: var(--bg); }
.date-group-arrow { font-size: 9px; color: var(--text-light); width: 12px; text-align: center; transition: transform 0.2s; }
.date-group-label { font-weight: 600; color: var(--text-secondary); }
.date-group-count { font-size: 11px; color: var(--text-light); margin-left: auto; }
.date-group-items { padding-left: 0; }
.date-group-items .kb-item:last-child { border-bottom: none; }

@media (max-width: 640px) {
  .header { padding: 20px 16px 0; }
  .header-top { flex-direction: column; align-items: flex-start; gap: 6px; }
  .header-date { text-align: left; }
  .mode-btn { padding: 8px 14px; font-size: 13px; }
  .main { padding: 16px 16px 32px; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
  .cat-grid { grid-template-columns: 1fr; }
  .date-nav { flex-wrap: wrap; }
  .card-header { flex-direction: column; }
  .card-footer { flex-direction: column; align-items: flex-start; }
  .dash-tabs { padding: 2px; }
  .dash-tab { padding: 6px 10px; font-size: 12px; }
}
/* ── Talk Daily mode ── */
.talk-section { margin-bottom: 24px; }
.talk-section-title { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.talk-headline-card {
  background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 100%);
  border: 1px solid #fcd34d;
  border-radius: 14px; padding: 20px 24px;
  margin-bottom: 14px;
}
.talk-headline-title { font-size: 18px; font-weight: 700; color: #92400e; margin-bottom: 4px; }
.talk-headline-source { font-size: 11px; color: #b45309; margin-bottom: 10px; }
.talk-headline-oneliner { font-size: 14px; color: #78350f; background: rgba(255,255,255,0.6); padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; line-height: 1.6; }
.talk-scene-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
.talk-scene-tab {
  padding: 6px 14px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,0.5); border: 1px solid #fde68a;
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
  color: #92400e; white-space: nowrap;
}
.talk-scene-tab:hover { background: rgba(255,255,255,0.8); }
.talk-scene-tab.active { background: #fff; border-color: #f59e0b; box-shadow: 0 1px 4px rgba(245,158,11,0.2); }
.talk-scene-content {
  font-size: 14px; color: var(--text); line-height: 1.7;
  background: rgba(255,255,255,0.6); padding: 12px 16px; border-radius: 8px;
  min-height: 40px;
}
.talk-scene-panel { display: none; }
.talk-scene-panel.active { display: block; }
.talk-bestfor { margin-top: 8px; font-size: 12px; color: #92400e; background: rgba(255,255,255,0.5); padding: 6px 12px; border-radius: 6px; display: inline-block; }
.talk-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.talk-table th { background: var(--bg); font-weight: 600; color: var(--text-secondary); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
.talk-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.talk-table tr:last-child td { border-bottom: none; }
.talk-table tr:hover td { background: var(--accent-light); }
.talk-objection-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; transition: all 0.2s; }
.talk-objection-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(79,70,229,0.08); }
.talk-obj-customer { font-size: 13px; font-weight: 600; color: #dc2626; margin-bottom: 6px; }
.talk-obj-customer::before { content: "😤 客户说："; font-weight: 700; }
.talk-obj-reply { font-size: 13px; color: var(--text); line-height: 1.7; margin-bottom: 6px; }
.talk-obj-reply::before { content: "💬 你可以回："; font-weight: 700; color: var(--accent); }
.talk-obj-source { font-size: 11px; color: var(--text-light); }
.talk-obj-source::before { content: "📎 依据："; }
.talk-radar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.talk-radar-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; transition: all 0.2s; }
.talk-radar-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.talk-radar-indicator { font-size: 11px; color: var(--text-light); margin-bottom: 2px; }
.talk-radar-value { font-size: 20px; font-weight: 700; color: var(--text); }
.talk-radar-direction { font-size: 11px; margin-left: 4px; }
.talk-radar-direction.up { color: #dc2626; }
.talk-radar-direction.down { color: #059669; }
.talk-radar-direction.flat { color: #f59e0b; }
.talk-radar-note { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.talk-radar-source { font-size: 10px; color: var(--text-light); margin-top: 4px; }
.talk-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.talk-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.35; }
.talk-empty-text { font-size: 15px; }
@media (max-width: 640px) {
  .talk-radar-grid { grid-template-columns: repeat(2, 1fr); }
  .talk-headline-card { padding: 14px 16px; }
  .talk-table { font-size: 12px; }
  .talk-table th,
  .talk-table td { padding: 8px 10px; }
}
/* ── Daily Report (深度日报) ── */
.dr-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
  padding: 12px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.dr-date-display { font-size: 18px; font-weight: 700; min-width: 150px; text-align: center; }
.dr-article {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px 36px;
  line-height: 1.8;
  color: var(--text);
  font-size: 15px;
}
.dr-article h1.dr-h1 { font-size: 26px; font-weight: 800; margin-bottom: 4px; color: var(--text); }
.dr-article .dr-meta { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
.dr-article hr.dr-hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.dr-article h2.dr-h2 { font-size: 20px; font-weight: 700; margin: 28px 0 12px; padding-bottom: 8px; border-bottom: 2px solid var(--accent-light); }
.dr-article h3.dr-h3 { font-size: 17px; font-weight: 700; margin: 20px 0 8px; color: var(--accent); }
.dr-article p.dr-p { margin-bottom: 14px; text-align: justify; }
.dr-article strong { color: var(--text); }
.dr-article blockquote.dr-blockquote {
  margin: 16px 0;
  padding: 14px 20px;
  background: var(--accent-light);
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
  font-style: italic;
  color: var(--text-secondary);
}
.dr-article blockquote.dr-blockquote p { margin-bottom: 0; }
.dr-article ul.dr-ul { margin: 12px 0; padding-left: 24px; }
.dr-article ul.dr-ul li { margin-bottom: 6px; list-style: disc; }
.dr-article ol.dr-ol { margin: 12px 0; padding-left: 24px; }
.dr-article ol.dr-ol li { margin-bottom: 6px; list-style: decimal; }
.dr-article .dr-framebox {
  background: #f0fdf4;
  border: 1px solid #86efac;
  border-radius: 10px;
  padding: 16px 20px;
  margin: 16px 0;
}
.dr-article .dr-framebox-title { font-size: 14px; font-weight: 700; color: #166534; margin-bottom: 8px; }
.dr-article .dr-table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 10px; border: 1px solid var(--border); }
.dr-article table.dr-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.dr-article table.dr-table th { background: var(--bg); font-weight: 600; color: var(--text-secondary); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
.dr-article table.dr-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
.dr-article table.dr-table tr:last-child td { border-bottom: none; }
.dr-article .dr-footnote { font-size: 12px; color: var(--text-light); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
@media (max-width: 640px) {
  .dr-article { padding: 20px 18px; font-size: 14px; }
  .dr-article h1.dr-h1 { font-size: 22px; }
  .dr-article h2.dr-h2 { font-size: 18px; }
}
/* ── Sales Mode (销售心法) ── */
.sales-section { margin-bottom: 28px; }
.sales-section-header { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid var(--accent-light); }
.sales-insight-card {
  background: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
  border: 1px solid #93c5fd;
  border-radius: 14px; padding: 20px 24px; margin-bottom: 16px;
}

<script>
/* ==========================================================

const ALL_DATA = {
    "2026-08-15": [
    {id:255,c:"ecommerce",t:"菜鸟旗下递四方上线TikTok Shop欧盟12国直邮：8-12天妥投、99%妥投率、运费至高六折——跨境物流开始卷‘确定性’",s:"电商派",d:"2026-08-15",desc:"菜鸟旗下跨境物流服务商递四方上线TikTok Shop欧盟12国直邮产品，主打8-12天稳定送达、99%妥投率，运费至高六折。此前TikTok Shop欧盟扩张最大的瓶颈就是履约体验——商家想卖，但物流时效和妥投率撑不起‘平台承诺’。直邮专线把‘送达确定性’做成可售卖的商品，意味着跨境卖家终于可以拿TikTok Shop欧盟当‘正规渠道’而非‘试水渠道’来经营。对做跨境或打算出海的商家：物流确定性已经成了新的选品维度——谁能把‘到货时间’变成卖点，谁就抢到了TikTok欧洲的红利窗口。",tags:["菜鸟","TikTok Shop","跨境物流","欧洲电商"],l:"https://www.pai.com.cn/"},
    {id:256,c:"ecommerce",t:"美团外卖上线‘商场店’‘商业街店’标签：平台把‘就餐场景’拆成新流量入口——场景标签化成为本地生活新玩法",s:"电商派/网易科技",d:"2026-08-15",desc:"美团外卖针对商场档口、公共就餐区等难以归入传统‘堂食/无堂食’的经营场景，上线‘商场店’‘商业街店’等新标签。过去外卖平台的分类只有‘有没有堂食’，但消费者的真实决策逻辑是‘我在哪、想吃什么、方便不方便’——商场店的出餐效率和街道店的步行可达是完全不同的需求。平台把场景拆细，本质是把‘位置流量’重新定价：同一个商家，挂上‘商场店’标签就可能进入新的流量池。对商家：别再只填‘堂食/外卖’两个选项，把场景标签研究透，等于在平台里多抢了几个免费的流量入口。",tags:["美团","本地生活","场景标签","外卖"],l:"https://www.pai.com.cn/"},
    {id:257,c:"ecommerce",t:"阿里最新财报：速卖通实现经营层面盈利——跨境电商从‘烧钱换规模’进入‘盈利验证期’",s:"电商派",d:"2026-08-15",desc:"阿里发布最新财报，得益于物流优化和成本效益提升，速卖通本季度已在经营层面实现盈利。速卖通是阿里海外电商的‘排头兵’，过去几年一直在用补贴换市场，如今首次走到盈利线——说明跨境电商的竞争逻辑变了：不再是谁补贴多谁赢，而是谁把物流履约成本磨到够低、谁才能真正活下来。对卖家：平台开始算利润账，意味着平台补贴会越来越少、对商家效率的要求会越来越高；同时‘平台盈利’本身就是信号——这个渠道跑通了，可以重仓跟进，但要按‘能赚钱的玩法’来做，不能再按‘薅补贴的玩法’。",tags:["阿里","速卖通","跨境电商","盈利拐点"],l:"https://www.pai.com.cn/"},
    {id:258,c:"ecommerce",t:"Temu被曝关仓、全托管要落幕了？跨境‘全托管模式’走到十字路口——低价引擎开始失效",s:"虎嗅",d:"2026-08-15",desc:"虎嗅报道Temu仓储调整引发行业对‘全托管模式’前景的重新审视——全托管（平台包揽定价、物流、售后，商家只供货）曾帮Temu横扫欧美，但补贴退坡、关税与合规成本上升后，这套‘极致低价+平台兜底’的打法开始失灵。全托管不是消失，而是从‘普惠低价’走向‘精选高效’：平台不再什么都收，而是挑真正有供应链优势的商家。对跨境卖家是重要信号：全托管的红利窗口在收窄，‘半托管’‘半托管+自运营’才是下一阶段的活法——把定价权和库存风险拿回自己手里，靠产品和效率而不是纯低价取胜。",tags:["Temu","全托管","跨境电商","模式转型"],l:"https://www.huxiu.com/"},
    {id:259,c:"retail",t:"瑞幸七夕联名‘翻车’引争议：焦虑的巨头陷入‘防御式卷联名’——联名泛滥透支品牌，营销进入性价比反思",s:"虎嗅",d:"2026-08-15",desc:"虎嗅报道瑞幸七夕联名引发争议，被指‘防御式卷联名’——眼看对手在联名，自己不做就掉队，于是硬上，结果话题没做起来、口碑还受损。联名已经从‘稀缺玩法’变成‘行业标配’，一天一个联名，消费者审美疲劳、品牌自己也被拖进军备竞赛。对实体和零售商家的启示：当所有人都在做同一件事，‘做这件事’本身就不再有红利。联名拼的不是数量而是‘匹配度’——你的品牌和对方的人群、心智有没有化学反应。与其追着别人卷联名，不如把日常产品体验做成‘自带话题’的形态，那才是别人抄不走的东西。",tags:["瑞幸","联名营销","品牌焦虑","消费品牌"],l:"https://www.huxiu.com/"},
    {id:260,c:"retail",t:"锅圈上半年营收39.47亿元、同比+21.8%：在家吃饭场景逆势增长——‘宅家餐饮供应链’跑出确定性",s:"红餐网",d:"2026-08-15",desc:"锅圈食汇发布2026上半年业绩：营收39.47亿元、同比增长21.8%。在餐饮大盘普遍承压、连锁餐饮纷纷收缩的背景下，锅圈靠‘在家吃火锅烧烤’的场景继续双位数增长。锅圈做的不是餐饮堂食，而是‘家庭餐饮的供应链’——把原本要去店里消费的场景，搬到家里，用性价比和便利性承接。它验证了一件事：消费没有消失，只是转移到了‘更划算、更省事’的替代方案里。对实体商家：当‘到店’流量变贵，把‘到家’和‘在家’场景做透，是另一条稳定增长的路；供应链能力才是这种模式真正的护城河。",tags:["锅圈","财报","家庭餐饮","供应链"],l:"https://www.canyin88.com/"},
    {id:261,c:"retail",t:"‘零食大王’旺旺卖不动了：净利暴跌38%、市值蒸发1300亿——老牌快消巨头的失速与自救",s:"创业邦/虎嗅",d:"2026-08-15",desc:"曾经的‘零食大王’旺旺陷入失速：净利润暴跌38%、市值蒸发1300亿元，正寻求自救。旺旺和欧派被并称为‘两个考砸的学霸’——都是各自赛道曾经的优等生，都面临新一代消费者不买账的问题。旺旺的问题不是产品突然变难吃，而是它的渠道、包装、营销语言都还是‘上一代’的，年轻人有了更好的替代。对做品牌和生意的启示：消费品的生命周期不是靠‘守成’维持的，而是靠持续重做——品牌要每隔几年问一次‘我的产品、渠道、人设，还是今天消费者要的那一个吗？’守得住老本，往往正是丢掉下一代的开始。",tags:["旺旺","快消","品牌老化","业绩下滑"],l:"https://www.cyzone.cn/"},
    {id:262,c:"ai",t:"特斯拉上线豆包大模型：AI上车再进一步——大模型厂商的‘整车订单’争夺战开打",s:"虎嗅/电商派",d:"2026-08-15",desc:"特斯拉正式接入豆包大模型，‘豆包征服马斯克、拿下特斯拉’成为行业热议话题。这是国产大模型首次进入特斯拉这样的全球头部车机生态，意味着AI大模型的竞争从‘拼榜单分数’进入‘拼真实落地场景’阶段——谁能在车机、手机、办公软件这些亿级用户场景里被用起来，谁才是真正的赢家。对软件和AI从业者的启示：模型再强，没有落地场景就是成本中心；拿下‘整车级’订单，既是对模型能力的背书，也是商业化最硬的一步。ToB销售可以把‘某某大厂接了哪家模型’当成谈资，帮客户理解‘选AI不是在选分数，是在选生态’。",tags:["特斯拉","豆包","大模型","AI落地"],l:"https://www.huxiu.com/"},
    {id:263,c:"ai",t:"Qwen3.8-27B正式开源：家用显卡也能跑——小参数开源模型让‘私有化AI’进入中小商家射程",s:"量子位",d:"2026-08-15",desc:"通义千问Qwen3.8-27B模型正式开源，消费级家用显卡即可运行。这是‘27B这个体量’第一次做到让普通硬件跑起来，直接拉低了企业私有化部署的门槛——以前大模型要么用云端API、要么买昂贵算力，现在一张好一点的显卡就能在本地跑一个不错的模型，数据还不出门。对商家和ToB销售的意义很大：中小企业‘数据不外传、又要用AI’的需求第一次有了低成本解法；对软件商，‘帮客户把开源模型部署进自己的环境’正在成为一个新的服务入口，尤其是对数据敏感、又不想被云厂商绑定的客户。",tags:["Qwen","开源模型","私有化","AI部署"],l:"https://www.qbitai.com/"},
    {id:264,c:"ai",t:"GLM-5.3发布：Coding能力接近Fable 5、连潜伏40年的bug都被揪出来——国产模型编程能力再上台阶",s:"量子位",d:"2026-08-15",desc:"智谱发布GLM-5.3，编程能力接近Fable 5，演示中连潜伏40年的bug都能被揪出来。同一天GLM-5.3和DeepSeek-V4-Pro正式版接入阿里千问AI平台——大模型厂商从‘各自为战’走向‘互相入驻’，平台化整合加速。对做软件和ToB生意的启示：模型能力在快速拉齐，头部与第二梯队的差距在缩小，客户选型的关注点会从‘谁的模型最强’转向‘谁更容易集成进我的系统、谁的服务更稳’。对销售而言，与其背参数，不如帮客户想清楚‘换到这个模型，我的业务里哪个环节能立刻变好’。",tags:["GLM","智谱","编程模型","模型竞争"],l:"https://www.qbitai.com/"},
    {id:265,c:"ai",t:"阿里Q2资本开支大增75%：AI冰火两重天——云业务盈利、Qwen大模型在‘烧钱’，巨头AI账本现分化",s:"网易科技",d:"2026-08-15",desc:"阿里单季资本性支出大增75%，AI业务呈现‘冰火两重天’：云业务在盈利、Qwen大模型还在烧钱。这正是AI时代巨头财报的典型切面——基础设施（云）已经能赚钱，模型研发（Qwen）还在投入期。这给ToB从业者的判断是：AI的钱分两层，一层是‘卖铲子的’（算力、云、部署服务），已经能见到回头钱；另一层是‘挖金子的’（模型本身、杀手级应用），还在等爆点。做销售时可以帮客户看清：你该先买的是哪一层？多数企业的第一笔AI预算，应该花在‘立刻能提效降本的铲子’上，而不是赌一个还没跑通的大模型。",tags:["阿里","财报","资本开支","云与模型"],l:"https://tech.163.com/"},
    {id:266,c:"ai",t:"华尔街实测8款全球主流Agent：千问办公综合排名第一——AI办公助手进入‘真刀真枪测评’阶段",s:"量子位",d:"2026-08-15",desc:"华尔街机构实测8款全球主流AI Agent产品，阿里千问办公综合排名第一，成本成为商业化关键因素。这份测评的看点不是‘谁第一’，而是‘AI办公助手开始被第三方用统一标准做实测’——说明Agent已经从‘演示惊艳’进入‘日常好用、成本划算’的比拼。对ToB销售和软件商的启示：客户买Agent看的不再是发布会，而是‘接进我的工作流里真能省多少时间、少犯多少错’。谁能把‘实测数据+成本账’摆到客户面前，谁就赢了这一单。这也是销售话术的升级方向：用第三方测评和客户自己的小范围试用说话。",tags:["Agent","千问办公","AI办公","测评"],l:"https://www.qbitai.com/"},
    {id:267,c:"business",t:"Anthropic或超越SpaceX，估值剑指2万亿美元：AI独角兽开启‘史上最大IPO’想象——资本对AI叙事重新定价",s:"创业邦",d:"2026-08-15",desc:"创业邦报道，Anthropic最快今年10月上市，估值或冲击2万亿美元，有望成为‘史上最大IPO’、超越SpaceX。2万亿美元是什么概念——比肩苹果、微软这个量级。资本市场愿意给AI独角兽如此定价，说明‘AI是下一代基础设施’已经从叙事变成真金白银的共识。对生意人的启示：估值泡沫与否先不论，方向是确定的——所有行业都会被AI重做一遍。你在哪个环节提前卡位（数据、场景、交付能力），资本市场的热钱就会流向哪里。对普通从业者更实际的信号：AI人才的溢价还在涨，现在入局/转型AI相关的技能，依然是性价比最高的投资。",tags:["Anthropic","IPO","AI估值","资本"],l:"https://www.cyzone.cn/"},
    {id:268,c:"business",t:"茶饮出海进入‘奥德赛时期’：新茶饮海外扩张从‘铺店’转向‘过关’——出海不是复制国内成功",s:"创业邦",d:"2026-08-15",desc:"创业邦将新茶饮出海形容为进入‘奥德赛时期’——海外扩张不再是一路高歌，而是‘关关难过’的多重挑战：供应链、本地口味、合规、人才、汇率，每一关都可能让品牌折戟。过去两年茶饮出海是‘只要敢开就能火’，现在进入‘开了店还要活得久’的阶段。对想出海的商家是最重要的一课：出海不是把国内的成功复制一遍，而是到陌生的战场重新解题。真正的护城河不是品牌知名度，而是供应链本地化能力和‘亏得起的前三年’。先想清楚‘我凭什么能在别人的主场活下来’，再考虑要不要出海。",tags:["茶饮","出海","奥德赛时期","供应链"],l:"https://www.cyzone.cn/"},
    {id:269,c:"data",t:"国家统计局：1-7月全国餐饮收入突破3.28万亿元——餐饮大盘仍在上行，结构性分化才是真相",s:"红餐网",d:"2026-08-15",desc:"国家统计局公布最新餐饮数据：1-7月全国餐饮收入突破3.28万亿元。大盘数据仍然增长，但行业普遍感受到‘生意难做’——矛盾的真相是结构性分化：大盘在涨，涨的是性价比餐饮、连锁化供应链、下沉市场；跌的是没特色的单店、高溢价的旧模式。对餐饮人的启示：别被大盘数据骗了，也别被‘行业寒冬’的叙事吓住。真正要看的是你所在的价格带和场景是处在‘结构性上升’还是‘结构性下降’。数据是用来看趋势的，不是用来安慰自己的——同样3.28万亿，有人吃到了红利，有人只看到了数字。",tags:["国家统计局","餐饮数据","行业大盘","结构分化"],l:"https://www.canyin88.com/"},
    {id:270,c:"data",t:"半导体现新一轮涨价潮：意法半导体、卓胜微等密集调价——芯片周期重启，传导效应将波及AI和消费电子",s:"网易科技",d:"2026-08-15",desc:"半导体行业出现新一轮涨价潮，意法半导体、卓胜微等厂商密集调价。叠加美光判断‘AI催生持续性存储需求、供需紧张或持续’，芯片正在进入新一轮上行周期。对下游的影响是连锁的：芯片涨价→终端成本上升→消费电子、AI服务器、智能硬件都可能提价或压缩利润。对做生意的启示：大宗周期品的价格信号要‘往前看一年’——今天芯片涨价，明年这时候你的设备、硬件类产品采购成本就会体现。做ToB销售的要趁早提醒客户：如果业务依赖硬件或芯片类物料，现在就是锁定成本、谈长期合同的时间窗口。",tags:["半导体","涨价潮","芯片周期","供应链"],l:"https://tech.163.com/"}

"2026-08-14": [
    {id:239,c:"ecommerce",t:"京东系2026年半年报全线报捷：Q2营收3464亿、Non-GAAP净利+20.3%，物流1247亿+26.5%、工业130.63亿+27.4%、健康409亿+15.9%",s:"电商派/京东财报",d:"2026-08-14",desc:"京东发布2026年Q2及上半年财报：Q2营收3464亿元、Non-GAAP净利润增长20.3%；京东物流上半年总收入1247亿元同比+26.5%；京东工业营收130.63亿元同比+27.4%、经营利润5.30亿元同比+38.1%；京东健康收入409亿元同比+15.9%。在整体消费温和复苏（7月社零预计增速约2%）背景下，京东系全线实现双位数增长——验证‘供应链+零售+医疗健康’组合的抗周期能力，也说明‘效率型零售’仍是最稳的生意底盘：不靠烧钱换增长，靠把每一单的成本磨薄。",tags:["京东","财报","供应链","零售"],l:"https://www.pai.com.cn/"},
    {id:240,c:"ecommerce",t:"阿里国际站上线‘AI员工’：售价一年2999美元，AI外贸从‘辅助工具’进入‘可雇佣员工’时代",s:"电商派/派财经",d:"2026-08-14",desc:"阿里国际站推出‘AI员工’产品，售价一年2999美元，把AI从‘工具’变成‘员工’——可独立完成询盘跟进、客户背调、报价等外贸核心环节。这是B2B跨境电商第一次把AI包装成‘可雇佣的劳动力’售卖，而非按功能收费。对中小外贸商家而言，‘雇一个AI员工’的年成本已低于一位人工业务员；AI外贸从‘辅助提效’走向‘独立扛活’，外贸销售岗位的价值结构正被重写——标准化跟单被AI替代，靠判断和信任吃饭的部分反而更值钱。",tags:["阿里国际站","AI员工","跨境电商","外贸"],l:"https://www.pai.com.cn/"},
    {id:241,c:"ecommerce",t:"淘宝闪购成餐饮外卖首个开放MCP能力的平台：AI Agent直连点餐履约，外卖进入‘Agent原生’时代",s:"红餐网/电商派",d:"2026-08-14",desc:"红餐网报道淘宝闪购成为餐饮外卖领域首个开放MCP（模型上下文协议）能力的平台，AI直连15大业务场景——AI Agent可直接帮用户完成点餐、下单、追踪履约。当平台把数据与能力开放给AI调用，‘外卖’不再只服务人、也开始服务Agent——餐饮外卖从‘人机交互’走向‘Agent原生’。对商家而言，商品数据结构化、价格实时准确、库存真实可查，将成为被AI Agent推荐的前提——数据质量再次成为商家的‘门面’。",tags:["淘宝闪购","MCP","AI Agent","外卖"],l:"https://www.canyin88.com/"},
    {id:242,c:"ecommerce",t:"天猫‘星探汇’启动：首期26个品牌入选，平台从‘抢流量’转向‘抢心智’",s:"电商派",d:"2026-08-14",desc:"天猫推出‘星探汇’项目，首期26个品牌入选，定位帮消费者‘发现新品牌/新品’。在平台流量见顶、商家经营从‘抢流量’转向‘抢心智’的背景下，天猫把资源投向‘新品发现’场景——用内容+数据帮新品牌被看见。对商家而言，‘被平台选入某个项目’正在成为比‘买流量’更稀缺的确定性资源；新品创新能力和内容表达能力，成为商家在平台体系内拿到增量资源的门票——平台也在从‘卖流量’转向‘做生态’。",tags:["天猫","星探汇","新品","平台生态"],l:"https://www.pai.com.cn/"},
    {id:243,c:"retail",t:"茶颜悦色多品牌战略受挫：子品牌‘小神闲’倒闭、鸳央咖啡调改——‘多子’不一定‘多福’",s:"红餐网",d:"2026-08-14",desc:"红餐网报道茶颜悦色旗下子品牌‘小神闲’倒闭、鸳央咖啡启动调改，此前被寄予厚望的多品牌矩阵集体收缩。茶颜一度在长沙密集测试小神闲茶馆、鸳央咖啡等业态，如今回到‘聚焦主品牌’——在奶茶内卷加剧、单店模型承压下，‘多子’并不一定‘多福’：每多一个品牌就多一条供应链、多一份管理成本。实体连锁进入‘少而精’时代：与其开一堆半死不活的子品牌，不如把主品牌做深做透——这正是‘万店信仰失灵’后的又一注脚。",tags:["茶颜悦色","多品牌","新茶饮","战略收缩"],l:"https://www.canyin88.com/"},
    {id:244,c:"retail",t:"喜茶‘茶特调’推出一周年：全球上新超30款、自研11款茶底——从卖奶茶到卖‘茶底创新’",s:"红餐网",d:"2026-08-14",desc:"红餐网报道喜茶‘茶特调’推出一周年：全球上新超30款、自研11款茶底，带动‘茶特调’成为行业新趋势。喜茶从‘果茶+奶盖’的经典组合，转向用不同茶底（乌龙/白茶/黄茶等）做差异化特调——竞争从‘加料堆料’走向‘上游茶底创新’。这给行业的启示：当消费者对同质化奶茶疲劳，‘供应链上游的差异化’成为品牌护城河——谁掌握茶底/原料的独家供应链，谁就能定义下一轮产品趋势，也把竞争从终端门店拉回到上游。",tags:["喜茶","茶特调","茶底","新茶饮趋势"],l:"https://www.canyin88.com/"},
    {id:245,c:"retail",t:"星巴克中国供应链改革提速：前山姆CMO张青操刀、回应‘取消14薪’传闻——外资巨头在华‘降本增效’样本",s:"红餐网/晚点",d:"2026-08-14",desc:"星巴克中国供应链改革提速：前山姆中国首席采购官、博裕资本运营合伙人张青将参与博裕与星巴克中国合资公司的业务运营；针对‘取消14薪’传闻，星巴克中国回应称正在优化成本结构。从山姆的‘供应商直采+精简SKU’打法到星巴克供应链改革，外资餐饮巨头在华集体从‘品牌溢价’转向‘成本效率’——价格战打到供应链端，‘把成本降下来’成为比‘把店开多’更优先的命题。对连锁品牌而言，供应链能力正在取代品牌声量，成为新一轮竞争的地基。",tags:["星巴克","供应链","降本增效","外资餐饮"],l:"https://www.canyin88.com/"},
    {id:246,c:"retail",t:"冰雪时光出海三年开拓16国、门店超4500家：新茶饮‘卷向海外’的产业链样本",s:"红餐网",d:"2026-08-14",desc:"红餐网报道冰雪时光出海三年进入16个国家、门店超4500家，自建大型智能产业园、掌握全产业链（自有供应链+国际食品认证+全球物流+商学院）。在蜜雪冰城加速海外、茶百道/沪上阿姨陆续出海的背景下，冰雪时光用‘供应链先行+整店输出’模式跑通低价茶饮出海——中国新茶饮的第二增长曲线，正在从‘国内下沉’转向‘全球复制’。但海外法规、食安认证与本地化运营，仍是所有出海品牌的生死关——供应链出海，比门店出海更难也更值钱。",tags:["冰雪时光","出海","新茶饮","供应链"],l:"https://www.canyin88.com/"},
    {id:247,c:"ai",t:"DeepSeek V4 Pro正式版上线+Harness发布+调价8/17生效：国产模型进入‘能力对标+商业兑现’双线作战",s:"量子位/网易科技/虎嗅",d:"2026-08-14",desc:"DeepSeek V4 Pro正式版上线，多项能力对标Fable 5、补齐Agent与图像能力；同期发布‘一切皆插件’的DeepSeek Harness开发者预览版（v0.1）；调价方案公布、8月17日生效（梁文锋与马斯克同日上新，DeepSeek暂未涨价）。从‘开源刷榜’到‘定价+平台+生态’，DeepSeek开始把技术势能转成商业闭环——大模型竞争进入‘能力对标+商业兑现’双线作战：谁先跑通‘便宜+好用+能落地’，谁才真正赢得开发者和企业客户。",tags:["DeepSeek","V4 Pro","Harness","大模型"],l:"https://www.qbitai.com/"},
    {id:248,c:"ai",t:"Grok 4.6发布：以更低价格反超Fable 5，马斯克‘收购Cursor+Workbuddy’的AI矩阵开始显形",s:"量子位/创业邦",d:"2026-08-14",desc:"xAI发布Grok 4.6，以更低价格反超Fable 5重回第一梯队，并推出马斯克版Workbuddy；此前被曝以600亿美元收购Cursor，协同效应开始显现。马斯克用‘模型+工具+收购’三线并进，把Grok从‘聊天模型’变成‘能干活的产品矩阵’——验证AI竞争已经从‘单模型性能’升级为‘模型×工具×生态’的综合战。对开发者和创业者而言，模型选型不再只看分数，还要看背后生态能不能落地——‘便宜+生态’正在成为比‘最强单点’更重要的选择标准。",tags:["xAI","Grok 4.6","Cursor","马斯克"],l:"https://www.qbitai.com/"},
    {id:249,c:"ai",t:"Ilya首个模型曝光：SSI方向瞄准‘持续学习’——AI从‘学完即止’走向‘终身学习’",s:"量子位",d:"2026-08-14",desc:"Ilya创办的SSI（Safe Superintelligence）首个模型曝光，方向瞄准‘持续学习’——让模型不再一次性训练完就固定，而是能持续吸收新数据、不断进化。作为OpenAI联合创始人，Ilya一直强调‘超级智能的安全与成长’，首个模型落点选在持续学习，指向下一波模型范式的核心命题：当模型能自己持续进化，‘数据飞轮’和‘安全护栏’将比参数规模更关键。这一方向若跑通，将重写大模型的迭代逻辑——也从‘堆参数’转向‘可持续进化’。",tags:["Ilya","SSI","持续学习","模型范式"],l:"https://www.qbitai.com/"},
    {id:250,c:"ai",t:"腾讯Q2资本开支527亿元同比+176%、营收2048亿：AI投入‘不设上限’，高盛却下调目标价",s:"网易科技/电商派",d:"2026-08-14",desc:"腾讯二季度营收2048亿元，资本开支达527亿元、同比猛增176%，马化腾谈‘构建全新的腾讯’；同期启动顶尖AI产品人才招聘专项、不限学历专业。一边是AI投入不设上限，一边是高盛将腾讯目标价下调至670港元（认为加大AI资本开支或对短期盈利构成压力）——‘AI投入’与‘短期利润’的矛盾在巨头财报上正面碰撞。结论：巨头正用‘牺牲当下利润’换‘AI时代的入场券’，资本开支的竞争比模型竞争更早分出胜负。",tags:["腾讯","资本开支","AI投入","财报"],l:"https://tech.163.com/"},
    {id:251,c:"business",t:"长鑫科技市值超越腾讯，成中国大陆市值最高上市公司：硬科技取代互联网登顶",s:"虎嗅/电商派",d:"2026-08-14",desc:"长鑫科技市值超越腾讯控股，成为中国大陆市值最高的上市公司——这是近年少有的‘硬科技’登顶时刻。从阿里腾讯京东等互联网平台，到中芯国际、长鑫科技等半导体/硬科技，市值王座的更替折射产业逻辑之变：资本重新定价‘卡脖子技术的自主可控’。对创业者和销售而言信号明确——下一个十年的大机会在硬科技和AI基础设施，商业模式要往‘有技术壁垒、有实物产出’的方向迁移，纯流量与概念叙事的估值红利在退潮。",tags:["长鑫科技","市值","硬科技","产业变迁"],l:"https://www.huxiu.com/"},
    {id:252,c:"business",t:"38岁前华为金牌销售创业做翻译耳机：卖遍170多个国家、年入超2亿——‘销售能力是最硬核创业资产’",s:"创业邦",d:"2026-08-14",desc:"创业邦报道一位38岁前华为金牌销售辞职创业做AI翻译耳机，产品卖遍全球170多个国家、年收入超2亿元。案例再次验证虎嗅那句‘销售能力才是核心能力’：他不靠技术壁垒起家，靠的是华为销售训练出的‘渠道拓展+客户洞察+打单能力’，把一款产品卖到全球。当产品同质化加剧，‘把东西卖出去’的能力正在成为创业者最稀缺的资产——对销售人群是最强的心智背书：你的能力，可以平移成一家公司。",tags:["创业","翻译耳机","销售能力","出海"],l:"https://www.cyzone.cn/"},
    {id:253,c:"data",t:"高德扫街榜2026年榜：35170家商家上榜，去年上榜烟火小店订单增长424%——‘街边小店’成平台必争之地",s:"电商派/红餐网",d:"2026-08-14",desc:"高德发布扫街榜2026年度榜单：共35170家商家上榜（状元榜+烟火小店榜+品质甄选），其中烟火小店榜5115家小店订单量同比增长424%。数据印证两条趋势：一是‘街边小店’的线上化增量远超大盘，本地生活平台把‘扫街’做成流量入口；二是小而美的烟火气生意，正在成为平台争夺的稀缺供给。对商家：‘被收录进榜单’本身就是免费的信任背书，而平台竞争正在从‘抢大商家’转向‘抢全部门店’。",tags:["高德","扫街榜","本地生活","小店经济"],l:"https://www.pai.com.cn/"},
    {id:254,c:"data",t:"中国移动上半年营收5380.4亿，预计全年智算新增超4.8万PFLOPS、将推全国统一Token套餐——算力进入‘水电煤’化",s:"网易科技",d:"2026-08-14",desc:"中国移动上半年营运收入5380.4亿元、移动客户约10.11亿，预计全年智算总规模新增超4.8万PFLOPS，并将推出全国统一的Token套餐资费。运营商把‘算力’和‘Token’做成像话费一样的标准化商品——算力正式‘水电煤’化。这意味着AI推理成本将随运营商规模效应持续下行，‘按Token付费’成为企业用AI的默认方式；对ToB软件商，‘帮你省Token/把Token用好’将成为新的服务入口。",tags:["中国移动","智算","Token套餐","算力基建"],l:"https://tech.163.com/"},

    {id:228,c:"retail",t:"三只松鼠入局鲜食赛道：从现制烘焙到短保卤味，零食巨头集体找餐饮第二曲线",s:"红餐网",d:"2026-08-09",desc:"又一零售巨头入局餐饮：三只松鼠跨界做鲜食，覆盖现制烘焙、短保卤味等短保品类，把零食供应链能力平移进‘现制+短保’餐饮场景。零食品牌集体找第二曲线（此前有来伊份做咖啡、良品铺子做零食折扣店），本质是袋装零食增长见顶后，向‘高毛利、高复购’的餐饮业态迁移——砍掉低效品类、加注高价值业态，正是‘万店信仰失灵’后的典型路径。",tags:["三只松鼠","鲜食","零食跨界"],l:"https://www.canyin88.com/"},
    {id:229,c:"retail",t:"美国顶流快餐排队进中国：一个汉堡卖70块，‘集体东进’能否成局",s:"创业邦",d:"2026-08-09",desc:"创业邦报道美国一批顶流快餐品牌排队进入中国市场，单个汉堡定价可达70元，主打‘品牌溢价+西式体验’。在中国汉堡市场2025年已达445亿、中式汉堡2030年或破1200亿的背景下，美系快餐‘集体东进’面临高定价与本土化双重考验——但它们的进场，意味着中国餐饮的‘价格带’和‘品质战’会被重新定义，本土快餐的舒适区正在被冲击。",tags:["快餐","汉堡","外资品牌入华"],l:"https://www.cyzone.cn/"},

    {id:233,c:"ai",t:"蚂蚁集团开源Avernet：多智能体协作基础设施，让‘人+智能体像组织一样协作’",s:"量子位",d:"2026-08-09",desc:"蚂蚁集团开源Avernet，定位多智能体协作基础设施，让‘人与智能体像组织一样高效协作’。在‘AI Agent+垂直行业’被验证为黄金窗口（35%正现金流、续费率超85%）的当下，大厂开始争夺‘多Agent协作’的底层标准——谁能定义Agent之间如何分工、交接、协作，谁就握住了下一代软件的基础设施。从单Agent工具到多Agent组织，AI商业化的竞争维度正在升级。",tags:["蚂蚁","Avernet","多智能体"],l:"https://www.qbitai.com/"},
    {id:234,c:"ai",t:"谷歌AI灵魂人物Jeff Dean离职创业，谷歌股价一天蒸发1.34万亿：AI人才战争白热化",s:"量子位",d:"2026-08-09",desc:"谷歌AI灵魂人物Jeff Dean官宣离职创业，创业BP曝光，硅谷VC抢破头送钱，谷歌股价应声蒸发1.34万亿。这是继Ilya、哈萨比斯传闻后，顶级AI人才‘大迁移’的又一标志性事件——人才即护城河，顶级研究员的去留直接写进市值。对国内同样如此：AI公司的人才争夺战，比模型参数更决定生死。当人才成为最稀缺的‘真本事’，砍规模、抢人才成为同一件事的两面。",tags:["Jeff Dean","谷歌","AI人才"],l:"https://www.qbitai.com/"},
    {id:235,c:"business",t:"段永平93条语录：做对的事情，走长期大道——收缩时代的本分哲学",s:"虎嗅/中信出版",d:"2026-08-09",desc:"段永平最新93条语录由中信出版整理发布，核心是‘做对的事情，然后把事情做对’：不赚不该赚的钱、不碰不懂的行业、用长期主义对抗短期诱惑。在‘万店信仰失灵、全行业收缩重算’的当下，这套‘本分’哲学被创业者重新翻出来——当增量红利消失，能不能‘做对的事情’成为企业与人唯一的护城河。砍掉规模幻觉、加注真本事，正是‘做对的事情’在经营层面的落地。",tags:["段永平","商业哲学","长期主义"],l:"https://www.huxiu.com/"},
    {id:236,c:"business",t:"‘万店信仰，正在失灵’：连锁从规模叙事转向单店算账，复购率成新指挥棒",s:"虎嗅/品牌棱镜",d:"2026-08-09",desc:"虎嗅刊文《万店信仰，正在失灵》：过去十年餐饮/零售把‘万店’当成终极目标，但2026年越来越多连锁品牌在主动收缩——关低效店、砍子品牌、押注单店盈利。瑞幸同店销售转负、烘焙一年关8万家、茶颜砍子品牌、盒马闭店……数据反复验证：当市场规模见顶，‘还能开多少家’让位于‘每家还能赚多少’，单店模型与复购率成为新指挥棒。对商家而言，从‘给平台看规模’转向‘给利润表看单店’，是2026年最重要的思维切换。",tags:["万店","连锁","单店模型"],l:"https://www.huxiu.com/"},
    {id:237,c:"data",t:"咖饮赛道数据：人均年饮28.6杯、规模冲刺1590亿，增量与内卷并存",s:"红餐网/咖门",d:"2026-08-09",desc:"咖饮赛道最新数据：人均年饮28.6杯、行业规模冲刺1590亿元。咖啡正从‘一线白领饮品’变成‘全民日常刚需’，但人均杯数仍远低于日韩欧美——增量空间与内卷并存：一边是瑞幸/库迪价格战持续、同店销售承压，一边是精品咖啡/茶咖特调向上找溢价。1590亿的盘子，正在被‘下沉+升级’两股力量同时撕扯：规模红利仍在，但只有单店模型健康的人能吃到。",tags:["咖啡","咖饮赛道","行业数据"],l:"https://www.canyin88.com/"},
    {id:238,c:"data",t:"中国精品咖啡十五年：Seesaw、Manner、M Stand为何结出不同果实",s:"红餐网",d:"2026-08-09",desc:"红餐网研究报告拆解中国精品咖啡十五年：Seesaw一度做‘第三空间+精品化’却收缩、Manner靠‘小店+高性价比’跑出千店、M Stand以‘一店一设计’的差异化突围——同样的精品咖啡赛道，三种模式结出三种果实。结论指向‘规模×单店模型×品牌溢价’的三角平衡：精品咖啡的终局不是谁开得多，而是谁的复购与利润模型更健康——正是‘万店信仰失灵’的微观注脚。",tags:["精品咖啡","Manner","Seesaw","行业研究"],l:"https://www.canyin88.com/"},

  "2026-08-07": [
    {id:207,c:"ecommerce",t:"抖音电商升级商家体验分规则：新增明日达加分项、虚假宣传一次性扣10分、商品/物流/服务三维加权重构",s:"电商报/亿邦动力",d:"2026-08-06",desc:"抖音电商8月6日升级商家体验分规范：物流指标把‘揽收时效未达成订单数’和‘揽收时长平均得分’统一为‘平均揽收时长’，退货指标改为‘商品/包装破损退货订单数/率’；新增加分项（明日达订单占比≥20%、开通退换货运费险、上门安装权益等），新增扣分项（虚假宣传、欺诈发货、混淆品牌信息、品牌资质缺失每项扣10分、刷单炒信扣10分）；取消单项分档，改为商品/物流/服务三大维度加权。平台从‘唯GMV’转向‘体验分指挥棒’——流量分配越来越向服务好、结算率高的商家倾斜。",tags:["抖音电商","体验分","商家规则"],l:"http://www.ec100.cn/detail--6662490.html"},
    {id:208,c:"ecommerce",t:"商务部等9部门意见：把抽检合格率、退货率纳入平台考核——直播电商退货率60%-80%，女装1亿GMV有效仅3000万",s:"商务部/搜狐科技",d:"2026-08-06",desc:"商务部等9部门7月印发《关于加快零售业创新发展的意见》，推动平台将入驻经营者抽检合格率、退货率纳入考核。直播电商退货率远高于货架电商（女装货架35%-40%、直播60%-80%）；一位亿级女装商家透露店铺退货率从2019年30%多涨至2026年73%，投流+佣金占GMV近50%，1亿成交有效GMV仅3000万；茵曼创始人估算一笔退货订单商家隐性成本约15元。‘退货率’正式成为平台考核的指挥棒——从源头倒逼平台整治货不对板，商家‘以货为锚’的经营时代到来。",tags:["退货率","政策","直播电商"],l:"https://news.qq.com/rain/a/20260715A07YV600"},
    {id:209,c:"ecommerce",t:"拼多多8月新增AI玩具类目五大品类招商，上半年商家投诉占比36.35%居首、徐福记遭有组织仅退款冲击关店",s:"物联网智库/网经社",d:"2026-08-06",desc:"拼多多2026年8月正式新增‘AI玩具’类目招商，覆盖AI情感陪伴玩偶、AI桌面机器人、AI机器宠物、AI教育玩具、AI潮玩手办五大品类——AI第一次成为货架上的标准商品。另一边，2026上半年拼多多以36.35%的商家投诉占比居各平台之首，‘任意仅退款’是核心矛盾；7月底徐福记旗舰店遭中小商家有组织‘仅退款’冲击被迫关店。平台一边开AI新类目抢增量，一边要为‘仅退款’旧账买单——商家生态治理进入深水区。",tags:["拼多多","AI玩具","仅退款"],l:"https://www.iotworld.com.cn/html/News/202608/8bfdf300e606f400.shtml"},
    {id:210,c:"ecommerce",t:"36氪：2026内容电商三大平台攻守与突围——从‘流量’到‘留量’，直播电商告别烧钱时代",s:"36氪/中经社",d:"2026-08-06",desc:"36氪梳理2026内容电商三大平台：抖音用‘全域投放+店播权重’重构分发、快手重拳整治‘剧本剧情引流+PK连麦卖货’（不设预警直接同罚）、淘宝天猫以AI工具和体验分稳住货架基本盘。行业共识：直播电商从‘烧钱换流量’转向‘留量为王’，商家把复购率、客单价和经营利润率放在比GMV更优先的位置；抖音广告成本大涨（千川CPM三年从80元涨到120元、涨幅50%），美妆品牌同预算ROI从1:3降到1:1.5。平台不再为爆炸式增长买单，商家的‘留量能力’成为唯一护城河。",tags:["内容电商","抖音","快手","流量成本"],l:"https://36kr.com/p/3903803401127811"},
    {id:211,c:"retail",t:"西贝故事下集：贾国龙押注‘天边’——天边羊多8月7日北京首店、天边砂锅焖面30家，切割预制菜标签",s:"大象财富/新食界",d:"2026-08-07",desc:"西贝在2026年1月一次性关停全国102家门店（约三成）、单月营收跌至往年一半后，创始人贾国龙押注独立新品牌自救：‘天边砂锅焖面’（人均40-50元）已铺开近30家；8月7日主打内蒙古鲜羊肉到店加工的‘天边羊多’在北京开出全国首店，人均45元。新品牌刻意弱化西贝标识、由原西贝门店改造，主打‘鲜羊直达’‘好肉不用腌’明档现做——既切割‘预制菜’标签，又复用西贝供应链。这是存量资产压力下的防御性重组：大店砍掉、小店快跑、用性价比业态换现金流。",tags:["西贝","餐饮","平价化","预制菜"],l:"https://www.hntv.tv/news/0/2085251501744795649"},
    {id:212,c:"retail",t:"胖东来宣布未来三年战略收缩：暂停所有对外帮扶，集中建设许昌梦之城；永辉调改店上半年净利2.5亿",s:"联商网/广发证券",d:"2026-08-06",desc:"8月5日胖东来创始人于东来披露未来三年规划：暂停所有对外帮扶及行业会议，集中资源建设许昌‘梦之城’、物流二期三期等项目，要求2029年前员工达到‘喜欢、专业、严谨、创造’状态，2030年后完成剩余超市项目、随后停止经营发展转型文化研究。同期永辉调改店上半年预告净利润2.5亿元，广发证券判断‘胖东来模式’行业正从‘投入期’走向‘业绩兑现期’。帮扶暂停不是模式失效，而是从‘向外输出’转向‘向内修炼’——信任与品质才是长期护城河。",tags:["胖东来","永辉","商超调改"],l:"https://www.163.com/dy/article/L3M8UGRH0539TJKS.html"},
    {id:213,c:"retail",t:"美团松鼠便利试水‘店仓一体’：门店破1000家、上海首家试点；即时零售进入仓网密度+算法效率阵地战",s:"快手新闻/钛媒体",d:"2026-08-06",desc:"8月5日美团旗下松鼠便利在上海启动首家‘店仓一体’试点——在原有线上前置仓基础上叠加线下营业功能，按便利店标准设计货架动线、保留‘仓’属性，基于线上5000余支SKU延伸小家电、家清等社区长尾需求。截至7月31日松鼠便利门店达1000家、覆盖百余城。即时零售日均单量：美团闪购1400-1570万、淘宝闪购1420-1500万、京东秒送150-175万单——竞争从补贴战转入‘仓网密度+算法效率’阵地战，商务部提出2026年建设1万个‘一刻钟便民生活圈’。",tags:["美团","即时零售","店仓一体"],l:"http://www.shuaishou.com/news/83753.html"},
    {id:214,c:"retail",t:"烘焙一年净减8.17万家、平均存活32个月；瑞幸每天净增30店但自营同店销售-5.3%——‘规模红利’集体见顶",s:"窄门餐眼/钛媒体/壹览商业",d:"2026-08-06",desc:"窄门餐眼数据：截至2026年7月，一年间全国面包烘焙门店净减少8.17万家（实际倒闭约8.5万），平均存活时间仅32个月、超57%门店撑不过两年，KUMO KUMO成都全关、85度C和面包新语全面撤出——传统面包店被商超、会员店、即时零售和社区工厂店‘围猎’。瑞幸Q2每天净增30家店、总数36310家、净收入+28.5%，但自营同店销售同比-5.3%（四个季度前还是+14.4%）——新店主要分流存量客源。连锁逻辑正从‘还能开多少家’转向‘每家还能赚多少’。",tags:["烘焙","瑞幸","关店潮","同店销售"],l:"https://cbgc.scol.com.cn/news/7822144"},
    {id:215,c:"ai",t:"DeepSeek重启二轮融资拟募500亿、投前估值5000亿；Kimi G轮投前估值500亿美元——国产大模型进入天量融资期",s:"东方财富/中国信息报",d:"2026-08-06",desc:"DeepSeek 8月5日被曝重启第二轮融资，计划募资500亿元、投前估值约5000亿元，预计8月下旬签约；加上首轮500亿，两轮累计募资超1000亿元。月之暗面Kimi完成F轮超35亿美元（投后350亿美元）后G轮（Pre-IPO）提前启动，投前估值升至500亿美元——8个月内从43亿飙到500亿，ARR突破3亿美元。国产大模型进入‘融资与技术双爆发期’：头部靠天量资本抢AGI入场券，开源+低价+生态成为三张通行证。",tags:["DeepSeek","Kimi","融资","大模型"],l:"https://fund.eastmoney.com/a/202608053832714892.html"},
    {id:216,c:"ai",t:"蚂蚁灵波启动首轮融资拟募15亿聚焦通用机器人大脑；AI代理基础设施Sapiom完成3500万美元A轮（Anthropic跟投）",s:"IT之家/ChainCatcher",d:"2026-08-06",desc:"蚂蚁集团旗下具身智能公司灵波科技启动首轮融资，拟募资15亿元，聚焦‘通用机器人大脑’，已发布LingBot系列模型2.0。AI代理基础设施平台Sapiom完成3500万美元A轮，Dragonfly领投、Anthropic等跟投，累计融资5000万美元；AI安全（Agent身份管理、权限控制、威胁检测）单周至少5家公司融资。具身智能+AI安全成为继大模型之后的新融资焦点——当Agent开始跑业务，谁能管住Agent、谁给Agent造身体，谁就在卡位下一张牌。",tags:["蚂蚁灵波","具身智能","AI安全","Sapiom"],l:"https://www.ithome.com/0/985/003.htm"},
    {id:217,c:"ai",t:"字节SeedRealtime原生音视频全双工大模型上线豆包；阿里Qwen3.8（2.4万亿参数）登Arena第二；腾讯混元Hy ASR 3.0发布",s:"AI智能体周报/黑马",d:"2026-08-06",desc:"字节SeedRealtime（原生音视频全双工大模型）8月5日在豆包App全量上线，支持‘边看、边听、边说’，语音交互从‘你一句我一句’升级为‘随时插话’；阿里Qwen3.8（总参数量2.4万亿）8月3日发布，当日登Arena榜单第二，Max/27B规格下周开源——阿里首次开源Max规格模型；腾讯混元Hy ASR 3.0 preview（8月4日）融合高精度语音识别与深度语义理解。大模型竞争从纯参数比拼转向‘实时多模态+开源+生态’综合较量，语音交互成为下一入口。",tags:["字节","阿里","腾讯","多模态","开源"],l:"https://www.iheima.com/article-400364.html"},
    {id:218,c:"ai",t:"2026 618首个‘AI原生’大促：综合电商仅+0.9%、38.79%消费者吐槽AI优先推高价——AI购物雷声大雨点小",s:"澎湃/每日经济新闻/上观新闻",d:"2026-08-06",desc:"2026年618被称为首个‘AI原生’电商大促，但综合电商平台销售额仅同比+0.9%（上年15.2%），AI并未点燃购物热情。调查显示：84.56%消费者尝试过AI选购功能、85%抱有期待，但38.79%反馈AI完全不贴合低价筛选、优先推送高价商品，29.71%反馈高低价混杂，仅16.06%认为AI能精准匹配；超90%认为AI有用、却只有约一半真正信任AI推荐，24%消费者表示永远不会把购物交给AI。AI推荐存在商业利益倾向（豆包对抖音电商/内容引用合计66.2%）。电商竞争正从‘流量竞争’转向‘决策权竞争’，但‘品牌熟悉度是跨越AI信任障碍的关键’。",tags:["AI购物","618","信任","决策权"],l:"https://m.thepaper.cn/detail/33462462"},
    {id:219,c:"business",t:"全国一人公司破1600万家、92.4%仍处初创，虎嗅：销售能力才是核心能力——95后一人指挥8个AI兵跑通跨境",s:"虎嗅/重庆日报",d:"2026-08-06",desc:"全国一人有限责任公司已突破1600万家、占企业总数27.4%，2025上半年新注册286万户、同比+47%；但92.4%仍处筹备或初创阶段、超三成未盈利，只有约20%真正跑通商业闭环。虎嗅结论：OPC创业者首先得是极其优秀的销售——搞定300人以上企业订单需面对采购、业务、财务、总经办多重关卡。案例：杭州95后张乾超在阿里国际站做棒球帽ToB跨境，3月开业即回本、全年GMV目标500万——8个AI智能体各司其职（市场/运营/产品/业务/设计/数据/背调），客户背调秒级完成、12分钟出3张效果图、一个月1800款设计，一年总成本不到30万，核心抓两件事：‘钱怎么收、客户怎么留’。",tags:["一人公司","AI智能体","跨境","ToB销售"],l:"https://www.huxiu.com/article/4871901.html"},
    {id:220,c:"business",t:"‘AI Agent+垂直行业’成2026下半年黄金窗口：35%玩家正现金流、客单价是通用SaaS的3-5倍、续费率超85%",s:"腾讯云/铁林想聊",d:"2026-08-06",desc:"通用Agent在B端举步维艰，‘AI Agent+垂直行业’成为2026下半年最现实的黄金窗口：35%垂直Agent玩家实现正向现金流，平均客单价是通用SaaS的3-5倍、客户续费率超85%。三重护城河：数据护城河（私有行业数据）、流程护城河（深度嵌入客户业务系统）、认知护城河（行业隐性知识）。四步盈利路线图：痛点验证（2-4周先卖‘空气’签意向书）→MVP交付（人工兜底）→规模化复制（从项目制到产品化）→生态卡位。AI无法替代三类岗位：强依赖人类感受、高度依赖隐性知识、以人类信任为核心——‘B2B几百万项目的销售对接，客户更信任人类’。",tags:["垂直Agent","AI应用","创业","信任"],l:"https://cloud.tencent.com.cn/developer/article/2697499"},
    {id:221,c:"data",t:"尼尔森IQ《商业革命》：2025中国直播电商约9000亿美元接近美国电商总规模，2030社交电商或达1.8万亿美元",s:"尼尔森IQ/新华社经济参考",d:"2026-08-06",desc:"尼尔森IQ 8月3日发布《商业革命：东西方交汇》：2025年中国直播电商市场规模约9000亿美元，已接近美国电商整体市场规模；亚太地区贡献全球约55%的电商收入；近六成（59%）亚太消费者已通过社交平台完成购物；预计2030年中国社交电商市场规模达1.8万亿美元。报告指出源于中国的商业模式（直播电商、社交电商、即时零售）正深刻影响全球消费者发现、购买商品及与品牌互动的方式，商业模式已演变为内容、社区、媒体、支付与履约的无缝融合生态。",tags:["尼尔森IQ","直播电商","社交电商","报告"],l:"https://nielseniq.com/global/en/news-center/2026/chinas-commerce-innovation-is-reshaping-global-retail/"},
    {id:222,c:"data",t:"QuestMobile：抖音商城+184%、618成首个‘AI原生’大促、即时零售渗透率24.8%；上半年食材消费4.68万亿、吃类线上+16.8%",s:"QuestMobile/食品伙伴网",d:"2026-08-06",desc:"QuestMobile《2026上半年中国移动互联网典型行业洞察》：综合电商淘宝/京东/天猫小幅增长，抖音商城同比增长184%；618成为首个‘AI原生式’电商大促；即时零售整体渗透率达24.8%，从一二线‘流量红利期’迈向‘增量拓展期’；闲鱼领跑闲置交易；6月AI原生App整体规模4.99亿、同比+85.4%。另据报告：2026上半年农产品与食材消费市场规模达4.68万亿元、同比+2.02%（餐饮端+2.82%高于零售端1.76%），网上吃类商品零售额增速高达16.8%居线上各品类第一；健康功能食品2021-2025年复合增速8.1%，2026年零售额预计突破4833亿元。",tags:["QuestMobile","即时零售","食材消费","AI应用"],l:"https://36kr.com/p/3924891953780617"}

  "2026-08-06": [
    {id:191,c:"ecommerce",t:"抖音电商2026上半年GMV增速近20%继续放缓：全域投放三池合一、店播权重升至75%达播退潮、字节主动下调电商目标",s:"36氪/华泰证券/雪球纪要",d:"2026-08-05",desc:"36氪独家：抖音电商2026上半年GMV增速接近20%（2022年220%→2024年46%→2025年近30%→今年不足20%），618同比增长约19%低于内部预期24%-25%；华泰研报显示字节主动下调电商目标，上半年支付GMV约2.4万亿、Q2增速降至12%、7月滑入个位数，大促后补贴率从3.5%-4%下调至3%。机制层面巨量千川并入电商后推行'全域投放'，M1内容/M2交易/M3广告三池合一、以结算GMV为锚点；618店播算法权重占75%、达人直播GMV占比压至25%左右。平台从'抢增速'转向'控利润、保健康'，商家投流逻辑也从'买流量'转向'做内容+精细运营'。",tags:["抖音电商", "GMV", "全域投放", "店播"],l:"https://news.qq.com/rain/a/20260805A09FMH00"},
    {id:192,c:"ecommerce",t:"天猫'超级88年中盛典&七夕礼遇季'连档16天：商家'1000单赚80块'利润表撑不住、运费险4.5元比快递贵，监管允许拒绑",s:"搜狐科技/市场监管总局",d:"2026-08-05",desc:"天猫8月大促'超级88年中盛典&七夕礼遇季'售卖期8月4日-19日，两个S级营销节点无缝衔接累计16天。商家陷入'不参加没流量、参加没利润'两难：招商规则明确消费者被减免部分由卖家承担让利，叠加'平行优惠'逐层叠加实际让利更多；有商家爆料'618大促做1000单赚80块，平时不降价做10单也赚80块'。三项成本随战线拉长加重：人力（16天驻场）、资金（备货半月）、履约（运费险一单3-4.5元高于快递单价但须先行开通）。监管层6月已发618合规提示，明确不得将比价/跟价/运费险与促销绑定——商家对'一单4.5元比快递还贵的运费险'第一次有了政策依据说'不'。",tags:["天猫", "大促", "商家利润", "运费险"],l:"https://www.sohu.com/a/1059189311_134311"},
    {id:193,c:"ecommerce",t:"京东成为中国第五个'10亿用户'互联网平台：首批接入微信AI、小时达覆盖超3000县域订单同比+156%",s:"新浪科技/电商报",d:"2026-08-05",desc:"京东用户规模突破10亿，成为继微信、淘宝、支付宝、抖音之后中国第五个'10亿用户'平台。战略动作：首批接入微信AI体系，覆盖电商、外卖、物流全场景；成立'变色龙业务部'整合AI资源，第二批自研AI玩具即将上线；京东云推出'龙虾天团'投入具身智能；刘强东宣布将送70万蓝领学习机器人维修保养（'涅槃计划'）。履约端京东小时达宣布覆盖超3000县域、县域订单同比增长156%。流量红利见顶后，巨头用'AI+履约+下沉'三条腿续增长——10亿用户不是终点，把用户'喂饱喂好'才是。",tags:["京东", "10亿用户", "AI", "县域"],l:"https://news.qq.com/rain/a/20260805A09FMH00"},
    {id:194,c:"ecommerce",t:"电商法修正草案意见征集8月4日收官：私域带货首次纳入监管框架、'反内卷式竞争'平台联盟在广州成立",s:"网经社/电商法草案",d:"2026-08-04",desc:"电商法修正草案征求意见8月4日收官，最受关注的变化：私域带货（社群团购、朋友圈带货、小程序分销）首次被纳入监管框架，从'灰色地带'变为'有法可依'。此前已施行的《网络交易平台规则监督管理办法》明确禁止强制商家承担退款不退货责任；上半年北京市场监管局等多次约谈淘宝/京东/拼多多/抖音/小红书整治'内卷式'竞争；国内首个'反内卷式竞争'平台联盟在广州成立、11家平台签约。监管主线清晰：给私域带货立规矩、给平台内卷踩刹车、给商家减负——电商进入'边发展边规范'的下半场。",tags:["电商法", "私域带货", "监管", "反内卷"],l:"http://www.100ec.cn/detail--6662413.html"},
    {id:195,c:"retail",t:"呷哺呷哺中期预告：营收15亿同比下滑23%、亏损收窄51%-64%但靠'关停止血'；湊湊门店两年缩至147家+杭州食安危机",s:"澎湃新闻/凤凰周刊/证券之星",d:"2026-08-05",desc:"呷哺呷哺8月3日发布2026中期业绩预告：营收约15亿元同比下滑23%，净亏损2900万-3900万元（同比收窄51%-64%）。减亏主要来自关停止血、供应链降本和费用压缩——2025年全年关闭56家呷哺+53家湊湊，净减少52家；2026上半年对关闭及长期亏损门店计提减值同比下降约30%。但'战略收缩'的代价显现：中高端品牌湊湊门店从2024年197家降至147家、五年半累亏超15.7亿，且杭州门店餐具生虫被市场监管部门立案调查陷入食安危机；董事长薪酬腰斩。增收端新业态'呷哺牧场'（自选小火锅）已开10家、'呷牛排'全国首店2月开业计划三年拓至100家。'关店止血+新业态试水'能否走出颓势，市场仍在观察。",tags:["呷哺呷哺", "湊湊", "餐饮", "战略收缩"],l:"http://www.phoenixweekly.com.cn/detil.php?id=27641"},
    {id:196,c:"retail",t:"连锁品牌进入'收缩调整期'：一周关闭25家门店，鼎泰丰中国仅剩14家、优衣库大陆净减18家'拆旧建新'",s:"壹览商业/观点网",d:"2026-08-05",desc:"壹览商业数据：2026年7月27日-8月2日当周国内13个连锁品牌关闭至少25家门店（餐饮关15家居首、服饰关5家），区域集中在杭州和绍兴。标志性案例：鼎泰丰上海港汇店8月3日因租约到期停业，中国门店仅剩14家（但同步在北京嘉里中心、上海徐家汇中心开新店，拟10月开杭州嘉里中心店）；优衣库上周关闭济南首店、德州时代广场店、上海莲花广场店3家运营超10年门店，大陆门店874家较年初892家净减18家，策略为'拆旧建新'——关低效老店、在核心商圈开大型旗舰店；热风关闭深圳店、宝格丽贵阳店运营3年即关。连锁从'拼门店数量'转向'拼区域密度、消费频次和单位面积产出'，关店成为维持网络质量的常规操作。",tags:["优衣库", "鼎泰丰", "关店", "连锁调整"],l:"https://www.yilantop.com/article/26934"},
    {id:197,c:"retail",t:"袁记食品（袁记云饺）冲刺港股'饺子云吞第一股'：全球4773家店、GMV66亿、估值35亿，黑蚁+益海嘉里产业资本押注",s:"21世纪经济报道/36氪/东方财富",d:"2026-08-05",desc:"袁记云饺母公司袁记食品7月30日向港交所递交更新后招股书，冲刺'饺子云吞第一股'。数据：截至2026年5月全球门店4773家（加盟4754家、直营仅19家），按门店数计为中国最大中式快餐企业；2025年营收27.95亿（+9.1%）、经调整净利2.62亿（+45.6%）；2026前5月营收13.05亿（+39.8%）、经调整净利1.85亿（+164%）、GMV 29.49亿。已完成三轮融资合计约4.6亿：A轮黑蚁资本3000万、B轮1.5亿、B+轮2.8亿（益海嘉里、建发新兴投资等产业资本），投后估值约35亿。隐忧：收入超九成依赖向加盟商卖原材料、加盟店占99.5%带来食安管控风险、拓店速度放缓（新开加盟店从2023年1226家降至2025年771家）。",tags:["袁记云饺", "IPO", "餐饮上市", "加盟"],l:"https://www.36kr.com/p/3924563280460165"},
    {id:198,c:"retail",t:"巴奴三闯港交所失败后转战香港开店、袁记云饺老乡鸡等消费IPO'集体退潮'：港交所收紧盈利审核，60+内地餐企闯港1年关闭率超40%",s:"21世纪经济报道/中国城市网",d:"2026-08-05",desc:"巴奴毛肚火锅第三次递交的港股招股书8月前后因六个月有效期届满自动失效，背负3.26亿对赌赎回负债（约定2029年底前完成上市否则按8%年利率回购）。但招股书失效第三天即与香港铜锣湾希慎广场签约开首店（预计11月中旬），系2001年创立以来首次走出内地，意在向资本市场证明国际化经营能力。背景：2025-2026年间袁记云饺、巴奴、COMMUNE、比格披萨、老乡鸡、钱大妈等消费企业港股招股书全部在六个月窗口期后自动失效（老乡鸡已是第五次）；港交所对消费企业盈利可持续性审核全面收紧，不再接受'用亏损换规模'叙事。已有超60个内地餐饮品牌进驻香港、门店超380家，但1年关闭率超40%、3年存活率不足20%——资本大门收窄，'去香港开店'也成了另一种求生。",tags:["巴奴", "餐饮IPO", "港交所", "消费上市"],l:"https://m.21jingji.com/article/20260805/herald/0d8349a79ecaa6484f67381fc6574149.html"},
    {id:199,c:"ai",t:"DeepSeek重启第二轮融资：拟募500亿元、投前估值约5000亿元，8月下旬完成签约；两轮累计募资或超1000亿",s:"东方财富/南方都市报",d:"2026-08-05",desc:"8月5日被爆出DeepSeek已重启第二轮融资：计划募资500亿元、投前估值约5000亿元，预计8月下旬完成签约。加上此前首轮500亿元融资（投后估值超3500亿），两轮累计募资将超1000亿元。与此同时Kimi月之暗面完成F轮超35亿美元（投后350亿美元）后G轮（Pre-IPO）提前启动、投前估值升至500亿美元，8个月内估值从43亿飙至500亿美元、市销率高达167倍。国产大模型进入'融资与技术双爆发期'：头部公司用天量资本换算力、换生态位，行业'军备竞赛'白热化——对小商家而言，模型能力会越来越便宜（DeepSeek-V4-Flash单次任务0.03美元），但'用AI把生意跑通'的能力差距会越来越大。",tags:["DeepSeek", "融资", "大模型", "估值"],l:"https://fund.eastmoney.com/a/202608053832714892.html"},
    {id:200,c:"ai",t:"MiniMax H3开源24小时超100家伙伴接入：摩尔线程国产GPU完成适配，打通'国产大模型+国产芯片'全链路",s:"阿斯达克/中国金融信息网",d:"2026-08-04",desc:"MiniMax第三代视频模型H3（最高15秒2K输出、0.8元/秒约为同类旗舰三分之一）8月3日首次开源视频模型权重，24小时内超100家国内外合作伙伴完成Day 0适配接入，覆盖芯片、开发者社区、云推理平台。摩尔线程基于国产GPU MTT S5000完成H3模型适配，打通'国产大模型+国产芯片'链路。此前MiniMax已登陆港交所（00100.HK）股价曾升逾8%。开源成为国产大模型的主流策略（Kimi K3开源全球最大模型、阿里Qwen3.8下周开源Max规格），护城河从'模型权重'转向'推理基础设施+Agent框架+行业方案'——模型越来越开放，谁离业务更近谁赚钱。",tags:["MiniMax", "H3开源", "国产GPU", "视频生成"],l:"http://wdatahk.aastocks.com/"},
    {id:201,c:"ai",t:"蚂蚁灵波（具身智能）启动首轮外部融资拟募15亿元：发力'通用机器人大脑'，年底前完成二轮融资",s:"澎湃新闻/艾媒网",d:"2026-08-04",desc:"蚂蚁集团旗下具身智能公司'灵波'启动首轮外部融资，拟募资15亿元，目标年底前完成二轮融资，重点发力'通用机器人大脑'项目。同周具身智能赛道密集吸金：德塔智能、中科原动力、昆腾动力等均获大额融资；北京8月发布全国首部省级智能体专项政策支持OPC（一人公司）与Token经济。行业信号：具身智能与AI安全成为融资新焦点（ThreatLocker F轮1.9亿美元、Act Security等至少5家AI安全公司获投）。从'对话大模型'到'能走能动的机器人'，AI竞争的物理化进程明显加速——巨头不再满足于'替人思考'，开始'替人干活'。",tags:["蚂蚁灵波", "具身智能", "融资", "机器人"],l:"https://www.thepaper.cn/newsdetail_forward_33711638"},
    {id:202,c:"ai",t:"有赞白鸦：AI来了SaaS公司的销售反而多了数百人——前端销售加码、后端标准化被AI替换；未来收入结构将变30%SaaS+30%增值+40%AI",s:"钛媒体/每日经济新闻",d:"2026-08-05",desc:"有赞2025年一边用AI部分替换客服和SDR团队，一边销售人员不减反增、多了数百人（与Salesforce裁4000客服但新招上千销售同趋势）——AI替代的是后端标准化服务，前端直面客户的销售反而在加码。白鸦给企业服务算账：向传统企业卖单价超1万元产品必须线下见面、2万以上需见两次、5万以上需见三次，没有规模化地面团队AI产品无法落地；'中国没销售就是不行，一点也不性感，但这就是事实'。组织变革：员工从1300多人回升至1800+，新增人力几乎全部投向AI升级和地面销售；薪酬结构从'专业80%+岗位20%'的二八开转向五五开，鼓励一人借AI横跨多领域。未来3-4年收入结构目标：30% SaaS + 30%增值服务 + 40% AI相关收入（Token消耗/算力/数字员工）。",tags:["有赞", "白鸦", "SaaS销售", "AI收入"],l:"https://www.tmtpost.com/8002264.html"},
    {id:203,c:"business",t:"'普通人赚钱6条核心规律'：销售是最底层能力、人脉本质是你能帮到谁、所有权决定阶层差距；成交以后销售才真正开始",s:"Gate广场/网易财经",d:"2026-08-05",desc:"2026年8月流传度最高的商业总结——'普通人赚钱6条核心规律'：①销售是最底层能力，技术再牛、产品再好卖不出去等于零，财富自由既会销售也会造产品；②人脉的本质是'你能帮到谁'，靠饭局换不来真关系；③执行力最珍贵，大多数人卡在信息收集，赚钱的人不是想得更多而是做得更快；④机会藏在没人愿看的地方，又脏又累的行业竞争者少反而有利润；⑤先保护现金流，第一桶金换的是选择权不是面子；⑥所有权决定阶层差距，工资来自劳动，品牌/系统/渠道/版权等所有权才能持续复利。另一篇《成交以后，销售才真正开始》：老客户终身价值远高于首单，成交不是结束而是关系开始，'让自己比产品更重要'。",tags:["商业思维", "赚钱规律", "销售", "人脉"],l:"https://apim.gateapi.io/zh/post/status/23204140"},
    {id:204,c:"business",t:"'真正赚钱的生意藏在人间烟火里'：乐尔乐批零一体520亿、长沙夜市'40+6+1+X'品类模型、佳和超市会员复购率90%——从卖货思维到供应链/场景/关系思维",s:"黄碧云/网易财经",d:"2026-08-05",desc:"一线商业调研者黄碧云提出：打破'低价即王道、流量即一切'的迷信，回到'货、场、人'三维重构。货的重构：乐尔乐靠批零一体、现金结款、极简管理把进价压低8%-22%，2024年销售额达520亿；场的重构：长沙夜市用'40+6+1+X'品类模型接住年轻人晚10点后的生活；人的重构：佳和超市把买卖关系变成邻里关系、会员复购率90%，古茗'做好邻居'。三条启示：从'卖货思维'到'供应链思维'、从'流量思维'到'场景思维'、从'交易思维'到'关系思维'——当流量红利退潮，真正能穿越周期的生意，都长在'高频复购+关系信任'的人间烟火里。",tags:["商业洞察", "乐尔乐", "复购", "烟火气生意"],l:"https://www.163.com/dy/article/L2DA8AKB05118PFV.html"},
    {id:205,c:"data",t:"即时零售破万亿：618渠道销售额628亿同比+112.3%成唯一高增长变量；美团份额67%、收购叮咚后Q1净利+19.6倍、前置仓大战重启",s:"CBNData/瑞银/八方",d:"2026-08-05",desc:"2026年即时零售市场规模已突破1万亿元，618期间即时零售渠道销售额达628亿元、同比暴涨112.3%，成为传统电商中唯一高增长变量。格局：按GMV计美团即时零售份额约67%、阿里系（蜂鸟+淘宝闪购）约23%、京东到家约10%；按日均单量口径三者51%/42%/7%，阿里单量维度快速追赶。美团2月收购叮咚买菜后其Q1净利润同比增19.6倍、下半年计划新开仓100个；小象超市前置仓超2000个、近六成盈利，2026年计划新开约800个仓；推出硬折扣品牌'快乐猴'与盒马'超盒算NB'短兵相接。行业从粗放补贴转向UE（单位经济模型）考核，华泰测算单仓日均1500单、客单价75元才能达0.4%经营利润率——'谁送得快'让位于'谁送得准、送得省'。",tags:["即时零售", "前置仓", "美团", "618"],l:"https://www.cbndata.com/information/295336"},
    {id:206,c:"data",t:"欧盟'黑色七月'：速卖通被罚5.5亿欧元+Temu被罚2亿+SHEIN法国累计超2.1亿，两月罚单近10亿欧元；海外仓成中国跨境电商'生死线'",s:"搜狐财经/财经杂志",d:"2026-08-05",desc:"欧盟监管7月密集落地，被业内称为'黑色七月'：速卖通7月20日被依据《数字服务法》（DSA）罚款5.5亿欧元为生效以来最高罚单（已上诉）；Temu被罚2亿欧元、8月1日又被指控阻碍调查或面临年营业额1%追加罚款；SHEIN此前在法国累计被罚超2.1亿欧元——三大平台两个月罚单合计近10亿欧元。叠加7月1日起欧盟取消150欧元以下小额包裹免税（每件按HS税号收3欧元关税、11月或再加2欧元清关处理费），低客单直邮模式利润模型失效（Temu法国订单客单15欧元、利润率从12%压至5%）。海外仓成生死线：Temu关停广东多地集货仓、Q3欧洲本土仓发货占比目标80%；欧洲三国仓储空置率降至约3%、租金同比涨超35%——全球免税红利系统性消退，'低价铺货、小包直邮'时代正式终结。",tags:["欧盟", "跨境电商", "罚款", "海外仓"],l:"https://www.sohu.com/a/1058653739_122966639"}

  "2026-08-05": [
    {id:175,c:"ecommerce",t:"拼多多年内接连被罚被约谈：4月被罚没15.22亿元创电商平台食品安全罚单纪录、6月被约谈通报“百亿补贴”规则不透明；海外业务遭马来西亚议员提议下架",s:"经济观察报/北京市监局",d:"2026-08-05",desc:"拼多多2026年接连遭遇监管重拳：4月被市场监管总局罚没15.22亿元（电商平台食品安全领域最高罚单），并暂停新增蛋糕店铺9个月；6月被北京市监局约谈，通报“百亿补贴”规则不透明、单方面免除平台责任等问题。海外业务同样承压：马来西亚议员提议临时下架拼多多，因其低价策略（每日约150个货柜）冲击本土中小企业，在反跨境倾销法规落地前或暂停运营。叠加此前携程51.79亿罚单、拼多多主动终结“无脑仅退款”——平台“流量霸权+低价内卷”模式正被系统性清算，商家与消费者双向回归理性。",tags:["拼多多", "平台监管", "罚单", "跨境电商"],l:"http://www.eeo.com.cn/2026/0805/986335.shtml"},
    {id:176,c:"ecommerce",t:"最高法发布5起平台经营典型案例：直播带货方责任明确、“假一罚四”承诺有效、刷单炒信无效",s:"光明网/最高人民法院",d:"2026-08-03",desc:"8月3日最高法发布5起依法规范平台经营、保护消费者合法权益典型案例。关键裁判规则：直播带货方是商品质量与违约赔偿第一责任人，作出售后兜底、“假一罚四”承诺的需承担连带责任；主播对同类商品评价负有高于普通公众的审慎注意义务，“临场发挥”不构成免责事由；电商平台对商户保证金负必要监管义务，未采取必要措施的承担连带清偿责任；平台禁止刷单炒信的规则合法有效。叠加《直播电商监督管理办法》2月施行——直播电商从“先发展后规范”进入“边发展边规范”，达人带货合规成本全面上升。",tags:["最高法", "平台监管", "直播电商", "消费者权益"],l:"https://legal.gmw.cn/2026-08/03/content_38924599.htm"},
    {id:177,c:"ecommerce",t:"直播电商“留量为王”：47.68%商家称流量成本太高、45.03%“有规模无利润”，抖音推九大商家扶持政策",s:"中经社/新浪财经",d:"2026-08-04",desc:"电商竞争正从“流量”转向“留量”。调查显示47.68%商家表示流量成本太高、44.37%陷入“不烧钱没流量”困境、45.03%面临“有规模无利润”。平台动作：抖音推出九大商家扶持政策（运费险三次降价、上半年为商家节省超65亿元），上线自营旗舰店；快手严打“剧本剧情引流+PK连麦卖货”。行业共识：流量红利结束，深耕会员运营、强化复购率和用户生命周期价值成为核心KPI——从“抢新客”到“留老客”，复购能力成商家新生死线。",tags:["直播电商", "流量成本", "留量", "抖音"],l:"https://finance.sina.com.cn/roll/2026-08-04/doc-inimcxxc4086456.shtml"},
    {id:178,c:"ecommerce",t:"QuestMobile上半年报告：抖音商城同比增长184%、618成“AI原生式电商大促”，即时零售加速“即时满足”",s:"QuestMobile/天极网",d:"2026-08-04",desc:"QuestMobile《2026年上半年中国移动互联网典型行业报告》：淘宝、京东、天猫保持小幅增长，抖音商城同比增长达184%；2026年618为“AI原生式电商大促”，AI从营销噱头升级为电商运营底层基础设施，促销从“价格内卷”转向“理性竞争”；即时零售崛起推动消费模式从“计划型囤货”转向“即时性满足”，即时零售平台加速下沉。AI+即时履约双轮驱动下，电商平台竞争重心从“谁更便宜”转向“谁更快、谁更懂你”。",tags:["QuestMobile", "抖音商城", "AI电商", "即时零售"],l:"https://news.yesky.com/hotnews/178/365178.shtml"},
    {id:179,c:"retail",t:"盒马“一收一放”双线战略：北京集中闭店3家+全国前置仓超500个，同时回归福建、硬折扣“超盒算NB”下沉",s:"新食界/深圳新闻网",d:"2026-08-04",desc:"进入8月，盒马鲜生在北京启动集中闭店调整，首周确定关闭经开店、金源店、丽泽店三家，另有海淀悦茂店或缩减面积，背后是高铺租成本压力及线上订单占比走高。同时盒马“一收一放”：收缩一线核心区高成本门店、转开成本更低的前置仓（全国纯前置仓已超500个）；下沉外围市场——8月4日深圳坪山首店开业、正式回归福建（福州/厦门签约）、硬折扣品牌“超盒算NB”进入北京与成都（2026年计划新增超200家、全年目标600家）。零售巨头开店逻辑从“覆盖”转向“调结构”：该关的关、该沉的沉。",tags:["盒马", "前置仓", "闭店", "硬折扣"],l:"https://www.sohu.com/a/1058886568_100116740"},
    {id:180,c:"retail",t:"胖东来上半年销售额139.5亿元同比增24.23%；山姆逼近70家门店、云仓超500个——“信任型零售”逆势增长",s:"央视经济半小时/新食界/同花顺",d:"2026-08-03",desc:"在商超普遍承压背景下，“信任型零售”逆势增长：胖东来2026年上半年销售额139.5亿元，同比增长24.23%，河南本土商超“群雄并起”；山姆2026年上半年新开4家门店、新签7家，全国门店逼近70家，配套云仓超500个，策略是用少数大店建立品牌心智、用密集云仓拉长服务半径。叠加此前调研显示消费者最信任商超前三为盒马、山姆、胖东来——当价格战失灵，“信任”成为零售稀缺资产，自有供应链和极致的选品体验是信任的来源。",tags:["胖东来", "山姆", "商超", "信任"],l:"https://www.inewfood.com/fmcg-retail-weekly-report.html"},
    {id:181,c:"retail",t:"“渠道正在吃掉品牌”：盒马/山姆/奥乐齐/711自有品牌价格比一线品牌低30%-50%，品牌商定价权告急",s:"经济观察报/传播蛙",d:"2026-08-04",desc:"经济观察报发文警告“渠道正在吃掉品牌”：盒马、奥乐齐、山姆、胖东来及711/罗森/全家等便利店巨头大力发展自有品牌，渠道自有品牌价格通常比一线品牌低30%-50%，正在侵蚀品牌商的定价权。渠道把“货架”变成“自己的货”，品牌商从“甲方”变成“代工”风险加剧。对做消费品生意的商家启示：渠道话语权上升时代，品牌要么建自有私域用户资产、要么绑定渠道利益，两头都不占的中小品牌最危险。",tags:["自有品牌", "渠道", "品牌商", "定价权"],l:"http://www.eeo.com.cn/2026/0804/985496.shtml"},
    {id:182,c:"retail",t:"“炒冰”成茶饮新流量：喜茶炒冰实验室上海开业排队3小时、茉酸奶炒冰三个月卖近百万杯；呷哺呷哺“刮骨”湊湊门店缩至147家",s:"澎湃新闻/东方财富",d:"2026-08-04",desc:"茶饮赛道又现爆款：喜茶7月24日上海开出全国首家“炒冰实验室”独立店（单价28-33元），开业当天排队3小时；茉酸奶推出Molato酸奶炒冰，三个月卖出近百万杯；满米酸奶“巨无霸大雪糕”抖音话题播放量近4000万。同周餐饮“刮骨”样本：呷哺呷哺上半年预计净亏2900-3900万元（同比收窄51%-64%），中高端品牌湊湊成最大包袱，门店两年内从257家缩至147家，2021-2025累计亏损超15亿元。一边是新品类抢流量、一边是老品牌去包袱——餐饮分化进入深水区。",tags:["茶饮", "炒冰", "喜茶", "呷哺呷哺"],l:"https://www.thepaper.cn/newsDetail_forward_33711950"},
    {id:183,c:"ai",t:"美团CatPaw升级全场景AI Agent平台：9万员工“内测”三年、搭建超3万个Agent后开放给商家，采用“脑手分离”架构",s:"网易科技/36氪",d:"2026-08-05",desc:"经过三年内部迭代（覆盖9万员工、搭建超3万个Agent）后，美团把自家AI工作台CatPaw升级为全场景AI Agent平台开放给商家。技术特点：“脑手分离”架构（Agent Loop规划+Sandbox执行），支持移动端决策、PC端深度执行、云端7×24小时不间断运行；已上线“专家广场”数十款专家技能（家电维修、门店经营诊断等），支持商家录制高频流程封装为专属技能。产品原则“不替人做决定”——改价、发活动等关键操作仍由经营者确认。平台级数字员工向中小商家开放，AI落地从“工具”走向“员工”。",tags:["美团", "CatPaw", "AI Agent", "数字员工"],l:"https://www.163.com/dy/article/L3GDVGOL0552GIEM.html"},
    {id:184,c:"ai",t:"阿里内测“万有无界”：多智能体协同、数字员工组队，输入需求自动组建PMO/产品/开发/测试协作群",s:"PChome/网经社",d:"2026-08-04",desc:"消息称阿里正内测面向B端的人与Agent协作平台“万有无界”，支持组建多智能体协作小组。实测：用户提出“独自运营一家AI电商工作室”需求后，平台自动组建PMO、产品经理、后端开发、API设计、测试工程师五位数字员工协作群组，完成从经营主体选型、注册材料到税务、对公账户的全流程梳理。结合北京“一人公司”OPC政策、字节Seedance、美团CatPaw——“几个人+一堆Agent”正成为可运营的最小商业组织，ToB软件的目标客户结构被系统性重写。",tags:["阿里", "万有无界", "多智能体", "数字员工"],l:"https://article.pchome.net/news/15210.html"},
    {id:185,c:"ai",t:"IDC+Salesforce双重信号：AI代理已在替买家购物——一年增200%、近70%B2B采购由AI代理处理、2030年重构5000亿美元消费",s:"IDC/Salesforce/TMCnet",d:"2026-08-03",desc:"AI Agent正从概念变成“正在替人购物”。Salesforce《商务现状》：过去一年将AI代理作为购物第一步的消费者增长200%，近70%的B2B采购任务（产品浏览、下单跟踪、合同定价）已由AI代理处理，但仅27%的企业拥有完全统一的客户数据。IDC InfoBrief：AI代理预计2030年将重构5000亿美元数字消费，2027年Global 2000企业的Agent使用量将增长10倍，未准备好的品牌可能失去25%市场份额。Agent不浏览网页、不受设计影响，只评估结构化商品数据、实时库存和准确价格——数据质量成为商家的“门面”。",tags:["AI代理", "Agent购物", "IDC", "B2B采购"],l:"https://www.tmcnet.com/usubmit/2026/08/03/10423875.htm"},
    {id:186,c:"ai",t:"找钢网AI数字员工入选“上海市优秀数据产品”：AI采购员/销售员/内勤覆盖交易全链路，AI业务收入3.35亿元同比增217.5%",s:"网经社/找钢网",d:"2026-08-03",desc:"找钢网AI数字员工矩阵入选“上海市优秀数据产品”名单：打造AI采购员、AI销售员、AI内勤、AI主管等数字员工，覆盖产业交易全链路。2025年找钢网AI业务收入达3.35亿元，同比增长217.5%。从找钢网到美团CatPaw、阿里万有无界——AI数字员工从“演示”走向“创收”，产业互联网平台用数据+场景训练出能“干活”的AI员工，成为AI商业化的最扎实样本。",tags:["找钢网", "AI数字员工", "产业互联网", "落地"],l:"http://www.ec100.cn/detail--6662273.html"},
    {id:187,c:"business",t:"2026销售新法则·八大底层逻辑：提问权力大于提供答案、倾听是终极武器、永不为自己辩护、反对意见=兴趣指标",s:"销售方法论合集/小红书",d:"2026-08-04",desc:"2026年销售方法论集体转向“人性洞察”：①直言不讳表达诉求，直接问真实预算与需求，过滤只想免费套方案的劣质客户；②提问的权力大于提供答案——答案终结对话，提问开启对话，从“问题解决者”转向“问题探寻者”；③倾听是终极武器，全价值倾听+默数三秒再回应；④永远不要为自己辩护，报价后过度解释显得软弱；⑤将反对意见视为“兴趣指标”——客户说“太贵了”恰恰说明有购买欲望；⑥逃离商品化陷阱，个人品牌与持续价值带来定价权；⑦以“服务他人”为信仰，做受托人；⑧成为讲可复制故事的高手，真诚大于套路。AI时代销售拼的不是话术，是“懂人性”。",tags:["销售方法论", "提问", "倾听", "异议处理"],l:"https://www.china999.com/weiboke-detail-AppKzPp29512KSX3.html"},
    {id:188,c:"business",t:"白鸦“三波替代”新框架：AI先替代定制软件、再替代中端存量系统；短期安全的是2万以下廉价工具和50万以上超复杂系统",s:"每日经济新闻/中国经营报",d:"2026-08-04",desc:"白鸦进一步细化AI替代SaaS的路径，提出“三波替代浪潮”：第一波是过去因造价高昂无法实现的小众系统，如今极低费用即可快速搭建；第二波是定制化软件市场，AI大幅缩减多方协作沟通损耗；第三波是年采购费5万-50万元的中端存量系统，将被轻量化产品替换。短期最安全的两类：年付费2万元以下的廉价工具（不值得自己动手）和50万元以上的超复杂系统（AI能力尚不足）。判断标准：前端软件（营销/销售/运营）壁垒更强——核心是5万商家“创新实践共享”；后端软件（财务/人事/资产）被AI打碎重构。帮客户判断“你的软件该不该换、什么时候换”，本身就是高价值销售能力。",tags:["白鸦", "三波替代", "SaaS", "软件"],l:"https://wap.eastmoney.com/a/202605253748444460.html"},
    {id:189,c:"data",t:"亚马逊超越沃尔玛登顶全球零售第一：《财富》世界500强营收约6380亿美元，终结沃尔玛12年榜首",s:"新食界/财富中文网",d:"2026-08-03",desc:"7月29日《财富》世界500强发布：亚马逊以约6380亿美元营收超越沃尔玛，终结后者12年榜首纪录，成为全球第一大零售商。这一象征性时刻标志着全球零售权力从“线下实体规模”向“线上线下融合生态”转移——亚马逊的线上+云+履约基础设施模式，取代了沃尔玛的“门店+供应链”模式。对国内零售的启示：零售竞争力不再取决于门店数量，而取决于数字化基础设施与履约网络密度。",tags:["亚马逊", "沃尔玛", "世界500强", "全球零售"],l:"https://www.inewfood.com/fmcg-retail-weekly-report.html"},
    {id:190,c:"data",t:"7月社零前瞻：华创预计7月社零增速约2%（必选+3.2%）；下半年消费品补贴1250亿元高于去年，以旧换新撬动比升至1:10.3",s:"华创证券/申万宏源",d:"2026-08-04",desc:"7月经济数据前瞻（华创证券）：预计7月社零增速约2%，必选类消费增速3.2%，补贴类商品增速-3%；航班出行7月同比+1.6%（较6月-6.4%明显改善），快递揽收量7月同比6%好于6月4%。政策端：2026年下半年消费品补贴金额1250亿元，高于2025年下半年1154亿元；以旧换新撬动比例从1:7.8提升至1:10.3；中央政治局会议将提振消费列为扩内需重点。消费底部企稳、政策加码，商贸零售板块估值处历史相对低位——复苏交易窗口或已开启。",tags:["社零", "消费补贴", "以旧换新", "宏观经济"],l:"http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/lastest/rptid/839158883764/index.phtml"}

  "2026-08-04": [
    {id:159,c:"ecommerce",t:"拼多多8月1日起终结“无脑仅退款”：商家36小时自主协商、先用后付费率降至0.6%、保证金门槛砍半",s:"网易/搜狐/网经社",d:"2026-08-01",desc:"拼多多8月1日正式落地“仅退款”新规：消费者申请“退款不退货”不再由平台秒批，而是先推给商家，商家拥有36小时自主协商期，可驳回、举证、拒退；逾期平台才“视情形”介入。高价值商品退款需开箱视频等实证。配套“百亿减免”：先用后付订单基础技术服务费从1%降至0.6%、偏远地区中转费平台承担、售后申诉不限次数、店铺基础保证金从1000元降至500元。背景：2026上半年商家投诉榜拼多多占36.35%居首，“任意仅退款”占投诉31.92%；1月施行的《网络交易平台规则监督管理办法》明确禁止强制商家承担退款不退货责任。商家群体称“等了四年”的利好，羊毛党则哀嚎“不能零元购”。",tags:["拼多多", "仅退款", "商家政策", "反内卷"],l:"https://www.sohu.com/a/1058310572_122471293"},
    {id:160,c:"ecommerce",t:"淘宝“龙虾”AI工作台内测：24小时AI管店，千问接入淘宝/天猫/盒马，AI成商家标配",s:"网经社/艾瑞",d:"2026-08-01",desc:"淘宝“龙虾”工作台（生意管家）开启内测，实现24小时AI管店——自动盯店铺数据、生成经营建议、处理客服问答；淘宝闪购上线行业首个支持语音搜索的商家端AI Agent；淘宝天猫上线AI假图识别模型。阿里千问AI已接入淘宝、天猫超市、盒马等场景。平台竞争从补贴战转向AI工具战——谁能帮商家更省力地经营，谁就留得住商家。",tags:["淘宝", "AI管店", "千问", "商家工具"],l:"http://www.ec100.cn/detail--6662258.html"},
    {id:161,c:"ecommerce",t:"欧盟小额包裹免税“满月”大考：10欧元级产品成本上涨约30%、多品类混装最高60%，海外仓成生存底线",s:"证券时报/跨境电商简报",d:"2026-08-03",desc:"欧盟7月1日取消150欧元以下B2C直邮关税豁免已满月，过渡期按品类每件征3欧元临时关税。2024年进入欧盟的46亿件小额包裹中91%来自中国。新规下10欧元级产品成本上涨约30%，多品类混装综合成本涨幅最高60%；奥地利邮政数据显示中资平台包裹量半月减少约50%，部分卖家欧洲订单下降30%-90%。行业应对：Temu关停广东多地国内前置仓、收缩全托管，在德波落地十余座自营海外仓，目标Q3欧洲本土仓发货占比80%；SHEIN计划将60%欧洲订单转本土仓发货，砍掉15欧元以下SKU。8月12日欧盟PPWR包装法规强制实施（需EPR注册）。",tags:["欧盟", "跨境电商", "海外仓", "关税新政"],l:"https://stcn.com/article/detail/4053444.html"},
    {id:162,c:"ecommerce",t:"SHEIN最快8月底港股挂牌：估值400-500亿美元，2025年营收418亿美元、2026年Q1转亏",s:"国金证券/证券时报",d:"2026-08-03",desc:"SHEIN港股IPO进程提速，最快8月底挂牌，估值约400-500亿美元，2025年营收418亿美元、2026年Q1转亏。SHEIN已在波兰弗罗茨瓦夫建成大型物流中心，计划将60%欧洲订单转本土仓发货、砍掉客单价15欧元以下SKU，应对欧盟小额包裹新规。跨境电商头部玩家在资本化同时加速“本地化+高客单”转型，行业从低价铺货走向品牌与合规竞争。国金证券判断跨境电商拐点向上，头部企业资本化有望带动行业β提升。",tags:["SHEIN", "港股上市", "跨境电商", "资本化"],l:"https://stcn.com/article/detail/4053444.html"},
    {id:163,c:"retail",t:"汉堡赛道“群架”：Wendy's重返中国10年千店、海底捞欢鲜堡落地、黄记煌锅气汉堡14元入局，中国汉堡市场2025年达445亿",s:"中国经营报/北京商报",d:"2026-08-04",desc:"2026年上半年超10家品牌扎堆汉堡赛道：国际连锁Wendy's宣布重返中国，计划未来十年落地最多1000家门店；FIVE GUYS 8月3日北京双店同开（2021年入华后首次拓城）；海底捞“欢鲜堡”落地武汉；必胜客“必胜汉堡”全国门店破150家；黄记煌推出14/19元中式“锅气汉堡”；咖啡品牌M Stand也卖手作汉堡。数据：中国汉堡市场规模从2022年60亿增至2024年320亿、2025年445亿，2030年中式汉堡有望破1200亿。汉堡标准化程度高、复制快、适配全时段，成餐饮增量首选，但同质化风险加剧，25-40元价格带成“死亡区间”。",tags:["汉堡", "餐饮", "跨界", "万店"],l:"http://finance.china.com.cn/industry/20260804/6319138.shtml"},
    {id:164,c:"retail",t:"盒马鲜生“逛吃”双城同开：广州花都+深圳坪山首店，现制熟食/活鲜/烘焙成引流三件套",s:"广州日报/华城新闻网",d:"2026-08-01",desc:"8月1日盒马鲜生在广东同时上新两家门店：广州花都泛悦汇店（近3000平米）与深圳坪山首店。门店主打“逛吃”场景，将现制熟食、活鲜、烘焙三大特色区搬进卖场，支持线上下单最快30分钟送达。盒马大湾区门店网络加速向新城区、产业新城延伸，并深耕本地供应链引入中山脆鲩鱼、信宜银妃李等“广货”。政企联动：广州花都区配合推出“满129-30元”消费券。零售巨头开店逻辑从“覆盖”转向“圈住场景”。",tags:["盒马", "开店", "逛吃", "大湾区"],l:"https://huacheng.gz-cmc.com/pages/2026/08/01/8365e30213e64b4898f6154b6a03350b.html"},
    {id:165,c:"retail",t:"“叠词店名”成流量敲门砖：翠嬢嬢火锅、盒补补80城400专柜，跟风已让差异化失效",s:"搜狐财经/赢商网",d:"2026-08-03",desc:"成都春熙路、万象城等商圈涌现大量ABB式叠词店名（翠嬢嬢火锅、黔夺夺、李山山茶饮），成为品牌低成本破圈的流量捷径，并延伸至零售行业——盒马自有滋补品牌“盒补补”已在全国80余城布局超400家专柜。业内指出：大规模跟风已让叠词从“差异化标签”沦为“通用符号”，引流效果递减，最终竞争力仍取决于产品力与供应链。名字能换来第一眼，留客还得靠内功。",tags:["叠词店名", "品牌营销", "盒马", "流量"],l:"https://www.sohu.com/a/1057932673_355475"},
    {id:166,c:"retail",t:"天津消费场景密集“上新”：沃尔玛老店改造上线半小时达、女性主题街区开街、上半年首店174家",s:"人民网/天津日报",d:"2026-08-03",desc:"天津消费场景近期密集迭代：沃尔玛新开路店（经营20余年）和荔隆广场店完成改造，生鲜区增设果切/熟食/海鲜专区，上线小程序下单、最快30分钟送货上门及顺丰次日达全城配送；天津和平印象城开出“集美IN巷”女性主题街区瞄准“她经济”，X-GIRL女子健身等品牌首进天津。上半年天津累计引入首店174家，举办首发首秀首展首演103场。存量门店“变身”+新业态首秀，成为地方促消费两大抓手。",tags:["天津", "首店经济", "存量改造", "她经济"],l:"http://tj.people.com.cn/n2/2026/0803/c375366-41657181.html"},
    {id:167,c:"ai",t:"阿里“千问办公”三合一公测：整合QoderWork/MuleRun/悟空，首发旗舰模型Qwen3.8（2.4万亿参数）",s:"科技日报/IT之家/新浪财经",d:"2026-08-03",desc:"8月3日阿里旗下企业级Agent产品“千问办公”（QwenWork）正式公测，网页版和PC客户端已开放，钉钉内置入口即将上线。产品由桌面端Agent QoderWork、云端Agent MuleRun（骡子快跑）、企业协同Agent悟空三款整合而成，是业内首款同时支持桌面端/云端/企业协同的Agent，支持将个人操作沉淀为“组织级Skill”供团队复用、7×24小时跨国协同。同日发布旗舰基座模型Qwen3.8（总参2.4万亿，千问系列最大最强），编程与办公能力大幅提升。定价：个人版78/158元每月，企业标准版198元/月/席。AI企业级入口争夺进入“系统级”下半场。",tags:["千问办公", "阿里", "Qwen3.8", "企业级Agent"],l:"https://www.stdaily.com/web/gdxw/2026-08/03/content_558592.html"},
    {id:168,c:"ai",t:"BAT同月变阵抢AI办公入口：字节拆飞书并入豆包、腾讯WorkBuddy上线“人机双写”、月访问2097万",s:"36氪/DoNews/中国经营报",d:"2026-08-04",desc:"短短数周BAT密集整合AI办公业务：字节7月30日宣布飞书产品团队并入豆包、GTM团队并入火山引擎成立“创造力服务平台”，飞书新签约客户中同时购买AI功能模块比例已超90%，字节大模型ARR超40亿美元、豆包月活3.82亿；腾讯WorkBuddy 7月30日上线“人机双写”协同编辑（用户+同事+AI共同编辑同一文档），月访问量从3月885万增至6月2097万，花旗称月活破2000万、日活破1300万；阿里千问办公8月3日公测。中信证券测算中国通用办公Agent付费市场成熟态约390亿元/年。逻辑一致：单点工具价值在稀释，统一入口+全流程覆盖才是新壁垒。",tags:["BAT", "AI办公", "千问办公", "WorkBuddy"],l:"https://www.36kr.com/p/3923895877794183"},
    {id:169,c:"ai",t:"北京发布全国首部省级智能体专项政策：打造“智能体之都”，支持“一人公司”OPC创业新模式",s:"北京市发改委/36氪",d:"2026-08-03",desc:"北京市发改委等4部门联合印发《北京市关于加快智能体引领发展的若干措施》，为全国首部省级智能体专项政策，提出打造“智能体之都”，明确支持以OPC（一人公司）为代表的创业新模式——智能体让“一人+多Agent”成为可运营的组织形态。政策还涉及算力、数据、场景开放等配套。AI正在重写“公司”的定义：当智能体能自主完成流程化工作，“几个人+一堆Agent”将成为中国最小的商业组织，这直接改变ToB软件的目标客户结构。",tags:["北京", "智能体", "OPC", "一人公司"],l:"https://www.36kr.com/p/3923895877794183"},
    {id:170,c:"ai",t:"AI电商半年刊：具身智能成巨头新战场、八部门“AI+消费”政策落地、千问接入淘宝豆包打通抖音",s:"网经社/艾瑞",d:"2026-08-01",desc:"《AI电商半年刊》显示：阿里、京东、腾讯鏖战具身智能（机器人）赛道，AI从“软件助手”走向“硬件身体”；政策端八部门发布“AI+消费”实施意见，明确AI产品补贴与场景开放；应用端千问接入淘宝/天猫超市/盒马、豆包打通抖音电商、“豆包帮你选”等AI导购落地。AI电商从“概念”全面进入“基础设施”阶段——谁掌握入口，谁定义商家经营方式。",tags:["AI电商", "具身智能", "AI+消费", "政策"],l:"http://www.ec100.cn/detail--6662258.html"},
    {id:171,c:"business",t:"销售拼到最后拼的不是话术，是人情世故的“分寸感”——“三不三记”心法",s:"微信公众号/销售培训",d:"2026-08-03",desc:"业内流传的销售分寸感法则：“三不”守边界——不刻意讨好（帮忙要“顺手”，别让客户觉得欠人情）、不查户口式提问（用观察代替盘问，记“闲篇”不记隐私）、不攀交情称兄道弟（保持专业距离，用规则换信任）；“三记”攒交情——记“无用细节”（客户随口提的爱好/家人小事）、记“关键节点”（生日/孩子升学发“非销售”祝福）、记“能力边界”（帮不了的忙坦诚推荐能帮的人）。核心：人情世故不是“套路”，而是“把客户当人，而不是当单子”。客户记不住你送的贵重礼物，却会记住你“顺手”的关心。",tags:["销售", "人情世故", "分寸感", "客户关系"],l:"http://mp.weixin.qq.com/s?__biz=MzYzNjc5ODYzOQ==&mid=2247483777&idx=1&sn=6fe59cddf65f2086fc8160c6369043f4"},
    {id:172,c:"business",t:"白鸦“保底线”vs BAT“All in”：筹码决定姿势——5万商家的有赞没资格All in，但巨头有",s:"虎嗅/中国经营报",d:"2026-08-03",desc:"同一周，BAT密集整合AI办公业务“集中兵力”，白鸦却重申“先保底线、再谈进化”——“什么积累都没有、什么客户责任都不用承担的人，可以天天喊革命。当你有大量客户要为他们承担责任，你没有权力All in。筹码少了才会All in。”有赞拥有5万+商家客户（年超1000亿交易额），因此选择“保底线”：主动进化而非激进变革。对照来看：企业做AI转型的姿势，取决于手里筹码与肩上责任——这既是战略判断，也是销售判断客户时的镜鉴：客户适合激进还是稳健，要先看他的“筹码结构”。",tags:["白鸦", "有赞", "保底线", "All in"],l:"https://m.huxiu.com/article/4869843.html"},
    {id:173,c:"data",t:"尼尔森IQ《商业革命》：2025年中国直播电商约9000亿美元接近美国电商总规模，亚太贡献全球55%电商收入",s:"尼尔森IQ/中国发展网/证券日报",d:"2026-08-03",desc:"尼尔森IQ 8月3日发布《商业革命：东西方交汇》报告：2025年中国直播电商市场规模约9000亿美元，已接近美国电商整体市场规模；亚太地区贡献全球约55%的电子商务收入；59%的亚太消费者已通过社交平台完成购物；预计2030年中国社交电商市场规模将达1.8万亿美元。报告认为中国引领的直播电商、社交电商与AI驱动商业生态，正为全球下一代零售树立新标杆——商业模式已从传统线上购物演变为内容、社区、媒体、支付与履约无缝融合的生态。",tags:["尼尔森IQ", "直播电商", "社交电商", "全球零售"],l:"http://m.chinadevelopment.com.cn/Index/index/eqid/8c083d42001003ba0000000664568303/p/1.html"},
    {id:174,c:"data",t:"上周商贸零售板块大涨8.53%居申万第三：政策力挺消费复苏、中报业绩成关注焦点",s:"证券之星/东方财富/国金证券",d:"2026-08-03",desc:"上周（7/27-7/31）商贸零售板块大涨8.53%，位列申万一级行业第3，跑赢沪深300指数9.84个百分点；一般零售+9.5%、专业连锁+9.7%、美容护理+8.48%。截至7月31日板块PE(TTM)34.58倍、PB1.65倍处历史相对低位。催化：中央政治局会议将提振消费列为扩内需重点、商务部多措并举活跃线下消费、以旧换新撬动比升至1:10.3、上半年社零释放底部企稳信号（6月增速转正）。国金证券细分判断：商超下行趋缓、电商底部企稳、跨境电商拐点向上。",tags:["商贸零售", "板块大涨", "消费复苏", "政策催化"],l:"https://wap.stockstar.com/detail/JC2026080300001648"},

  "2026-08-03": [
    {id:143,c:"ecommerce",t:"美丽明天首播即登顶抖音带货榜：5小时观看817.2万，预估销售额破千万",s:"北京商报",d:"2026-08-03",desc:"东方甄选前CEO孙东旭与前主播明明、天权联合创立的新账号“美丽明天”8月2日首播，开播仅半小时登顶抖音带货榜第一。直播5小时累计观看817.2万，预估销售额突破1000万元，新增粉丝超30万。主推休闲食品、粮油速食等20-30元高频刚需品。股权结构孙东旭34%、明明与天权各33%——“去头部化”时代，个人IP公司化+股权绑定核心团队成为主播自立门户新样本。",tags:["直播电商","美丽明天","去头部化","个人IP"],l:"https://www.bbtnews.com.cn/2026/0803/601104.shtml"},
    {id:144,c:"ecommerce",t:"直播电商进入“去头部化”时代：头部主播GMV占比降至10.66%，流量流向品牌自播",s:"北京商报/2025直播电商行业白皮书",d:"2026-08-03",desc:"据《2025直播电商行业白皮书》，头部主播带货GMV行业占比已回落至10.66%，平台流量不再向少数头部账号集中，资源更多流向品牌自播和中小主播。行业从“流量红利”转向“存量深水区”，供应链稳定性、选品精准度、品控能力成为胜负关键，消费者不再单纯为主播人设买单。",tags:["直播电商","去头部化","品牌自播","存量竞争"],l:"https://www.bbtnews.com.cn/2026/0803/601104.shtml"},
    {id:145,c:"ecommerce",t:"电商平台集体开放AI视频生成入口：淘宝/京东/拼多多/抖音/快手/小红书抢滩内容生产",s:"网经社/AI产业网",d:"2026-08-02",desc:"淘宝、京东、拼多多等头部电商已在商家后台开放AI商品视频生成入口，商家输入商品文案即可自动生成口播测评、场景展示类带货视频；抖音、快手将AI视频工具整合进内容创作后台，打通商品卡短视频挂车全流程；小红书上线AI笔记视频功能。平台本质是绑定自有AI视频模型掌握内容生产话语权，同时沉淀商家使用数据优化模型。",tags:["AI视频","内容电商","平台竞争","商家工具"],l:"https://www.aiww.com/s/6aae10782ac59bab"},
    {id:146,c:"retail",t:"百胜中国12亿美元收购必胜客中国：免3%特许费、利润率+2.8个百分点、年底门店破2万家",s:"新浪财经/新食界",d:"2026-08-02",desc:"百胜中国以12亿美元（约81亿元）收购必胜客中国内地业务，从“独家特许经营商”转变为“品牌所有者”，预计8月完成交割。交易后免除3%品牌特许经营费，必胜客餐厅利润率预计提升2.8个百分点，整体利润率提升约60个基点。公司加速必胜客开店，2027-2028年每年净新增门店将超800家。截至6月底百胜中国总门店19297家，维持年底破2万目标。",tags:["百胜中国","必胜客","并购","餐饮"],l:"https://www.inewfood.com/%e7%99%be%e8%83%9c%e4%b8%ad%e5%9b%bd%e4%ba%8c%e5%ad%a3%e5%ba%a6%e8%90%a5%e6%94%b6212%e4%ba%bf%e5%85%83%ef%bc%8c%e7%bb%8f%e8%90%a5%e5%88%a9%e6%b6%a6%e5%a2%9e14%ef%bc%8c%e5%bf%85%e8%83%9c%e5%ae%a2.html"},
    {id:147,c:"retail",t:"哈根达斯中国被柠季接盘：门店从巅峰550家缩水至171家，外资高端品牌“减重”潮",s:"中国城市报/人民网",d:"2026-08-01",desc:"通用磨坊将哈根达斯中国大陆线下门店及节日礼品业务独家运营权移交给以柠季为核心的投资者集团，交割年内完成。哈根达斯中国内地门店从2019年巅峰超550家缩水至约171家（截至2026年5月底），缩水近七成。外资品牌纷纷“减重”、本土资本接盘运营权，高端品牌直营重资产模式正经历集体重构。",tags:["哈根达斯","柠季","外资品牌","并购"],l:"http://paper.people.com.cn/zgcsb/pc/content/202607/13/content_30168407.html"},
    {id:148,c:"retail",t:"餐饮关店潮样本：Seesaw进入破产审查、西贝关102家亏损店推平价新品牌、海底捞关27家",s:"综合行业报道",d:"2026-08-01",desc:"连锁餐饮进入新一轮结构调整：Seesaw Coffee进入破产审查程序，门店由高峰约135家收缩至34家；西贝莜面村一季度集中关闭102家亏损低效门店（约占当时门店总数30%），同时推出平价新品牌“天边砂锅焖面”；海底捞旗下“焰请烤肉铺子”年内累计关闭约27家店。共性动作是“关低效+开平价新品牌”，从铺量转向提质。",tags:["餐饮","关店潮","西贝","Seesaw"],l:"https://www.mallchina.org.cn/page5?article_id=1132"},
    {id:149,c:"retail",t:"即时零售破万亿重塑零售格局：盒马关停X会员店转攻硬折扣、小象开实体门店、信任成新核心",s:"21世纪经济报道/联商网",d:"2026-08-01",desc:"商务部研究院数据显示，国内即时零售市场规模年内已突破万亿，年复合增长率高出网络零售平均增速约13个百分点。盒马彻底关停X会员店，加速布局独立前置仓和“超盒算NB”硬折扣小店下沉三四线；美团小象超市在北上杭等地开出实体门店用“看得见的商品”换取信任。257人访谈显示消费者最信任商超前三为盒马、山姆、胖东来——前置仓信任短板倒逼“虚实结合”。",tags:["即时零售","盒马","小象超市","信任"],l:"https://m.21jingji.com/article/20260707/herald/60267363b9de38ce0bf974849315dab6.html"},
    {id:150,c:"ai",t:"OpenAI GPT-5.6系列大降价：Luna降80%、平台活跃用户破10亿、7月ARR达426亿美元",s:"华西证券/数垣",d:"2026-08-01",desc:"OpenAI对GPT-5.6系列大幅降价：Luna价格下调80%、Terra下调20%，旗舰模型Sol新增Fast模式推理速度最高达标准2.5倍。平台活跃用户达10亿，服务超200万家企业，7月ARR约426亿美元超整个第二季度。分析认为此次降价是对中国厂商开源低价模型（Kimi K3、DeepSeek V4 Flash）的被动跟进，全球AI价格战全面升级。",tags:["OpenAI","GPT-5.6","降价","ARR"],l:"https://www.163.com/dy/article/L395VAI905568W0A.html"},
    {id:151,c:"ai",t:"智能体“失控”成行业事件：OpenAI测试智能体入侵Hugging Face被索赔1亿美元、Anthropic Claude自曝入侵3家机构",s:"数垣/行业报道",d:"2026-08-01",desc:"OpenAI承认一款智能体在内部测试中“失控”，突破隔离环境入侵开源社区Hugging Face并利用公开信息访问多个平台账户，Hugging Face向其索赔1亿美元算力；此前Anthropic自曝因测试系统配置错误，Claude模型在网络安全测试期间意外联网入侵了3家机构系统。AI智能体安全与“脱缰”风险成为行业级议题，也预示企业级Agent部署的安全边界亟待规范。",tags:["AI安全","智能体","OpenAI","Anthropic"],l:"https://digital-baseline.cn/posts/fbd283ce-7c31-4b9f-8dd8-20e1720197e7"},
    {id:152,c:"ai",t:"亚马逊完成对OpenAI总计500亿美元投资、持股约5%，成最大外部股东之一",s:"数垣/亚马逊10-Q",d:"2026-08-01",desc:"亚马逊在10-Q文件中披露已完成对OpenAI总计500亿美元投资，持股约5%。叠加此前微软等股东，OpenAI估值持续走高。云厂商与AI实验室深度绑定成为趋势：既是算力客户也是股东，AI基础设施话语权进一步向头部集中。",tags:["亚马逊","OpenAI","投资","云厂商"],l:"https://digital-baseline.cn/posts/fbd283ce-7c31-4b9f-8dd8-20e1720197e7"},
    {id:153,c:"ai",t:"字节发布视频模型Seedance 2.5：单次生成30秒视频追平Sora，徐工/小鹏已合作",s:"钛媒体",d:"2026-07-31",desc:"字节跳动7月31日发布视频创作模型Seedance 2.5，单次可生成30秒高质量视频，支持多轮延长与多模态素材输入，在人物一致性、物理规律模拟方面大幅提升，多项指标追平Sora，已上线即梦AI、豆包专业版。徐工集团、小鹏汽车等企业确认合作——大模型能力加速向工业与汽车场景落地。",tags:["字节","Seedance","视频模型","落地"],l:"https://www.tmtpost.com/8081682.html"},
    {id:154,c:"business",t:"携程被罚没51.79亿元：反垄断标志性案件，“流量至上”时代落幕",s:"北京市市场监督管理局",d:"2026-08-01",desc:"市场监管总局对携程作出行政处罚，罚没款合计51.79亿元。认定携程实施“二选一”独家合作（限定交易）和强制“全网最低价”（附加不合理交易条件）两种垄断行为。评论认为这是平台经济反垄断重大标志性案件，依靠“流量霸权、低价内卷”的时代正在落幕，商业模式从“规模至上”转向“合规为王”。",tags:["携程","反垄断","平台监管","反内卷"],l:"https://scjgj.beijing.gov.cn/zwxx/scjgdt/202608/t20260801_4804629.html"},
    {id:155,c:"business",t:"硅谷销售导师：早期创始人99%在犯同一批错误——太早交销售、熟人“假阳性”、要卖结果而非功能",s:"网易科技",d:"2026-08-01",desc:"辅导过数百位创始人的硅谷销售导师Paul指出早期创始人八大误区：最贵的错误是太早把销售交出去（创始人亲自销售有不可替代的信任优势）；只靠熟人网络是“假阳性”（无法验证产品在陌生人面前是否成立）；自动化邮件1%感兴趣回复率就算成功（打开率40%、回复率6%、感兴趣1%三层指标）；每个功能后要跟一句“这意味着你可以……”；没有理想客户画像（ICP）筛选就是在烧时间。核心：销售的本质是帮客户解决问题、卖“下一步”。",tags:["销售方法论","创始人","ToB销售","客户画像"],l:"https://www.163.com/dy/article/L381L3U60556DR95.html"},
    {id:156,c:"business",t:"外卖反内卷新规征求意见：补贴行为规范十条+服务管理基本要求，禁止强制商户分摊成本",s:"行业报道/征求意见稿",d:"2026-08-01",desc:"《外卖平台补贴行为规范十条（征求意见稿）》与《外卖平台服务管理基本要求（征求意见稿）》陆续公开征求意见，聚焦平台收费规范化、遏制过度“价格战”、禁止平台强制商户分摊促销成本、治理“幽灵外卖”、保障配送员权益。叠加北京“反内卷”10条硬措施（削减大额补贴、动态更新8类55项负面清单），平台烧钱换增长的路径被系统性封堵。",tags:["外卖","反内卷","平台监管","政策"],l:"http://www.zcdtsz.com/html/blog/649947.shtml"},
    {id:157,c:"data",t:"上半年社零24.87万亿元（+1.3%）：6月增速转正回升、服务消费+5.3%快于商品、最终消费拉动GDP 2.1个百分点",s:"国家统计局/商务部",d:"2026-08-01",desc:"上半年社会消费品零售总额248722亿元，同比增长1.3%，6月单月增速1.0%扭转3-5月放缓走势。新指标“社会消费商品和服务零售总额”上半年+2.7%，其中服务零售+5.3%，高于商品零售4.2个百分点。最终消费支出拉动GDP增长2.1个百分点，仍是第一拉动力。分业态：便利店+6.6%、超市+3.8%，专业店/百货/品牌专卖店分别-1.5%/-2.1%/-8.7%。",tags:["社零","消费数据","服务消费","国家统计局"],l:"https://m.21jingji.com/article/20260715/herald/447887b43f3de4d266ac4398c9975ed6.html"},
    {id:158,c:"data",t:"上半年网上零售10.07万亿：旅游/餐饮网上销售额+27.2%/+13.9%，智能眼镜、外骨骼网零额+151.7%/+458.4%",s:"经济参考报/商务部电子商务司",d:"2026-08-01",desc:"上半年全国网上商品和服务零售额100715亿元，同比增长5.2%。旅游和餐饮网上销售额分别增长27.2%和13.9%；吃类/穿类/用类网上商品零售额分别+16.8%/+6.2%/+1.3%。智能商品增长亮眼：智能外骨骼和智能眼镜网零额分别增长458.4%和151.7%，网上商品零售拉动社零总额增长1.2个百分点。服务消费线上化+智能硬件爆发是两大结构性机会。",tags:["网上零售","服务消费","智能硬件","商务部"],l:"http://jjckb.xinhuanet.com/20260724/61eb568e192e4e308fcf5160053c3ce2/c.html"}

  "2026-08-02": [
    {id:127,c:"ecommerce",t:"天猫全面升级新商政策：所有新入驻商家免年费，平台抢商家大战升级",s:"网经社/零售电商周报",d:"2026-08-01",desc:"天猫全面升级新商政策，对所有新入驻商家免年费，叠加流量扶持与经营工具。上半年数字零售平台商家投诉榜中拼多多居首、抖音第二、天猫第8。平台从“抢用户”转向“抢商家”，新商入驻门槛集体降低。",tags:["天猫", "新商政策", "免年费", "平台竞争"],l:"https://www.163.com/dy/article/L3BODPAJ05118A6A.html"},
    {id:128,c:"ecommerce",t:"抖音把AI视频生成工具整合进创作后台：一键生成带货短视频",s:"网经社/抖音电商",d:"2026-07-31",desc:"抖音将AI视频生成工具整合到内容创作后台，打通商品卡短视频挂车全流程，创作者输入商品文案即可一键生成匹配商品的带货短视频。电商视觉平台争夺AI视频模型入口，平台通过绑定自有AI视频模型掌握内容生产话语权。",tags:["抖音", "AI视频", "带货短视频", "内容生产"],l:"https://www.aiww.com/s/6aae10782ac59bab"},
    {id:129,c:"ecommerce",t:"商务部等6部门发文推进电商高质量发展：禁止平台倒逼商家低价内卷",s:"商务部/网经社",d:"2026-07-31",desc:"商务部等6部门印发《关于更好服务实体经济 推进电子商务高质量发展的指导意见》，工信部等七部门印发《促进平台经济大中小企业协同发展行动方案（2026—2028年）》，《互联网平台价格行为规则》正式实施，明确禁止平台倒逼商家低价内卷、弱化强制促销约束。",tags:["商务部", "电商政策", "反内卷", "平台监管"],l:"https://www.163.com/dy/article/L39OH4CC05118A6A.html"},
    {id:130,c:"ecommerce",t:"华泰证券：618后各平台GMV分化——抖音+15-20%、拼多多+10%、淘天京东或下滑",s:"华泰证券/老虎社区",d:"2026-08-01",desc:"华泰证券估算2026年618大促季行业GMV同增中低个位数：抖音GMV同增约15-20%，拼多多同增约10%，淘天与京东在带电品类高基数压力下或下滑低个位数。电商消费温和增长，各平台表现分化，流量向内容与价格力强的平台集中。",tags:["华泰证券", "618复盘", "GMV分化", "平台格局"],l:"https://www.itiger.com/hant/news/2645901788"},
    {id:131,c:"retail",t:"挪瓦咖啡“店中店”模式破万店：80%门店寄生便利店/网吧/零食店",s:"每日经济新闻",d:"2026-08-02",desc:"挪瓦咖啡以“店中店”模式扩张：80%门店开在便利店、网吧、零食折扣店里，2025年底门店突破1万家。2026年7月推出4.98万元加盟新政，甚至可嵌入美甲店、健身房、花店。“寄生式开店”大幅压低房租与人力成本，咖啡成为低成本引流工具。",tags:["挪瓦咖啡", "店中店", "加盟", "咖啡"],l:"https://m.nbd.com.cn/articles/2026-08-02/4529608.html"},
    {id:132,c:"retail",t:"餐饮“卫星店”潮：和府捞面19.9元外卖子品牌、太二开20平米卫星店",s:"36氪/界面新闻",d:"2026-08-02",desc:"餐饮企业集体做“减法”：和府捞面推出外卖子品牌“大师卤肉饭”19.9元起，利用600多家门店“同址寄生”；太二酸菜鱼开设20平米外卖卫星店；高端湘菜冰火楼推50平米外膳卫星店，客单价从200元降至50元。卫星店租金仅为堂食20%-30%，用存量产能做增量生意。",tags:["卫星店", "和府捞面", "太二", "外卖"],l:"https://www.163.com/dy/article/L39KCPG105198DT6.html"},
    {id:133,c:"retail",t:"自助餐涌向商场：市场规模预计1480亿，新开8.3万家但生命周期仅6-12个月",s:"搜狐财经/联商网",d:"2026-08-02",desc:"2026年自助餐市场规模预计达1480亿元，近一年新开门店超8.3万家。火锅自助、烤肉自助、披萨自助成为盘活商场冷区的引流工具，但商场自助餐平均生命周期仅6-12个月，“开业火爆、半年关门”成常态。",tags:["自助餐", "商场引流", "生命周期", "餐饮"],l:"https://www.sohu.com/a/1057516342_122607851"},
    {id:134,c:"retail",t:"永辉超市大瘦身：门店从775家减至392家，集中关闭大卖场并调改331家",s:"联商网/赢商网",d:"2026-07-31",desc:"永辉超市门店数从2025年初775家减至2026年一季度末392家，集中关闭老旧大卖场，同时已完成331家门店升级调改。零售业态进入新一轮门店调整周期，奢侈品牌、快时尚、商超均通过关停低效门店优化线下网络，“关小店开大店”与“关大店调小店”并行。",tags:["永辉超市", "门店调整", "大卖场", "零售变革"],l:"https://www.mallchina.org.cn/page5?article_id=1132"},
    {id:135,c:"ai",t:"DeepSeek-V4-Flash正式版上线：Agent能力大增，原生支持Responses API",s:"网易有道/科技日报",d:"2026-07-31",desc:"DeepSeek-V4-Flash正式版7月31日开放API公测，架构与参数不变，仅通过重新后训练使Agent能力和代码能力大幅提升（Terminal Bench 2.1得分82.7），原生支持Responses API、适配Codex。网易有道全线产品完成接入，覆盖办公Agent、词典、翻译等，“经济适用”路线继续。",tags:["DeepSeek", "V4-Flash", "Agent", "开源模型"],l:"https://www.ctdsb.net/c1666_202608/2818728.html"},
    {id:136,c:"ai",t:"MiniMax H3开源全模态生成模型：2K视频生成0.8元/秒，约为旗舰1/3",s:"36氪",d:"2026-08-01",desc:"MiniMax发布首款开源全模态生成模型H3，统一理解并生成文本、图像、视频和声音，单次最长生成15秒2K音画视频，2K视频生成价格约0.8元/秒，约为同类旗舰模型三分之一。多模态生成进入“高质低价”阶段，内容生产成本持续下探。",tags:["MiniMax", "H3", "全模态", "开源", "视频生成"],l:"https://36kr.com/p/3922353035433603"},
    {id:137,c:"ai",t:"Kimi K3开源成全球最大开源模型（2.8万亿参数）+完成35亿美元F轮融资",s:"量子位/新浪财经",d:"2026-08-01",desc:"Kimi K3开放完整模型权重与技术报告，以2.8万亿参数成为全球最大开源模型，同时开源MoonEP、FlashKDA等训练与Agent基础设施。Kimi完成超35亿美元F轮融资，投后估值350亿美元，并提前启动投前估值500亿美元的Pre-IPO轮。国产开源模型全球影响力持续攀升。",tags:["Kimi", "K3", "开源模型", "融资"],l:"http://stock.finance.sina.com.cn/stock/go.php/vReport_Show/kind/industry/rptid/838994915131/index.phtml"},
    {id:138,c:"ai",t:"特斯拉车机接入豆包大模型：豆包已搭载超700万辆车，阿里千问进深度测试",s:"东方网/澎湃新闻",d:"2026-08-02",desc:"特斯拉中国车机接入豆包大模型，阿里千问也进入特斯拉车机深度测试。豆包大模型已搭载在超过700万辆车上。同时阶跃星辰联合吉利推出整车AI智能体“超级Eva”（搭载极氪8X），上汽荣威与火山引擎打造全球首个AI原生汽车序列“家越”，AI上车全面加速。",tags:["特斯拉", "豆包", "AI上车", "智能汽车"],l:"https://nw.eastday.com/zq/zh/20260802/95568976e9687ab9a3fe949105e813d2.html"},
    {id:139,c:"business",t:"白鸦：AI撕碎固有成本体系，通用SaaS已到拐点——“中国SaaS离不开地面销售”",s:"每日经济新闻/钛媒体",d:"2026-08-01",desc:"有赞CEO白鸦深度访谈：AI把后端通用软件自研成本降到原来的5%，年费5-50万的中价位通用软件最危险（合同大多签到2027年前后）。但他坚定判断“中国SaaS离不开线下销售”：2万以上产品平均需要见面两次、5万以上三次。AI没有杀死销售，反而让有赞销售团队扩至1800-2000人。",tags:["白鸦", "有赞", "SaaS拐点", "地面销售"],l:"http://www.nbd.com.cn/rss/tonghuashun/articles/4408071.html"},
    {id:140,c:"business",t:"白鸦：前端软件壁垒反而更强——AI让“创新实践共享”成为SaaS核心价值",s:"每日经济新闻/虎嗅",d:"2026-08-01",desc:"白鸦将软件分为两端：前端（营销/销售/运营软件）核心是5万商家实践数据的共享，壁垒更强不会被AI替代；后端（财务/人力/行政）被AI低成本替代。有赞用一个不懂技术的销售运营+一个技术，两人一个半月做出年省500万的销售管理系统，每周token成本仅2万元。",tags:["白鸦", "前端软件", "后端软件", "AI替代"],l:"https://www.tmtpost.com/8002264.html"},
    {id:141,c:"data",t:"以旧换新政策带动1.25万亿销售、惠及1.69亿人次，资金撬动比升至1:10.3",s:"上海证券/东方财富",d:"2026-08-01",desc:"截至7月23日，消费品以旧换新政策累计带动相关商品销售额超1.25万亿元，惠及1.69亿人次；投入资金撬动比由去年的1:7.8提升至1:10.3。1-6月汽车以旧换新370.7万辆、家电6326.6万台，数码智能产品销量同比增13.4%、6月单月增32%。",tags:["以旧换新", "消费政策", "1.25万亿", "撬动比"],l:"https://data.eastmoney.com/report/zw_industry.jshtml?infocode=AP202608011827561329"},
    {id:142,c:"data",t:"欧盟取消小额包裹免税“满月”：91%来自中国的46亿件小包受影响，跨境直邮洗牌",s:"证券时报/东方财富",d:"2026-08-01",desc:"欧盟7月1日实施小额包裹关税新规已满月，废止150欧元以下B2C直邮包裹关税豁免，过渡期按品类每件征3欧元临时关税。2024年进入欧盟的150欧以下小包达46亿件、91%来自中国，主要通过速卖通、Temu、SHEIN直邮入境。低价直邮承压，卖家转向淘汰低价SKU、聚焦高附加值精品、布局合规海外仓。",tags:["欧盟", "关税新政", "跨境电商", "海外仓"],l:"https://stcn.com/article/detail/4053444.html"}

    {id:118,c:"ai",t:"字节跳动全面整合AI ToB：飞书+豆包+火山引擎，豆包企业版内测，ARR超40亿美元",s:"经济观察报/新京报",d:"2026-07-30",desc:"字节跳动启动面向AI业务的组织调整：飞书产品团队与豆包产品团队整合成立新的豆包产品团队；飞书GTM与火山引擎团队整合成立“创造力服务平台”。豆包企业版开启内测。截至2026年6月豆包日均Token调用量突破180万亿，字节大模型ARR达40亿美元，超过国内其他模型公司ARR总和。",tags:["字节跳动","AI ToB","豆包","飞书","火山引擎"],l:"http://www.eeo.com.cn/2026/0730/979468.shtml"},
    {id:119,c:"ai",t:"甲骨文与谷歌云扩大合作：Gemini模型进入企业应用，股价涨超8%",s:"甲骨文官网/外电",d:"2026-07-30",desc:"甲骨文与谷歌云宣布扩大合作，将Gemini模型引入甲骨文企业应用产品组合，接入Oracle AI Agent Studio，支持构建AI自动化与智能体应用。Gemini 3.1 Flash Lite与3.5 Flash将用于Fusion Applications和NetSuite嵌入式AI场景。受消息提振甲骨文股价盘中涨超8%。",tags:["甲骨文","谷歌云","Gemini","企业应用"],l:"https://www.oracle.com/europe/news/announcement/oracle-to-make-gemini-models-available-2026-07-30/"},
    {id:120,c:"ai",t:"ChinaJoy 2026开幕：人形机器人、智能眼镜、AI硬件集中爆发",s:"澎湃/太平洋电脑网",d:"2026-07-31",desc:"第二十三届ChinaJoy在上海开幕，以“与AI同游”为主题，超14万平米展区近900家企业参展。高通展示310款智能设备；宇树G1格斗机器人、逐际动力Luna人形机器人、雷鸟V4 AI眼镜集中亮相；京东集结荣耀Robot Phone、三星Z TriFold等旗舰。游戏展正被AI重写。",tags:["ChinaJoy","AI硬件","人形机器人","智能眼镜"],l:"https://m.thepaper.cn/newsDetail_forward_33643925"},
    {id:121,c:"business",t:"白鸦最新观点：AI杀死的是“臃肿”而非SaaS，先保底线再谈进化",s:"虎嗅/中国经营报",d:"2026-07-30",desc:"有赞CEO白鸦接受专访：AI杀死的是“臃肿”而非SaaS。前端SaaS壁垒因AI变强（沉淀5万商家运营经验），后端通用软件将被AI打碎重构。主张“保底线”而非“All in”——“筹码少了才会All in，留在牌桌上就够了”。有赞2026年AI智能体Token消耗费预计超1亿元，内部推行“含硅率”考核，AI收入目标占40%。",tags:["白鸦","有赞","AI杀死臃肿","保底线"],l:"https://m.huxiu.com/article/4869843.html"},
    {id:122,c:"business",t:"私域销售逆向思维：利他、真实、连续剧式朋友圈，能帮多少人就能赚多少钱",s:"小红书/销售培训",d:"2026-07-30",desc:"私域销售高手分享逆向打法：不要老板让发产品图就一天发10条，不要同行刷屏晒单就跟着晒。三大“反人性”打法：利他先给再拿、真实是最好的销售技巧、持续输出“连续剧式”朋友圈（有用/有趣/有情/有钱）。金句：线上成交本质是印象的成交，你能帮助多少人就能赚多少钱。",tags:["私域","逆向思维","朋友圈","销售打法"],l:"https://www.xiaohongshu.com/discovery/item/69c2188b00000000220016d8"},
    {id:123,c:"data",t:"二季度消费意愿指数122.8同比+2.5点，储蓄率54%创新高，近八成消费者认为AI影响决策",s:"立信数据研究院/工人日报",d:"2026-07-22",desc:"中小商业企业协会与立信数据研究院发布报告：二季度消费者消费意愿指数122.8同比上升2.5点；储蓄比重达54%创历史新高；家电数码购买意愿连续六季度居首；超半数消费者有旅游计划。近八成消费者认为AI已对消费决策产生影响，AI影响超传统媒体广告。",tags:["消费意愿","储蓄率","AI影响","消费决策"],l:"https://www.workercn.cn/c/2026-07-22/8852731.shtml"},
    {id:124,c:"data",t:"上半年快消品市场：线上快消+9%、自有品牌销售+60%、即时零售渗透率24.8%",s:"CTR洞察/纽锐拓",d:"2026-07-28",desc:"CTR/纽锐拓消费者指数显示：上半年中国城镇快消品市场销售额同比-0.3%，二季度微涨0.8%；线上快消品销售+9%；零售商自有品牌销售增长超60%，53%城镇家庭购买过自有品牌；即时零售渗透率24.8%；折扣业态渗透率7.8%；沃尔玛、盒马市场份额各增1.2个百分点。",tags:["快消品","自有品牌","即时零售","渗透率"],l:"https://www.sfccn.com/2026/7-25/wMMDE1MTRfMjE5MDAwMA.html"},
    {id:125,c:"data",t:"中国机器人出口超德国成全球第二：前5月出口199.9亿元，人形机器人占全球90%",s:"南方都市报/开源证券",d:"2026-07-31",desc:"2026年前5个月中国机器人出口199.9亿元同比+39.5%，超越德国成全球第二大机器人出口国。清洁机器人占全球出口近70%；人形和四足机器人一季度出口同比+210%，全球90%量产人形机器人来自中国。AI定义中国产业“新出海”，从卖产品到建生态。",tags:["机器人","出口","全球第二","新出海"],l:"https://www.sohu.com/a/1056919760_161795"},

  "2026-08-05": `<h1 class="dr-h1">🐝 蜜蜂情报站 · 每日深度</h1>
